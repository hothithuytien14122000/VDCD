<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype khảo sát hài lòng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F3;--line:#E7E5E2;--line2:#EFEDEA;--text:#1C1B1A;--muted:#6B6762;--muted2:#57534E;--accent:#A3201B;--accent-soft:#FBEDEC;--err:#B42318;--chg:#8A3B00;--chg-bg:#FDE7D3;--be:#0B4A8F;--be-bg:#E3EEFB;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* Khung điều hướng luồng */
.bar{background:#151413;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex:0 0 auto}
.bar b{font-size:14.5px;white-space:nowrap}
.bar .cur{font-size:13px;color:#C9C6C1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{height:32px;padding:0 12px;border-radius:8px;border:1px solid #3A3734;background:#24221F;color:#fff;font-size:12.5px;white-space:nowrap}
.bar button:disabled{opacity:.35;cursor:not-allowed}
.bar button.pri{background:var(--accent);border-color:var(--accent)}
.body{flex:1;display:flex;min-height:0}
nav{flex:0 0 290px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px 10px 24px}
.ov{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text)}
.ov.on,.it.on{background:var(--accent-soft)}
nav .gh{margin:16px 10px 2px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gd{margin:0 10px 6px;font-size:11.5px;color:var(--muted)}
.it{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;align-items:flex-start;color:var(--text)}
.it:hover,.ov:hover{background:#F3F1EE}
.it .no{flex:0 0 30px;height:22px;border-radius:6px;background:#F3F1EE;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.it.on .no{background:var(--accent);color:#fff}
.it .tx{font-size:13px;line-height:1.4}
main{flex:1;min-width:0;overflow:auto}

/* Trang màn hình */
.wrap{padding:22px 24px 48px;max-width:1640px}
.sh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.sh h1{margin:0;font-size:20px}
.sh .fl{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.sh .ac{font-size:12.5px;color:var(--muted2);flex-basis:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1280px){.grid{grid-template-columns:minmax(0,1fr)}}
.fscroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.notes{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:sticky;top:0}
.notes h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.notes ul{margin:0 0 14px;padding-left:18px;font-size:12.5px;line-height:1.65;color:var(--muted2)}
.notes code,.api code{font-size:11.5px;background:#F3F1EE;border-radius:4px;padding:1px 5px;color:var(--text);word-break:break-all}
.api{display:flex;flex-direction:column;gap:6px;font-size:12px}
.nextb{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.chg{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;color:var(--chg);background:var(--chg-bg);border-radius:4px;padding:1px 6px;white-space:nowrap;vertical-align:1px}
.be{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;color:var(--be);background:var(--be-bg);border-radius:4px;padding:1px 6px;white-space:nowrap;vertical-align:1px}

/* Trang tổng quan */
.home{padding:26px 28px 48px;max-width:1180px;display:flex;flex-direction:column;gap:16px}
.home h1{margin:0;font-size:22px}
.home .sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.box h2{margin:0 0 4px;font-size:15px}
.box p.d{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.box ul{margin:0;padding-left:18px;font-size:13px;line-height:1.75;color:var(--muted2)}
.sm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
.sm .ar{color:#A8A49E}
.sm .lb{font-size:11.5px;color:var(--muted)}
.mx{width:100%;border-collapse:collapse;font-size:12.5px}
.mx th,.mx td{border-top:1px solid var(--line2);padding:8px 10px;text-align:left;vertical-align:top}
.mx th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#FAF9F7}
.mx td.y{color:#17603A;font-weight:600}
.mx td.n{color:#B5B1AB}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.fc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FAF9F7;text-align:left;width:250px;display:flex;flex-direction:column;gap:3px;color:var(--text)}
.fc:hover{border-color:var(--accent);background:var(--accent-soft)}
.fc .n{font-size:11px;font-weight:700;color:var(--accent)}
.fc .t{font-size:13px;font-weight:600}
.fc .w{font-size:11.5px;color:var(--muted2);line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pm{width:100%;border-collapse:collapse;font-size:12.5px}
.pm th,.pm td{border-top:1px solid var(--line2);padding:7px 10px;text-align:left;vertical-align:top}
.pm th{font-size:11px;letter-spacing:.03em;color:var(--muted);background:#FAF9F7;font-weight:600}
.pm td:last-child{text-align:left;white-space:nowrap}
.pm tr.g td{background:#FAF9F7;font-weight:600;color:var(--text)}
.pm .ok{color:#17603A;font-weight:700}.pm .no{color:#C9C5BF}
.pm tr.cur td{background:var(--accent-soft)}
.pm .sl{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 6px;font-size:11px;color:var(--accent);font-weight:600;margin-right:3px;cursor:pointer}
.rl{margin:10px 0 0;padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--muted2)}
.fw{display:flex;flex-direction:column;gap:10px}
.fk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FAF9F7}
.fk h4{margin:0 0 8px;font-size:13px}
.fk h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.fs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px}
.fs .ar{color:#A8A49E}
.st0{display:inline-flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}
.st0:hover{border-color:var(--accent)}
.st0 .ac{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.st0 .ac.a1{color:#1F5FAE}.st0 .ac.a2{color:#8A3B00}.st0 .ac.a3{color:#57534E}
.st0 .tx{font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lgd{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.lgd b.a1{color:#1F5FAE}.lgd b.a2{color:#8A3B00}.lgd b.a3{color:#57534E}
@media (max-width:900px){.two{grid-template-columns:1fr}nav{display:none}}

/* ===== Ứng dụng giả lập ===== */
.app{--a:#B10E1C;display:flex;min-width:1240px;min-height:820px;background:#FAF9F8;position:relative;font-size:13.5px;color:#141414}
.side{flex:0 0 244px;background:#151413;color:#C9C6C1;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 20px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.brand b{display:block;font-size:14px;font-weight:600;color:#fff}.brand span{font-size:11px;color:#A8A49E}
/* Menu trái cùng kiểu prototype phân hệ D: nhóm chữ trắng đậm + ⌄, mục con thụt lề, mục đang mở nền nâu đỏ */
.menu{flex:1;display:flex;flex-direction:column;gap:2px}
.mi0,.mg,.mi{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;font-size:13px;color:#C9C6C1}
.mi0:hover,.mg:hover,.mi:hover{background:#24221F;color:#fff}
.mg{color:#fff;font-weight:600;margin-top:6px}
.mg .chv{color:#8E8A85;font-weight:400}
.mi{padding-left:28px;font-size:12.5px;color:#A8A49E}
.mi.on,.mi.on:hover{background:#2C1A18;color:#fff}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 8px 0;border-top:1px solid #2A2826}
.av{width:32px;height:32px;border-radius:50%;background:#3A3734;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.who b{display:block;font-size:13px;font-weight:500;color:#fff}.who span{font-size:11px;color:#A8A49E}
.am{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{height:56px;border-bottom:1px solid #E8E6E4;display:flex;align-items:center;padding:0 28px;font-size:12.5px;color:#6E6E73;gap:8px}
.tb b{color:#141414;font-weight:500}
.bell{margin-left:auto;position:relative;width:34px;height:34px;border-radius:10px;border:1px solid #E8E6E4;display:flex;align-items:center;justify-content:center;font-size:15px;background:#fff}
.bell i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#D92D20;color:#fff;font-style:normal;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.npn{position:absolute;top:52px;right:20px;width:400px;background:#fff;border:1px solid #E8E6E4;border-radius:14px;box-shadow:0 16px 40px rgba(20,20,20,.16);z-index:6;overflow:hidden}
.npn .nh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #F0EEEC}
.npn .nh h3{font-size:14px;margin:0}.npn .nh span{font-size:12px;color:#2563EB}
.npn .nf{display:flex;gap:6px;padding:10px 16px 4px}.npn .nf b{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:#F3F2F1;color:#6E6E73}.npn .nf b.on{background:#141414;color:#fff}
.npn .ni{display:flex;gap:10px;padding:12px 16px;border-top:1px solid #F5F4F3;font-size:12.5px;line-height:1.5;color:#3A3A3C}
.npn .ni.un{background:#F6F9FF}.npn .ni .dt0{width:8px;height:8px;border-radius:4px;background:#2563EB;margin-top:6px;flex:none}.npn .ni .dt0.rd{background:transparent}
.npn .ni b{display:block;color:#141414;font-weight:600}.npn .ni small{display:block;color:#8E8E93;margin-top:2px}
.pg{padding:24px 28px 32px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ph h2{margin:0;font-size:24px;line-height:1.3;letter-spacing:-.01em;display:flex;align-items:flex-start;gap:10px}
.ph>div:first-child{flex:1;min-width:0}
.ph h2 .st,.ph h2 .scope{flex:none;margin-top:6px}
.ph p{margin:4px 0 0;font-size:12.5px;color:#6E6E73}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.back{width:34px;height:34px;border:1px solid #E8E6E4;border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.b{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid #DAD7D3;background:#fff;color:#141414;white-space:nowrap}
.b:hover{background:#F5F3F1}
.b.p{background:var(--a);border-color:var(--a);color:#fff}
.b.p:hover{background:#930B17}
.b.dk{background:#141414;border-color:#141414;color:#fff}
.b.dg{color:var(--a);border-color:#F0C4C7}
.b.s{height:30px;padding:0 10px;font-size:12.5px}
.b.gh{border-color:transparent;background:transparent;color:#3A3A3C}
.b.gh:hover{background:#F0EEEC}
.b[disabled]{opacity:.45;cursor:not-allowed}
.pn{background:#fff;border:1px solid #E8E6E4;border-radius:12px}
.pn-h{padding:14px 18px;border-bottom:1px solid #F0EEEC;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pn-h h3{margin:0;font-size:14.5px}
.pn-h small{display:block;font-size:11.5px;color:#6E6E73;font-weight:400;margin-top:2px}
.pn-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #F0EEEC;padding:0 14px}
.tab{padding:13px 8px;font-size:13px;color:#6E6E73;border-bottom:2px solid transparent;margin-right:12px}
.tab.on{color:#141414;font-weight:600;border-bottom-color:var(--a)}
.flt{display:flex;gap:10px;padding:14px 18px;flex-wrap:wrap}
.in{height:38px;border:1px solid #DAD7D3;border-radius:8px;padding:0 12px;font-size:13px;background:#fff;color:#141414;display:flex;align-items:center;justify-content:space-between;gap:8px}
.in.ph0{color:#A6A6AB}
.in.err{border-color:var(--err);background:#FEF3F2}
.in.ro{background:#F5F3F1;color:#6E6E73}
textarea.in,.ta{height:auto;min-height:70px;padding:10px 12px;align-items:flex-start}
.fr{display:grid;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:12.5px;font-weight:600}
.f label i{color:var(--a);font-style:normal}
.f .e,.e0{font-size:11.5px;color:var(--err)}
.f .h{font-size:11.5px;color:#6E6E73}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6E6E73;text-align:left;padding:10px 14px;border-top:1px solid #F0EEEC;border-bottom:1px solid #F0EEEC;background:#FCFBFA;white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid #F0EEEC;vertical-align:middle;font-size:13px}
.t tr.hl td{background:#FFF8F2}
.t .cd{color:#6E6E73;font-size:12.5px;white-space:nowrap}
.t .nm b{font-weight:600}
.t .nm .rj{display:block;font-size:11.5px;color:var(--a);margin-top:3px}
.t .dt{font-size:12.5px;line-height:1.45;white-space:nowrap}
.t .r{text-align:right}
.ra{display:flex;gap:2px;justify-content:flex-end}
.mts{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.mt{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:6px;background:#F3F2F1;color:#2C2C2E;font-size:12px;font-weight:500;line-height:1;white-space:nowrap;vertical-align:middle}
.mic{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mt-on .mic,.mic.mic-on{color:#1D63C4}
.mt-direct .mic,.mic.mic-direct{color:#7A3FC2}
.mt-paper .mic,.mic.mic-paper{color:#B25E09}
.chk b .mic,.mb .mh .mic{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.scope{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:1px solid #E8E6E4;background:#fff;color:#3A3A3C;font-size:12px;font-weight:500;vertical-align:middle;margin-left:8px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{background:#F0EEEC;color:#6E6E73}
.st-pending{background:#FDF3DC;color:#8A5A00}
.st-rejected{background:#FCE8E9;color:#B10E1C}
.st-approved{background:#E6F4EC;color:#17603A}
.st-running{background:#E3EEFB;color:#0B4A8F}
.st-finished{background:#ECEBEA;color:#3A3A3C}
.pgn{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:12.5px;color:#6E6E73}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.kv>div>span{display:block;font-size:11.5px;color:#6E6E73;margin-bottom:4px}
.kv>div>b{font-weight:500;font-size:13.5px}
.kv .w3{grid-column:1/-1}
.qg{border-top:1px solid #F0EEEC;padding-top:12px}
.qg:first-child{border-top:0;padding-top:0}
.qgh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:6px}
.qgh small{font-weight:400;color:#6E6E73;margin-left:6px}
.q{display:flex;gap:12px;padding:6px 0;font-size:13.5px}
.q .no{color:#6E6E73;width:20px;flex:0 0 20px}
.qe{display:flex;gap:8px;align-items:center;padding:5px 0}
.qe .no{color:#6E6E73;width:20px;flex:0 0 20px;font-size:13px}
.qe .in{flex:1}
.ib{width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:7px;color:#6E6E73;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:#F0EEEC}
.chk{display:flex;gap:10px;align-items:flex-start;border:1px solid #E8E6E4;border-radius:10px;padding:12px 14px;cursor:pointer;user-select:none}
.chk:hover{border-color:#CFCBC6}
.ab .m{cursor:pointer}
.chk.on{border-color:var(--a);background:#FFF9F9}
.cb{width:18px;height:18px;border:1.5px solid #B9B6B2;border-radius:5px;flex:0 0 18px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.chk.on .cb{background:var(--a);border-color:var(--a)}
.chk b{display:block;font-size:13.5px;font-weight:600}
.chk span{font-size:12px;color:#6E6E73;line-height:1.45}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.pn-h .scl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#6E6E73;white-space:nowrap}
.pn-h .scl .lv{font-size:11.5px;padding:2px 9px}
.lv{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.lv.y{background:#E6F4EC;color:#17603A}.lv.n{background:#FCE8E9;color:#B10E1C}
.al{border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.al::before{content:"i";flex:0 0 18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.al.r::before{content:"!"}
.al b{display:block;font-size:13px;margin-bottom:1px}
.al.r{background:#FCE8E9;color:#7A0A13}
.al.y{background:#FDF3DC;color:#6B4600}
.al.bl{background:#E3EEFB;color:#0B3A70}
.al.g{background:#E6F4EC;color:#11502F}
.hist{display:flex;flex-direction:column;gap:14px}
.hi{display:flex;gap:12px}
.hi .dot{width:9px;height:9px;border-radius:50%;background:#141414;margin-top:5px;flex:0 0 9px}
.hi b{font-size:13px;font-weight:600;display:block}
.hi span{font-size:11.5px;color:#6E6E73}
.hi p{margin:4px 0 0;font-size:12.5px;color:#7A0A13;background:#FCE8E9;border-radius:6px;padding:6px 8px}

/* ---------- Chi tiết đợt ---------- */
function qr(off){
  var s='',seed=7;
  function f(x,y){function inF(a,b){return x>=a&&x<a+7&&y>=b&&y<b+7;}
    var fs=[[0,0],[14,0],[0,14]];
    for(var i=0;i<3;i++){var a=fs[i][0],b=fs[i][1];if(inF(a,b)){var dx=x-a,dy=y-b;return dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4);}}
    seed=(seed*9301+49297)%233280;return seed/233280>.52;}
  for(var y=0;y<21;y++)for(var x=0;x<21;x++)s+='<i'+(f(x,y)?' class="k"':'')+'></i>';
  return '<div class="qr'+(off?' off':'')+'">'+s+'</div>';
}

  var n=0;

document.addEventListener('click',function(e){
  var m=e.target.closest('.ab .m');
  if(m){[].forEach.call(m.parentNode.querySelectorAll('.m'),function(x){x.classList.toggle('on',x===m);});return;}
  var c=e.target.closest('.chk');if(!c)return;
  var box=c.parentNode, cb=c.querySelector('.cb');
  if(c.classList.contains('rd')){[].forEach.call(box.querySelectorAll('.chk.rd'),function(x){x.classList.toggle('on',x===c);x.querySelector('.cb').textContent=x===c?'•':'';});return;}
  c.classList.toggle('on');cb.textContent=c.classList.contains('on')?'✓':'';
  var n=box.querySelectorAll('.chk.on').length, er=box.querySelector('.e');
  if(!n&&!er){er=document.createElement('span');er.className='e';er.style.cssText='font-size:11.5px;color:#B42318';er.textContent='Chọn ít nhất 1 hình thức';box.appendChild(er);}
  if(n&&er)er.parentNode.removeChild(er);
  var pg=c.closest('.pg')||document;
  [].forEach.call(pg.querySelectorAll('.ck div'),function(x){if(x.textContent.indexOf('Có ít nhất 1 hình thức')>=0){x.className=n?'ok':'no';x.textContent=(n?'✓ ':'✕ ')+'Có ít nhất 1 hình thức';}});
});
