# ============================================================
# API Helpers Template — ui-flow-test-generator skill
# Format version: 2.0
# ============================================================
# Usage:
#   - scaffolded by : scripts/generate_scripts.py
#   - output path   : {testing-root}/setup/api-helpers.ts
#   - scaffold_once : true  →  only written if file does not already exist
#   - referenced by : generated .spec.ts files via
#                     import { ... } from '../../setup/api-helpers'
#
# Design intent:
#   This file provides GENERIC, reusable fetch-mocking primitives that work
#   with any UI — whether the deployment uses MSW, standard network mocking,
#   or no mocking at all.
#
#   App-specific mock data (e.g. MOCK_APPROVALS, MSW_DATA) MUST be added
#   directly to this file by the AI after reading the page spec, NOT embedded
#   in this template.  The template only ships the primitive helpers.
#
# Two mock strategies — choose based on deployment:
#
#   Strategy A — page.route()  (standard, no MSW)
#     Use mockWithRoute() when the deployment does NOT use MSW.
#     Playwright intercepts at the network layer before the request leaves
#     the browser.
#
#   Strategy B — page.addInitScript()  (MSW-aware)
#     Use overrideFetchWithMock() / overrideFetchWithStatus() when the
#     deployment uses MSW (detectable by NEXT_PUBLIC_ENABLE_MOCKS=true or
#     when page.route() has no visible effect).
#     addInitScript runs before any page JS, so window.fetch is replaced
#     before MSW installs its own ServiceWorker fetch handler.
#     MUST be called before page.goto().
# ============================================================

meta:
  output_path: "setup/api-helpers.ts"
  description: "Generic Playwright API mock primitives — reusable across all UI test suites"
  scaffold_once: true

# ── Scaffolded TypeScript code ────────────────────────────────────────────────
# Written verbatim to `output_path` by generate_scripts.py on first use.
# Update the template here; existing project files are never overwritten
# (scaffold_once: true).
#
# After scaffolding, the AI MUST extend this file with:
#   1. App-specific MSW_DATA or MOCK_* constants (reading from the spec)
#   2. Any app-specific helper wrappers that call the primitives below

code: |
  import type { Page } from '@playwright/test';

  // ─── Strategy A: page.route() — Standard network interception ──────────────
  //
  // Use when the deployment does NOT use MSW (Mock Service Worker).
  // Playwright intercepts requests at the network layer.
  // Safe to call before OR after page.goto().
  //
  // LIMITATION: Does NOT work when MSW is active — MSW intercepts fetch()
  // inside the browser JS runtime before the request reaches the network.
  // If mocks have no visible effect, switch to Strategy B below.

  /**
   * Intercept all requests matching `urlPattern` (glob) and return `data` as
   * a 200 JSON response via Playwright's network layer.
   *
   * @param urlPattern  Playwright glob pattern, e.g. `'**/api/tasks/**'`
   * @param data        JSON-serialisable response body
   * @param status      HTTP status code (default: 200)
   *
   * @example
   *   await mockWithRoute(page, '**/api/foundry/approvals**', { items: [], totalCount: 0 });
   *   await page.goto('/sa/approvals');
   */
  export async function mockWithRoute(
    page: Page,
    urlPattern: string,
    data: object,
    status = 200,
  ): Promise<void> {
    await page.route(urlPattern, (route) =>
      route.fulfill({
        status,
        contentType: 'application/json',
        body: JSON.stringify(data),
      }),
    );
  }

  // ─── Strategy B: addInitScript() — MSW-aware fetch override ────────────────
  //
  // Use when the deployment runs MSW (Mock Service Worker).
  // addInitScript() injects code that runs before ANY page script, including
  // MSW setup — so window.fetch is replaced before the ServiceWorker can
  // install its own handler.  MUST be called before page.goto().

  /**
   * Override window.fetch before any page scripts run (including MSW) so that
   * requests whose URL contains `urlPattern` return `mockData` as a 200 JSON
   * response, bypassing the network entirely.
   *
   * Optional `excludePattern` allows sub-routes to pass through normally
   * (e.g. exclude '/decide' when mocking a list endpoint but not its action).
   *
   * MUST be called before page.goto().
   *
   * @param urlPattern      Matched via url.includes(pattern)
   * @param mockData        JSON body returned as 200 OK
   * @param excludePattern  If set, URLs also containing this string are NOT mocked
   *
   * @example
   *   // Empty approvals list, but let /decide through:
   *   await overrideFetchWithMock(page, '/api/foundry/solution-authority/approvals',
   *                                { items: [], totalCount: 0 }, '/decide');
   *   await page.goto('/sa/approvals');
   */
  export async function overrideFetchWithMock(
    page: Page,
    urlPattern: string,
    mockData: object,
    excludePattern?: string,
  ): Promise<void> {
    await page.addInitScript(
      ({ pattern, exclude, data }: { pattern: string; exclude?: string; data: unknown }) => {
        const orig = window.fetch.bind(window);
        window.fetch = (
          input: Parameters<typeof fetch>[0],
          init?: Parameters<typeof fetch>[1],
        ) => {
          const url =
            typeof input === 'string'
              ? input
              : input instanceof Request
                ? input.url
                : String(input);
          const matches = url.includes(pattern) && (!exclude || !url.includes(exclude));
          if (matches) {
            return Promise.resolve(
              new Response(JSON.stringify(data), {
                status: 200,
                headers: { 'Content-Type': 'application/json' },
              }),
            );
          }
          return orig(input, init);
        };
      },
      { pattern: urlPattern, exclude: excludePattern, data: mockData },
    );
  }

  /**
   * Override window.fetch to return a specific HTTP error status for requests
   * whose URL contains `urlPattern`.  Use to simulate 409, 404, 500 etc.
   *
   * MUST be called before page.goto().
   *
   * @param urlPattern  Matched via url.includes(pattern)
   * @param status      HTTP status code to return (e.g. 409, 404, 500)
   * @param body        JSON body to return alongside the status
   *
   * @example
   *   // Simulate 409 on the decide endpoint:
   *   await overrideFetchWithStatus(page, '/decide', 409, { message: 'Already decided' });
   *   await page.goto('/sa/approvals');
   */
  export async function overrideFetchWithStatus(
    page: Page,
    urlPattern: string,
    status: number,
    body: object,
  ): Promise<void> {
    await page.addInitScript(
      ({ pattern, status, data }: { pattern: string; status: number; data: unknown }) => {
        const orig = window.fetch.bind(window);
        window.fetch = (
          input: Parameters<typeof fetch>[0],
          init?: Parameters<typeof fetch>[1],
        ) => {
          const url =
            typeof input === 'string'
              ? input
              : input instanceof Request
                ? input.url
                : String(input);
          if (url.includes(pattern)) {
            return Promise.resolve(
              new Response(JSON.stringify(data), {
                status,
                headers: { 'Content-Type': 'application/json' },
              }),
            );
          }
          return orig(input, init);
        };
      },
      { pattern: urlPattern, status, data: body },
    );
  }

  /**
   * Override window.fetch for requests matching `urlPattern` BUT NOT any of
   * `excludePatterns`. Use when the same base URL serves multiple sub-routes
   * and you only want to mock the primary list endpoint (e.g. mock
   * `/build-records` but let `/build-records/artifact-keys` pass through).
   *
   * MUST be called before page.goto().
   *
   * @example
   *   await overrideFetchWithMockExcludeMany(page,
   *     '/api/foundry/solution-authority/build-records',
   *     { items: [], totalCount: 0 },
   *     ['/artifact-keys', '/compilers', '/compiler-versions']);
   */
  export async function overrideFetchWithMockExcludeMany(
    page: Page,
    urlPattern: string,
    mockData: object,
    excludePatterns: string[],
  ): Promise<void> {
    await page.addInitScript(
      ({ pattern, excludes, data }: { pattern: string; excludes: string[]; data: unknown }) => {
        const orig = window.fetch.bind(window);
        window.fetch = (
          input: Parameters<typeof fetch>[0],
          init?: Parameters<typeof fetch>[1],
        ) => {
          const url =
            typeof input === 'string'
              ? input
              : input instanceof Request
                ? input.url
                : String(input);
          const matches = url.includes(pattern) && !excludes.some((ex) => url.includes(ex));
          if (matches) {
            return Promise.resolve(
              new Response(JSON.stringify(data), {
                status: 200,
                headers: { 'Content-Type': 'application/json' },
              }),
            );
          }
          return orig(input, init);
        };
      },
      { pattern: urlPattern, excludes: excludePatterns, data: mockData },
    );
  }

  /**
   * Override window.fetch to return a specific HTTP error status for requests
   * matching `urlPattern` BUT NOT any of `excludePatterns`.
   *
   * MUST be called before page.goto().
   *
   * @example
   *   await overrideFetchWithStatusExcludeMany(page,
   *     '/api/foundry/solution-authority/build-records',
   *     500, { message: 'Internal Server Error' },
   *     ['/artifact-keys', '/compilers']);
   */
  export async function overrideFetchWithStatusExcludeMany(
    page: Page,
    urlPattern: string,
    status: number,
    body: object,
    excludePatterns: string[],
  ): Promise<void> {
    await page.addInitScript(
      ({ pattern, status, data, excludes }: { pattern: string; status: number; data: unknown; excludes: string[] }) => {
        const orig = window.fetch.bind(window);
        window.fetch = (
          input: Parameters<typeof fetch>[0],
          init?: Parameters<typeof fetch>[1],
        ) => {
          const url =
            typeof input === 'string'
              ? input
              : input instanceof Request
                ? input.url
                : String(input);
          const matches = url.includes(pattern) && !excludes.some((ex) => url.includes(ex));
          if (matches) {
            return Promise.resolve(
              new Response(JSON.stringify(data), {
                status,
                headers: { 'Content-Type': 'application/json' },
              }),
            );
          }
          return orig(input, init);
        };
      },
      { pattern: urlPattern, status, data: body, excludes: excludePatterns },
    );
  }

  // ─── App-specific constants and helpers ────────────────────────────────────
  //
  // Add feature-specific mock data and helper wrappers below this line.
  // The AI extends this section after reading the spec for each new UI.
  //
  // Convention:
  //   MOCK_<FEATURE>   — mock data object with named preset keys
  //   <FEATURE>_DATA   — MSW-served data constants (field values used in assertions)
  //
  // Example (Approval Queue):
  //
  //   export const MOCK_APPROVALS = {
  //     emptyQueue: { items: [], totalCount: 0 },
  //   };
  //
  //   export const MSW_DATA = {
  //     totalCount: 7,
  //     firstItem: { artifactKey: 'fraud-detection-agent', riskClass: 'High risk', ... },
  //   };
