# ============================================================
# SPEC TEMPLATE v2.0 — ui-flow-test-generator
#
# Fill this at Step 2 → save as $TESTING_ROOT/spec/ui/{feature}-spec.yaml.
# It is then the SOLE input to generate_test_cases.py.
#
# ⛔ The authoring POLICY for every block below lives in
#    references/spec-synthesis.md (read in full at Step 2, before this file).
#    This file carries only the schema, the field meanings, and fill-in SHAPES.
#
# RULE ID CONVENTION:
#   UF-xxx = User Flow · VAL-xxx = Validation · BR-xxx = Business Rule
#   UI-xxx = UI Behavior · ER-xxx = Error Catalogue · ENF-xxx = Enforcement Guard
#
# MISSING VALUES — never invent: string → "[MISSING — <reason>]", list → [], number → 0.
# ============================================================

# ── METADATA ──────────────────────────────────────────────────────────────────

title: ""               # REQUIRED — human-readable feature name, e.g. "My Tasks"
slug: ""                # REQUIRED — kebab-case, e.g. "tasks-mine" (matches file name)
date: ""                # REQUIRED — YYYY-MM-DD when this spec was synthesized
updated: ""             # REQUIRED — YYYY-MM-DD of last update
author: "AI"            # who synthesized this spec
status: "draft"         # draft | reviewed | approved
module: ""              # REQUIRED — e.g. "command-center", "case-acceptance"
page_url: ""            # REQUIRED — full URL or relative path under test, e.g. "/tasks/mine"
work_item_id: ""        # REQUIRED — Azure DevOps work item this run reports to ($WORK_ITEM_ID)

# ── PROVENANCE (REQUIRED) ─────────────────────────────────────────────────────
# policy → references/spec-synthesis.md §2d
run_backend_mode: ""    # REQUIRED — real | mock ($BACKEND_MODE)

# ── Spec version under test — HARD GATE, generate_test_cases.py exits 1 if unset ──
# Copy all three VERBATIM from the "spec-yaml provenance block" that resolve_specs.py
# prints at 2a. The only authority is `version:`/`grammar:` in the VIF frontmatter —
# never re-type from memory, a spec_ref string, or a git log. VIF has no version:
# STOP and ask PnC. These propagate to the test-cases yaml, the spec.ts banner and
# the report's Spec Version row.
vif_id: ""              # REQUIRED — e.g. "VIF-KNW-001"
vif_version: ""         # REQUIRED — e.g. "1.6.0"
vif_grammar: ""         # REQUIRED — "0.4", or "0.3" (allowed, flagged as a fallback)
source_specs: []        # REQUIRED — every oracle read, each WITH its version:
                        #     - "VIF-GOV-005_Optimization_Directives.md v1.7.0 (updated 2026-08-11)"
                        #     - "UC-GOV-041 v0.2.3"
                        #     - "CT-GOV-011 v0.3.0"
                        #   Halt and ask rather than guessing a version.
supersedes: ""          # OPTIONAL — the `date:` of the version this run replaces.

# spec_format picks the TC builder in generate_test_cases.py:
#   "descriptive" — TARGET.md style specs (screens/entities/state-machine)
#   "structured"  — specs with explicit UF/VAL/BR/UI rule IDs
spec_format: "descriptive"   # REQUIRED — descriptive | structured

# ── PROBLEM STATEMENT ─────────────────────────────────────────────────────────

problem_statement: |
  # REQUIRED — 1-2 sentences on what this feature solves and why it exists.
  # Example: "Users assigned to a dental case need a guided workspace to
  # review patient information and complete a structured form without leaving
  # the shell. The task screen must handle missing form definitions gracefully."

# ── PRIMARY USERS & ROLES ─────────────────────────────────────────────────────

roles:                  # REQUIRED — role name strings; drives RBAC TCs
  - "authenticated_user"

default_role: "authenticated_user"  # REQUIRED — role used in test preconditions

role_definitions:       # OPTIONAL — feeds the permissions matrix below
  - name: "authenticated_user"
    access_level: "Full"        # Full | Read-only | None
    description: "Standard authenticated user with access to assigned tasks"

# ── SCREENS & STATES ──────────────────────────────────────────────────────────
# REQUIRED — every page/screen variant visible from page_url. `id`: ROW-N or SCREEN-N.

screens:
  - id: "ROW-1"
    name: ""            # REQUIRED — human-readable screen name
    states:             # minimum: Default, Loading, Empty, Error
      - "Default"
      - "Loading"
      - "Empty"
      - "Error"
      # add more as the spec declares, e.g. "Config Error", "Task Screen (HasConfigError)"

# ══ `assert:` — THE MACHINE-READABLE ORACLE ═══════════════════════════════════
# ⛔ READ THIS ONCE, THEN FILL IT AT ALL SEVEN ATTACHMENT POINTS BELOW.
#
# Prose (`system_response`, `display`, `clause`, …) is what a HUMAN reads in review.
# `assert:` is the only thing that becomes an `expect()`. A section with prose and no
# `assert:` renders a test with NO ASSERTION AT ALL and reports PASS whatever the app
# does — 775 of 2016 tests (38%) were in that state before this block existed.
# Write BOTH. They are not redundant.
#
# `generate_scripts.compile_assertions()` translates each entry 1:1 with no inference,
# and RAISES on anything it does not recognise — a malformed oracle fails generation
# rather than silently emitting an empty test. The vocabulary is CLOSED; one key per
# entry selects the form:
#
#   assert:
#     - text: "Goal created"          # copy is on screen (substring, case-sensitive)
#     - text: "Deactivate"            # …or must NOT be
#       absent: true
#     - text: "No goals set."
#       in: "main"                    # OPTIONAL CSS scope
#     - element: "#sg-target"         # CSS selector, or role=button[name=Set Goal]
#       state: editable               # visible|hidden|enabled|disabled|editable|focused|
#                                     #   empty|checked
#     - rows: ">0"                    # =0 · >0 · >=2 · <5 …
#       of: "tbody tr"                # OPTIONAL; defaults to tbody tr
#     - attr: "aria-expanded"
#       "on": "[data-slot=accordion-trigger]"  # QUOTE the key — YAML 1.1 reads bare
#       equals: "false"                        #   `on` as the boolean True
#     - url: "/governance/goals"
#
# THE SEVEN ATTACHMENT POINTS (the builders read `assert` from these and nowhere else):
#   user_flows[].steps[].assert     → emitted IN POSITION, right after that step's code
#   user_flows[].assert             → emitted at the END, the whole flow's final outcome
#   state_defaults[].assert         → boot-state TC (only rows with `observable: control`)
#   a11y_requirements[].assert      → a11y TC, one per clause group
#   enforcement_guards[].assert     → negative guard TC — assert the observable
#                                     consequence, never the wire code
#   vif_acceptance_criteria[].assert → AC-gap TC
#   error_precedence[].assert       → precedence TC; `display` almost always already
#                                     quotes the copy — lift it verbatim
#
# FOUR RULES:
#  1. GROUND EVERY SELECTOR IN THE ELEMENT MAP. `#sg-target` because analyze_page.py
#     found that id. A selector that matches nothing asserts nothing.
#  2. WRITE WHAT THE SPEC STATES, NOT WHAT THE APP DOES. A spec-grounded oracle going
#     RED against the deployed build is the POINT (that is how bug #147303 was found).
#     Relaxing it to match the app is absorption — see Spec Supremacy in SKILL.md.
#  3. ATTACH TO THE STEP THAT PRODUCES THE STATE, not to the flow as a whole. An
#     `element: role=dialog, state: visible` on the open step and `state: hidden` on the
#     submit step is correct and must not be merged.
#  4. NO DERIVABLE ASSERTION IS A FINDING, NOT A BLANK. Say so in the row rather than
#     leaving `assert:` off silently — the Step 4.5 gate names every TC that renders
#     without an oracle and BLOCKS on it (dimension 7 → 2, exit 1).
#
# full policy → references/spec-synthesis.md §2c-assert
# ══════════════════════════════════════════════════════════════════════════════

# ── USER FLOWS ─────────────────────────────────────────────────────────────────
# Each flow → 1 happy-path TC. `expected_outcome` becomes expected_result verbatim.

user_flows:
  - id: "UF-001"                 # REQUIRED
    name: ""                     # REQUIRED — e.g. "Complete assigned task"
    actor: ""                    # REQUIRED — role name
    entry_point: ""              # REQUIRED — URL or triggering UI element
    preconditions:
      - ""                       # REQUIRED — at least one condition
    steps:
      - action: ""               # REQUIRED — what the user does
        system_response: ""      # REQUIRED — what the system shows/does
        # data_dependency — REQUIRED on every generated TC step: any | seed | fixture | mock-only
        #   vocabulary + the "any means passes on an EMPTY database" boundary:
        #   references/test-case-generation.md §4b. Never leave a step untagged.
        assert: []               # REQUIRED — the step's oracle, emitted IN POSITION.
                                 #   Vocabulary: the `assert:` block above. Leaving this
                                 #   empty on every step renders the happy path with no
                                 #   expect() and the Step 4.5 gate blocks the run.
    expected_outcome: "[MISSING — describe what success looks like]"  # REQUIRED
    assert: []                   # REQUIRED — the FLOW's final outcome, emitted at the end.
                                 #   `expected_outcome` in prose; this in the vocabulary.
    failure_modes: []            # OPTIONAL — VAL/BR/ER IDs that can block this flow

# ── VALIDATION RULES ──────────────────────────────────────────────────────────
# Each VAL → 1 negative TC + boundary TCs when min/max present.
# policy → references/spec-synthesis.md §2c-validation (4 dimensions + lifecycle)

validations:
  - id: "VAL-001"                # REQUIRED
    field: ""                    # REQUIRED — field name as it appears in element-map
    constraint: "required"       # REQUIRED — required | min-max | format | unique | enum
                                 #   `unique`  → emits the Duplicate TC family
                                 #   `format`  → suppresses the Special-characters TC for
                                 #               this field (a declared character class
                                 #               means not every character is legal)
    description: ""              # REQUIRED — human-readable rule description
    error_messages:
      - "[MISSING — exact error text shown in UI]"   # REQUIRED — exact string, asserted verbatim
                                   # UI shows no error at all → "[MISSING — no error message found in spec]"

# ── BUSINESS RULES ─────────────────────────────────────────────────────────────
# Each BR → 1 conditional logic test. policy → references/spec-synthesis.md §2c-visual

business_rules:
  - id: "BR-001"                 # REQUIRED
    name: ""                     # REQUIRED — short rule name
    condition: ""                # REQUIRED — "When <condition>"
    expected_outcome: ""         # REQUIRED — "Then <system does X>"
    visual_assertions:           # OPTIONAL — only for color/variant/style/animation rules
      - type: "has-class"        # has-class | has-attribute | has-style | has-animation
        selector_scope: ""       # locator hint, e.g. "[data-slot='card']:has-text('UC-SF-003') [data-slot='badge']"
        value: ""                # CSS class substring to assert, e.g. "bg-green-500"
        note: ""                 # source file + line, e.g. "releases-badges.tsx:8 ENV_STYLES.Production"
    alternate_values:            # OPTIONAL — enum/threshold variants the single live record cannot render;
                                 #   each entry mutates the data API response so the variant renders
      - field: ""                # JSON field path in the response, e.g. "controlSignal" or "tqi.compositeScore"
        value: 0                 # value to inject (int enum / number / string)
        label: ""                # expected on-screen label for this variant, e.g. "Adjust"
        not_class: ""            # OPTIONAL regex the variant's badge must NOT have, e.g. "status-success|green-"
        also_set: {}             # OPTIONAL extra fields, e.g. { "tqi.compositeScore": 0.45 } to satisfy an invariant

# ── STATE MACHINE ──────────────────────────────────────────────────────────────
# Each row → 1 transition TC; a guard adds 1 negative TC.

primary_entity: ""     # OPTIONAL — entity name, e.g. "UserTask"

state_transitions:
  - current: ""        # REQUIRED — "EntityName: current_status", e.g. "UserTask: assigned"
    action: ""         # REQUIRED — user action label, e.g. "Start work"
    next: ""           # REQUIRED — "EntityName: next_status"
    ui_element: ""     # REQUIRED — button/form name, e.g. "Start button in My Tasks"
    guard: ""          # OPTIONAL — condition that must hold; "" means no guard

# ── ERROR CATALOGUE ────────────────────────────────────────────────────────────
# MANDATORY whenever the page fetches data — each entry becomes ONE EXECUTABLE
# unhappy-path TC. policy (incl. collection-vs-item scoping and the grammar-0.4
# `Applies To` / `Error Code` columns) → references/spec-synthesis.md §2c-exception + §2c-errormap
#
# Fields: status_code drives the injection (inferred from `trigger` if omitted) ·
#   message = description, NOT asserted · ui_text = OPTIONAL exact on-screen substring;
#   blank → the TC asserts testing_scope.content_anchor is HIDDEN instead.
# A master-detail page needs ≥6 entries — the item triggers MUST reference the item
# path (or say "clicked"/"detail"/"opened"), else they collapse into collection TCs.

error_messages:
  # ── Collection / list endpoint ──
  - id: "ER-001"
    trigger: "GET /api/things returns 500 after load"   # bare list path → collection-scoped
    status_code: 500
    error_code: ""            # OPTIONAL — CT §Error Responses `Error Code` (0.4). "" for framework defaults.
    applies_to: []            # OPTIONAL — CT §Error Responses `Applies To` operationIds, e.g. ["GetThingList"]
    message: ""
    ui_text: ""
    location: "Inline"
    recovery_action: "Retry"  # a recovery mentioning 'retry' adds a Retry-button assertion
  - id: "ER-002"
    trigger: "GET /api/things returns 403 (insufficient permission)"
    status_code: 403
    message: ""
    ui_text: ""
    location: "Inline"
    recovery_action: ""
  - id: "ER-003"
    trigger: "GET /api/things returns 401 (session expired mid-session)"  # → in-session 401 + redirect TC
    status_code: 401
    message: ""
    ui_text: ""
    location: "Full-page"
    recovery_action: ""
  # ── Item / detail endpoint (trigger references /{id}) ──
  - id: "ER-004"
    trigger: "GET /api/things/{id} returns 404 for the clicked record"   # item path → item-scoped
    status_code: 404
    message: ""
    ui_text: ""          # OPTIONAL exact UI substring, e.g. "Could not load"
    location: "Inline"
    recovery_action: ""
  - id: "ER-005"
    trigger: "GET /api/things/{id} returns 403 for the clicked record (object-level deny)"
    status_code: 403
    message: ""
    ui_text: ""
    location: "Detail dialog"
    recovery_action: ""
  - id: "ER-006"
    trigger: "GET /api/things/{id} returns 500 for the clicked record"
    status_code: 500
    message: ""
    ui_text: ""
    location: "Detail dialog"
    recovery_action: ""

# ── UI BEHAVIOR RULES ──────────────────────────────────────────────────────────
# OPTIONAL — visual/layout rules that generate render/visibility tests.

ui_behaviors:
  - id: "UI-001"
    name: ""             # e.g. "Sidebar collapse on iPad"
    condition: ""        # e.g. "On viewport ≤ 1024px"
    expected_visual: ""  # e.g. "Sidebar shows icons only (64px width)"

# ── PERMISSIONS MATRIX ─────────────────────────────────────────────────────────
# OPTIONAL — one TC per allowed action + one per denied action.

permissions:
  - action: ""                   # e.g. "View page"
    roles:
      authenticated_user: true   # true = allowed, false = denied

# ── BOUNDARY CONSTRAINTS ───────────────────────────────────────────────────────
# OPTIONAL — min/max per field. Keys must match field names in element-map.json.

boundary_constraints: {}
# Example:
# username:
#   min: 3
#   max: 50
# email:
#   min: 5
#   max: 254

# ── ACCESSIBILITY (VIF-SCOPED) ────────────────────────────────────────────────
# One entry per bullet in the VIF's own §Accessibility — `clause` COPIED VERBATIM.
# SCOPE IS THE SECTION: no WCAG sweep, no landmark audit. VIF silent → leave EMPTY.
# `group` ∈ ARIA roles | Keyboard shortcuts | Focus management |
#          Screen reader announcements | Non-color indicators
# ⛔ policy + the three false-finding traps → references/a11y-scoped.md (read BEFORE filling)

a11y_requirements: []
# SHAPE — one entry per bullet; never paraphrase, merge, or add a clause the VIF lacks:
# - group: "{one of the five group names above}"
#   clause: "{the bullet's text, verbatim}"
#   component: "{the component the clause names, when it names one}"
#   spec_ref: "{VIF-id} §Accessibility {group}"    # OPTIONAL — auto-derived from `group`
#   assert:                      # REQUIRED — the clause as an oracle (vocabulary: `assert:`
#     - attr: "aria-expanded"    #   block above USER FLOWS). `clause` is the prose a human
#       "on": "{selector}"       #   reads; this is what becomes the expect().
#       equals: "false"
# A bare string is accepted too (group defaults to ARIA roles):
# - "{clause text}"
# A bullet packing several assertions ('role="dialog" on X; aria-live on Y') stays ONE
# entry — one TC per bullet is the contract, and that TC asserts every clause in it,
# so that entry's `assert:` list carries one oracle PER CLAUSE.

# ── NAV ENTRY ────────────────────────────────────────────────────────────────
# Copy from the VIF's `**Nav:**` line; leave empty when the VIF has none.
# policy (why `**Nav:**` and never `**Route:**`) → references/spec-synthesis.md §2c-nav
#
# `**Nav:** "Capture Inbox" under "Governance" (Shell Node ID: `decision` ...)`
#   ->  leaf: "Capture Inbox"      parent: "Governance"
nav_entry: {}
#   leaf: "{the clickable label}"
#   parent: "{the group it sits under, or omit}"

# ── ENFORCEMENT GUARDS ────────────────────────────────────────────────────────
# One entry per SERVER-SIDE guard — the REJECTION direction of the domain, covered by
# no other pass. Floor for the count: (ES `## Invariants` rows) + (`throw` lines across
# all `## Behaviors` Steps: blocks). Leave absent only when the ES declares neither.
# ⛔ where to read them per grammar, the 18-value `Kind` → violating-input table, and the
#    UC `## Extensions` cross-check → references/spec-synthesis.md §2c-enforcement

enforcement_guards: []
# SHAPE (fill every {…} from the specs THIS run opened — never copy a value from another
# feature, and never treat a placeholder as a default):
# - id: "ENF-{BC}-{NNN}-{NN}"   # the Step 4.5 gate (dim 2) BLOCKS if a declared id has no TC
#   target: "{BehaviorName}"    # verbatim from ES §Behaviors `### {Name}`
#   rule: "{condition}"         # verbatim from the `Steps:` throw line or the Invariants row
#   kind: "{Kind}"              # OPTIONAL — the `Kind` cell; picks the violation shape
#   error_code: "{BcName}:{Entity}:{RuleName}"    # DOMAIN code (ES/UC) — the oracle key
#   wire_code: "{BcName}:{Resource}:{RuleName}"   # CT §Error Responses code, SAME condition.
#                               # "" is MEANINGFUL, not missing data: an UNMAPPED domain error.
#                               # The generator writes the gap into `expected` and it gets
#                               # reported. See references/spec-synthesis.md §2c-errormap.
#   violate: "{the state/input that breaks the rule}"
#   action_ui: "{how the user attempts it through THIS screen}"
#   reject_expected: "{rejected + which state stays unchanged + where the error surfaces}"
#   source: "{ES-id} §Behaviors {Behavior} Steps {N}; {UC-id} Ext {Na}"
#   assert:                      # REQUIRED — the OBSERVABLE CONSEQUENCE of the rejection,
#     - text: "{error copy}"     #   never the wire code (the user never sees a code).
#     - rows: "=0"               #   `reject_expected` is the prose; this is the expect().
#       of: "tbody tr"           #   Assert BOTH halves: the error surfaced AND the state
#                                #   did not change.
# A shorthand string entry is accepted — the generator fills sensible defaults:
# - "{rule text, e.g. EndDate must be after StartDate when both set}"

# ── SEED RECIPES (BACKEND_MODE=real only) ─────────────────────────────────────
# API recipes for seeding/cleaning real test data. Step 5.6 upserts them into the
# shared registry setup/seed-recipes.generated.ts — never a per-feature file.
# Leave the block absent when the feature needs no real-backend seeding (no-op).
#
# ⛔ NAMING CONTRACT — seeded content is BUSINESS-MEANINGFUL, not a placeholder token.
#    Every seeded value must read like a real record a user of THIS screen would have
#    typed. Derive the wording from the screen's own domain vocabulary (the VIF title,
#    the UC actor + goal, the ES property meaning) — a reviewer opening the dev DB must
#    be able to tell what the row is FOR. Banned: "TEST-AUTO-Objective-${suffix}",
#    "MinhVoTest_x9f", "Seeded by automation skill", "test", "abc", "string", lorem.
#
#    Shape of a seeded value:
#        "<real business sentence/name> [AUTO] ${suffix}"
#        └─ business text ──────────┘ └marker┘ └run id┘
#
#    - The BUSINESS TEXT carries the meaning and is what assertions read.
#    - "[AUTO]" is the constant machine marker the pre-run sweep filters on. It is the
#      ONLY reason a robot-looking token appears at all — do not drop it, or the row can
#      never be swept and becomes permanent DB litter.
#    - "${suffix}" MUST be the LAST whitespace-delimited word. seededAgeMs() in
#      setup/seed-runtime.ts decodes the row's age from the base36 token before the first
#      "_" of that last word; put it anywhere else (or glue it onto a prefix, as
#      "TEST-AUTO-Objective-${suffix}" did) and the age is unreadable, `stale_after_ms`
#      treats the row as "too young to touch", and the sweep never deletes it.
#    - Fields the user never reads (a slug/code/key/taskType) take the marker WITHOUT the
#      prose: "auto.seed.${suffix}". Free-text bodies that no sweep filters on
#      (description, rationale, notes, step instructions) take NO marker and NO suffix —
#      pure business prose.
#    - Only ONE field per entity needs the marker: the field `cleanup.list_filter` matches.
#
#    Cleanup then filters on the marker, not on a prefix:
#        list_filter: "title~=\\[AUTO\\]"     # ~= regex; \\[ \\] escape the brackets
#
# policy → references/spec-synthesis.md §2c-seed

seed_recipes:
  # cleanup: pre-run sweep of rows this suite left behind. Runs once in beforeAll BEFORE
  # any seed. It finds them by the "[AUTO]" marker, so the marker is mandatory on
  # whichever field this filter names.
  cleanup:
    - list_endpoint: "/api/governance/decisions"        # GET — returns paged list
      list_filter: "title~=\\[AUTO\\]"                  # ^= prefix, $= suffix, == exact, ~= regex
      delete_endpoint: "/api/governance/decisions/{id}" # DELETE per item; {id} from list item
      id_field: "id"                                    # JSON path to entity id in list response
      items_path: "items"                               # JSON path to the array of items
      stale_after_ms: 1800000                           # never touch a row a parallel shard just made

  # seeds: one recipe per entity kind needed by TCs tagged data_dependency: seed.
  # Read the payloads below as a WORKED EXAMPLE of the naming contract, not as text to
  # copy: the wording belongs to THIS screen (an objective + the decision taken on it).
  # Re-derive yours from the VIF/UC of the screen under test.
  seeds:
    - id: "objective-1"
      scope: "beforeAll"               # beforeAll | beforeEach
      endpoint: "/api/analytics/objectives"
      method: "POST"
      payload:
        # marker + ${suffix} last, because cleanup.list_filter matches this field
        title: "Cut customer onboarding cycle time to 5 days [AUTO] ${suffix}"
        # free text nothing filters on → pure business prose, no marker, no suffix
        description: >-
          Onboarding currently averages 11 days, and the handoff between contract
          signature and account provisioning is where most of it is lost. Target is a
          5-day median by end of quarter without adding headcount.
      exposes: "objectiveId"           # key exposed to test code as seedData.objectiveId
      response_id_field: "id"          # JSON path in the POST response to extract the new id
      cleanup_endpoint: "/api/analytics/objectives/{id}"  # optional DELETE after suite

    - id: "decision-1"
      scope: "beforeAll"
      endpoint: "/api/governance/decisions"
      method: "POST"
      payload:
        objectiveId: "${seedData.objectiveId}"   # interpolate from an earlier seed
        decisionType: "Approve"
        title: "Approve automated provisioning for the onboarding flow [AUTO] ${suffix}"
        rationale: >-
          Manual provisioning is the single largest contributor to the 11-day median.
          Automating it is reversible and touches no customer-facing contract terms, so
          it is approved ahead of the broader onboarding redesign.
      exposes: "decisionId1"
      response_id_field: "id"

# ── API CONTRACTS ──────────────────────────────────────────────────────────────
# Intercepted with page.route() by the exception + mutation TCs. derive_api_patterns
# classifies each as COLLECTION or ITEM (path ends in /{id} or /*). For a master-detail
# page LIST BOTH — the item endpoint is what enables detail-scoped 404/403/500 TCs.
# Without a usable pattern those TCs cannot be generated: fill `endpoint` at minimum
# (path params → `*`). policy → references/spec-synthesis.md §2c-panel

api_contracts:
  - endpoint: ""         # COLLECTION — e.g. "/api/tasks" (bare list path, no path param)
    pattern: ""          # OPTIONAL explicit Playwright glob, e.g. "**/api/tasks?*" (overrides endpoint)
    method: "GET"        # GET | POST | PUT | PATCH | DELETE
    trigger: ""          # e.g. "Page load" / "Bounded context selected"
    success: "200"       # e.g. "200 + task list JSON"
    error: ""            # e.g. "404 → empty state rendered"
  - endpoint: ""         # ITEM (detail) — e.g. "/api/tasks/{id}"; enables detail error TCs
    pattern: ""          # OPTIONAL explicit glob, e.g. "**/api/tasks/*"
    method: "GET"
    trigger: ""          # e.g. "Row/card clicked → detail dialog opens"
    success: "200"       # e.g. "200 + task detail JSON"
    error: ""            # e.g. "404/403/500 → detail shows error, no content leak"
  # SECONDARY openable surface (expander / tab / drawer) — one entry per surface that
  # fires its OWN fetch. `empty:` is REQUIRED when the surface has a distinct Empty state:
  # without it the generator cannot tell "no data yet" from "load failed" (Bug #145660).
  - endpoint: ""         # e.g. "/api/tasks/{id}/history"  (nested sub-resource → auto-openable)
    pattern: ""          # OPTIONAL explicit glob, e.g. "**/api/tasks/*/history*"
    method: "GET"
    trigger: ""          # name the OPEN action + control label, e.g. "Expand History in the detail sheet — GetHistory"
    success: "200"       # e.g. "200 + rows, OR the empty state before any activity"
    error: ""            # 5xx copy IN QUOTES, e.g. "500 → 'Unable to load history.'"
    empty: ""            # OPTIONAL — spec'd empty-state copy IN QUOTES, e.g. "No activity yet."

# ── TEST DATA REQUIREMENTS ─────────────────────────────────────────────────────
# REQUIRED — minimum data that must exist for tests to run; becomes TC preconditions.

test_data_requirements:
  - ""    # e.g. "At least 1 UserTask with status 'assigned' for the test user"

# ── NAV BEHAVIORS ──────────────────────────────────────────────────────────────
# OPTIONAL — redirect destinations after form submit.

nav_behaviors: []
# Example: ["/dashboard", "/tasks/mine"]

# ── ACCEPTANCE CRITERIA ────────────────────────────────────────────────────────
# REQUIRED — the GO/NO-GO criteria; also enriches TC expected_result fields.

acceptance_criteria:
  - "All UF flows pass (happy path)"
  - "All VAL rules verified (required fields, length boundaries)"
  - "All state transitions verified"
  - "Error states rendered correctly with exact error messages"
  - "No console errors on page load"
  - "Page renders correctly at 1440px desktop and 1024px iPad"

# ── VIF ACCEPTANCE CRITERIA ────────────────────────────────────────────────────
# REQUIRED whenever the VIF has an `## Acceptance Criteria` section — which the
# grammar mandates for every VIF, with at least 5 rows. NOT the same key as
# `acceptance_criteria` above: that one is this RUN's GO/NO-GO checklist, this one
# is the SCREEN's own contract, id by id, copied verbatim.
#
# Why it is a separate gated key: the VIF's ACn rows are the densest oracles in the
# file (a navigation target with its query param, a three-branch fallback, a badge
# that must render on exactly one row) and nothing else in the spec graph restates
# them. Before this key existed the template's generic strings were all that landed
# in the yaml, so per-AC coverage depended entirely on whoever read the VIF by hand.
# ⛔ Copy from `resolve_specs.py --emit-vif-block`. Never retype, never paraphrase —
# the id is what the Step 4.5 AC-coverage gate matches on.

vif_acceptance_criteria: []
# - id: "AC1"
#   text: "{verbatim row text}"
#   covered_by: ["TC-012"]     # OPTIONAL — fill when an existing TC already proves it;
#                              #   the gate accepts either this or a TC citing the id in spec_ref
#   untestable: ""             # OPTIONAL — a reason makes the gate accept a `spec_only` stub
#                              #   instead of an executable TC (e.g. a preview-emitter AC).
#                              #   An EMPTY reason is not accepted: state it or cover it.
#   assert:                    # REQUIRED unless `covered_by` or `untestable` is set —
#     - text: "{verbatim}"     #   the AC row's own text turned into an oracle. Vocabulary:
#                              #   the `assert:` block above USER FLOWS.

# ── STATE DEFAULTS (VIF §State Management) ─────────────────────────────────────
# REQUIRED when the VIF declares state. `Initial Value` is the screen's BOOT
# contract: what it must request and display before the user touches anything.
# A deployed app that quietly changes the default filter, the page size or the sort
# has nothing asserting otherwise — every other TC sets the control first.
# Only rows whose initial value is OBSERVABLE belong in a TC; mark the rest.

state_defaults: []
# - state_name: "dispositionFilter"
#   scope: "local"
#   type: "CaptureInboxDisposition | \"all\""
#   initial_value: "\"Captured\""
#   set_by: "User changes DispositionFilterSelect"
#   observable: "control"      # control | request | none —
#                              #   control = assert the widget shows this value on load
#                              #   request = assert the boot request carries it (pair with
#                              #             query_params below; this is the stronger oracle)
#                              #   none    = internal only, no TC (say why in `note`)
#   assert:                    # REQUIRED on `observable: control` rows — what the widget
#     - element: "{selector}"  #   must show on load, in the vocabulary. `initial_value` is
#       state: visible         #   the declared value; this is what proves the app honours it.
#     - text: "{initial_value}"#   `observable: request` rows are asserted from query_params
#                              #   instead and need no `assert:`.
#   note: ""

# ── RESPONSIVE RULES (VIF §Responsive Rules) ───────────────────────────────────
# REQUIRED — the grammar mandates all 3 breakpoints on every VIF. These are
# BEHAVIOURAL mandates, never CSS: "CaptureInboxTable → card stack", "CreatedAt
# column hidden", "TriageSheet full screen". Each one is directly assertable by
# setting the viewport and checking the named component.
# ⚠️ A mobile/desktop double-render makes `.first()` hit a `display:none` node, so a
# `toBeHidden()` on it passes vacuously — scope with `>> visible=true`.

responsive_rules: []
# - breakpoint: "mobile"        # mobile | tablet | desktop
#   viewport: "375x812"         # REQUIRED — the width the mandate is asserted at
#   layout_behavior: "Single column; toolbar collapses to icon bar"
#   navigation_pattern: "Drawer navigation"
#   changes:                    # one entry per assertable mandate in the VIF cell
#     - component: "CaptureInboxTable"
#       expect: "card-stack"    # hidden | visible | card-stack | full-screen | width
#       note: ""

# ── ERROR / EMPTY PRECEDENCE (VIF §Empty & Error Precedence) ───────────────────
# REQUIRED for every data-backed page, and NOT a duplicate of `error_messages`
# above. `error_messages` says an error exists and what it reads; this says which
# surface WINS and at what LEVEL — a 403 that must take the whole page (list not
# rendered, no retry) is a different defect from the same 403 shown inline while a
# stale list stays on screen. Nothing else in the run models that difference.

error_precedence: []
# - condition: "403 on GET /capture-inbox"
#   display: "Full-page error: \"You don't have permission…\" No retry. List not rendered."
#   level: "full-page"          # full-page | component | inline — the asserted scope
#   suppresses: ["CaptureInboxTable"]   # what must NOT be on screen (the real oracle)
#   retry: false                # true | false — a Retry control is required / forbidden
#   disables: []                # controls that must be disabled (e.g. all triage actions)
#   assert:                     # REQUIRED — `display` already quotes the copy; LIFT IT
#     - text: "You don't have permission…"      #   VERBATIM rather than paraphrasing.
#     - element: "{suppressed selector}"        # the `suppresses` half — a precedence TC
#       state: hidden                           #   that only proves the error appeared does
#                                               #   not prove the stale surface went away.

# ── COMPONENT TREE (VIF §Component Tree) ───────────────────────────────────────
# REQUIRED. The `Empty State` / `Error State` cells are the ONLY authority for
# on-screen empty copy (CT §Error Responses `Message` is the authority for error
# copy). Previously that copy was hand-carried into `api_contracts[].empty`, so a
# component whose row was skipped had no oracle and nothing said so.
# `Region` (dominant / supporting) is the layout intent, asserted only where the
# VIF makes it observable — do not invent a geometry oracle from it.

component_tree: []
# - component_id: "CaptureInboxTable"
#   type: "table"              # page|form|card|table|modal|widget|button|panel
#   parent: "CaptureInboxPage"
#   empty_state: "No items in your Capture Inbox. …"
#   error_state: "Unable to load Capture Inbox. …"
#   region: "dominant"
#   selector: ""               # OPTIONAL — from element-map, how to reach it

# ── ENTRY POINTS (VIF §Routing & Entry Points) ─────────────────────────────────
# REQUIRED. `route` feeds PAGE_URL sanity only — the oracle here is the BOOT STATE
# each distinct arrival must land in. A screen reached two ways can be correct on
# one path and broken on the other, and a suite that only ever `page.goto`s the
# route never exercises the second.
# ⚠️ Both `**Route:**` and `**Nav:**` came from a machine-generated pass (~8 of 20
# routes were measured wrong) — confirm by hand before filing a defect on either.

entry_points: []
# - entry_point: "Nav destination"
#   how: "The Sovereign opens the Capture Inbox to scan untriaged signals"
#   opens_in: "Untriaged queue list, stale-flagged items tagged"
#   reachable_in_test: true    # false + `note` when the arrival cannot be driven
#                              #   (an inbound Camunda task with no seedable route)
#   note: ""

# ── TESTING SCOPE ──────────────────────────────────────────────────────────────
# REQUIRED — defines the test boundary so shell elements are never mistaken for the
# feature. Typical shell: App Switcher, Toggle sidebar, Notifications, user name/email,
# app logo, breadcrumb "Home". Any TC step targeting one must be removed or rewritten.
# mock_strategy detection + the post-gen scan → references/mock-strategies.md

testing_scope:
  test_url: ""                   # REQUIRED — exact URL under test, e.g. "/sa/approvals"
  in_scope_description: ""       # REQUIRED — 1 sentence: what belongs to this feature
  excluded_shell_elements:       # REQUIRED — exact labels as they appear in the DOM
    - "[MISSING — list shell nav items, app switcher labels, user profile text]"
  nav_entry:                     # REQUIRED when the VIF declares a `**Nav:**` line — copy it
                                 #   verbatim. This is the feature's OWN sidebar entry: in
                                 #   scope, NOT a shell element. Both "" only if no Nav line.
    label: ""                    #   e.g. "Telemetry Ingestion"
    group: ""                    #   e.g. "Analytics"
  content_anchor: ""             # OPTIONAL but recommended — text appearing ONLY on the
                                 #   populated LIST. Collection exception TCs assert it is
                                 #   HIDDEN on 404/403/5xx/401 — a copy-independent catcher.
  detail_content_anchor: ""      # OPTIONAL but REQUIRED to make item/detail error TCs
                                 #   executable — text present ONLY inside a loaded DETAIL
                                 #   (dialog/sheet/panel). Omit → item TCs degrade to
                                 #   visible spec_only stubs (a reviewable gap, not a test).
  mock_strategy: "page_route"    # REQUIRED — page_route | addInitScript_msw | none
  msw_detection_hint: ""         # OPTIONAL — e.g. "NEXT_PUBLIC_ENABLE_MOCKS=true in .env"
  msw_fixed_data_notes: ""       # OPTIONAL — e.g. "MSW serves 7 fixed items; first=fraud-detection-agent"

# ── LAYOUT STRESS ─────────────────────────────────────────────────────────────
# Fill when the feature renders free-text values in repeating rows/cards/tables OR in
# a single-record detail Sheet/dialog. null when there is no free-text anywhere.
# Emits deterministic category: layout-discovery TCs (separate from AI-Exploratory) that
# inject LAYOUT_BAD_STRINGS via page.route() and assert the invariants in setup/bad-data-fixtures.ts.
# ⛔ field-by-field meaning, the detail_surface rule, the Verification-Fixture oracle,
#    and the delta-re-test rule → references/spec-synthesis.md §2c-layout
#
# Field type → bad strings injected: free_text → longNoSpace + empty ·
#   free_text_multi → + longSpaced · free_text_intl → + cjkEmojiRtl

layout_stress: null
# Example (Process Monitor accordion):
# layout_stress:
#   row_selector: '[data-slot="accordion-item"]'
#   baseline_row_field: "ProcessDefinitionName"
#   stress_fields:
#     - field: "ProcessDefinitionName"
#       type: "free_text"
#     - field: "StartedBy"
#       type: "free_text"
#     - field: "FailureReason"
#       type: "free_text_multi"
#       only_when: { Status: "Failed" }   # OPTIONAL — only stress when a sibling field has this value
# Example (Capture Inbox triage-screen — detail Sheet, no repeating free-text row):
# layout_stress:
#   row_selector: '[data-slot="table-row"]'   # opens the detail; free-text preview truncates in list
#   baseline_row_field: "disposition"
#   stress_fields:
#     - field: "rawText"
#       type: "free_text_multi"
#   detail_surface:
#     container_selector: '[role="dialog"]'
#     text_selectors:
#       - '[data-slot="sheet-title"]'          # header title
#       - '[data-slot="sheet-content"] p'      # full-text box
#     open_step: "Click the first queue row to open the triage-screen Sheet"
#     item_api_pattern: '/api/governance/capture-inbox/*'

# ── TASK-SCREEN BLOCKS (VIF §5.3) ──────────────────────────────────────────────
# REQUIRED when, and ONLY when, the VIF frontmatter declares `task_journey_id`.
# 33 of the 61 VIFs in this corpus are task-screens, and their 5 extra sections
# were read by nothing until now — which is why a queue column the deployed app
# dropped, a query-param default it changed, and a field it leaked into the list
# were all unfalsifiable from a green suite.
#
# A generic (or shell) VIF must leave `task_screen: null`. Carrying these sections
# on a non-task-screen VIF is a spec defect (Gate G9), not something to model here.
# ⛔ Copy from `resolve_specs.py --emit-vif-block`.

task_screen: null
# task_screen:
#   task_journey:                # §Task Journey — the Camunda user-task mapping
#     task_key: "triage-item"
#     label: "Triage Capture Inbox Item"
#     route: "/governance/capture-inbox/{id}/triage"
#     uc_step: "UC-GOV-002 Step 2"
#     landing_page: "/governance/capture-inbox"
#     primary_identifier: "CaptureInboxItem.Id"
#     route_reachable: "unknown"  # yes | no | unknown — a task route the deployed app
#                                 #   never implemented is a real finding, and the
#                                 #   landing page passing is NOT evidence for it
#   screens:
#     - screen_id: "capture-inbox-list"
#       blueprint: "task-list"    # task-list | task-screen-standard (controlled vocab)
#
#       # §Task Screens "Queue Columns" — one entry per column the queue must show.
#       # The oracle is per-column presence AND that the column's own binding renders
#       # a value, not merely that a header string exists: a header renders during the
#       # fetch and while the row body is empty, which is how a table shell passes.
#       columns:
#         - column: "RawText (truncated, max 120 chars)"
#           entity_binding: "ES-GOV-001.RawText"
#           truncate_at: 120       # OPTIONAL — a stated limit is an assertable oracle
#           conditional: ""        # OPTIONAL — "shown only when Disposition = Deferred"
#
#       # §Task Screens "Query Parameters" — the OUTBOUND request contract, with the
#       # default each param carries on a cold load. This is the strongest available
#       # spec-vs-deploy check on this screen and the cheapest: bind to the boot
#       # request and read its URL. Every other TC sets a control first, so a changed
#       # default is invisible to all of them.
#       query_params:
#         - param: "disposition"
#           maps_to: "dispositionFilter state"
#           default: "Captured"
#           sent_when: "always"    # always | when-true | when-set — `isStale` is only
#                                  #   sent when true, so asserting it on a cold load
#                                  #   would fail a conformant app
#
#       # §Task Screens "Response fields received but not displayed" — a NEGATIVE
#       # render contract, and the only section in the whole grammar that states one.
#       # The suite must prove each field is absent from the list surface. `TenantId`
#       # leaking into a tenant-facing queue is exactly the defect this catches.
#       fields_not_displayed:
#         - field: "TenantId"
#           reason: "Internal — not meaningful to Sovereign UI"
#           surface: "list"        # list | detail — where the absence is asserted
#
#       # §Task Screens "Support Panels" — controlled roles: sop-checklist|info|ask-ai|nba.
#       # `required: yes` means the panel MUST render; a `no` panel that is absent is
#       # conformant and must NOT be asserted present (that manufactures a false bug).
#       support_panels:
#         - panel_role: "info"
#           required: "yes"
#           content_source: "Summary counts: total untriaged, items by disposition"
#           anchor: ""             # text/selector proving the panel actually LOADED,
#                                  #   not just that its container mounted
#
#     - screen_id: "triage-screen"
#       blueprint: "task-screen-standard"
#       # §Task Screens "Form Fields" — `Required` is the gate-relevant cell; a
#       # `conditional` field pairs with the §Validation Rules row that governs it.
#       form_fields:
#         - form_field: "Disposition selector"
#           entity_binding: "ES-GOV-001.Triage() input — TriageDisposition"
#           contract_binding: "POST …/triage via TriageCaptureInboxItem"
#           required: "yes"        # yes | no | conditional
#       # §Task Screens "Action Bar" — every action key must be reachable, and its
#       # `Behavior` says what must happen (submit | cancel | sheet | navigate | …).
#       actions:
#         - action_key: "submit-defer"
#           label: "Defer"
#           uc_step: "UC-GOV-002 Step 2"
#           behavior: "submit"
#           hidden_when: ""        # OPTIONAL — a spec-mandated absence (e.g. all triage
#                                  #   actions hidden on a Resolved item) is an oracle too
#
#   # §Data Mapping — traceability only, no TC of its own. Kept because a screen id
#   # here with no entry under `screens:` above means a screen was missed.
#   data_mapping:
#     - screen_id: "capture-inbox-list"
#       uc_step: "UC-GOV-009 Step 1"
#       entity_spec: "ES-GOV-001"
#       contract_spec: "CT-GOV-001"
#
#   # §Verification Fixtures — ready-made oracles, authored for the preview emitter
#   # but valid for the suite: an Entity Snapshot is a `mutate:` payload whose
#   # `Verifies` cell states the expected rendering, and that is a spec-derived
#   # oracle for a branch live data cannot show (a null resolved name, a stale item,
#   # a failure flag). Prefer these over inventing a mutation payload.
#   fixtures:
#     - fixture_id: "fix-gov-001-e7"
#       group: "Entity Snapshots"   # Task Activation | Entity Snapshots | Checklist |
#                                   #   Info Content | Ask AI | NBA
#       payload: ""                 # the JSON verbatim from the Sample Data cell
#       verifies: ""                # verbatim from the Verifies cell — this is the oracle
#       use_as: "mutate"            # mutate | seed | assertion | none
#                                   #   `none` + a reason for a preview-only fixture
#       note: ""

# Optional. ES 0.4 §Properties `Normalization` column, per field. Drives the
# Special-characters family: `none` (or absent) asserts the typed value verbatim;
# `lowercase`/`uppercase` assert the transformed value; any other value keeps the
# verbatim oracle and names the transform in the expectation instead of guessing it.
field_normalization: {}
