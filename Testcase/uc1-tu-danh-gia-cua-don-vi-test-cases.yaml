  text: 'UC1.1 BR-8 không nêu menu khi Lãnh đạo xem kết quả ''Đã gửi'' của kỳ đã kết thúc và khi Cán bộ xem ''Chờ duyệt'': giả định chỉ có ''Xem'' theo mục ''Các trường hợp còn lại''.'
