  text: UC1.2 không nêu hành vi nút Trình duyệt khi kết quả không ở trạng thái cho phép (ẩn hay vô hiệu).
  requirement_refs:
  - UC1.2-PERM
- id: OQ-1.3.1
  text: 'Mâu thuẫn: UC1.3 Pre-condition chỉ cho Đang chấm điểm/Bị từ chối nhưng UC1.1 BR-8 liệt kê ''Trình duyệt'' ở menu của Chưa thực hiện. Hành vi trình kết quả Chưa thực hiện chưa rõ.'
  requirement_refs:
  - UC1.3-BR-2
  - UC1.3-PERM
- id: OQ-1.3.2
  text: Kiểm tra gửi thông báo TB-005 (nội dung, người nhận) cần xác nhận cách kiểm chứng trên giao diện.
  requirement_refs:
  - UC1.3-POST
- id: OQ-1.4a.1
  text: Kiểm chứng thông báo TB-006 (người nhận có quyền Gửi kết quả) chỉ làm được bằng tài khoản người nhận.
  requirement_refs:
  - UC1.4a-MF
- id: OQ-1.4b.1
  text: UC1.4b không nêu hành vi khi lý do vượt 255 ký tự (chặn nhập hay báo lỗi, message nào) và khi lý do chỉ gồm khoảng trắng.
  requirement_refs:
  - UC1.4b-BR-1
- id: OQ-1.5.1
  text: UC1.5 không nêu hành vi khi chọn thêm tệp thứ 2 (BR-1 'đúng một tệp') và khi không chọn Loại file (trường bắt buộc, chưa có message).
  requirement_refs:
  - UC1.5-BR-1
  - UC1.5-BR-2
- id: OQ-1.5.2
  text: Nội dung đúng 'file ký số' (kiểm tra chữ ký số hay chỉ chọn Loại file) chưa rõ.
  requirement_refs:
  - UC1.5-BR-3
- id: OQ-1.6.1
  text: BR-4 (Bộ duyệt/từ chối mở khóa) thuộc nhóm 'Quản lý kết quả của Bộ' chưa có trong SRS này; chưa thể viết TC kết thúc luồng.
  requirement_refs:
  - UC1.6-BR-4
- id: OQ-1.6.2
  text: UC1.6 không nêu hành vi khi lý do vượt 255 ký tự hoặc chỉ gồm khoảng trắng.
  requirement_refs:
  - UC1.6-BR-2
- id: OQ-1.7.1
  text: UC1.7 BR-5 chỉ nêu nút cho Chưa thực hiện/Đang chấm điểm/Bị từ chối (Cán bộ) và Chờ duyệt (Lãnh đạo); nút Gửi Bộ (Đã phê duyệt) và Xin mở khóa (Đã gửi) có trong field spec nhưng không có trong BR-5.
  requirement_refs:
  - UC1.7-BR-5
