requirements:
- id: UC1.1-MF
  type: main_flow
  text: Người dùng chọn menu Kết quả tự đánh giá; hệ thống hiển thị danh sách (mặc định Định kỳ, tab Cần xử lý) với các cột STT, Kỳ đánh giá, Đơn vị, Bộ chỉ số, Hạn nộp, Tiến độ chấm, Điểm, Trạng thái,
    Thao tác; chọn Xem chi tiết để mở menu thao tác
  status: clear
- id: UC1.1-BR-1
  type: business_rule
  text: Chỉ thấy kết quả thuộc phạm vi dữ liệu; bộ lọc Đơn vị chỉ hiển thị khi phạm vi cho phép xem đơn vị con; ngoài phạm vi báo MSG-045
  status: clear
- id: UC1.1-BR-2
  type: business_rule
  text: Mặc định chọn nút Định kỳ và tab Cần xử lý
  status: clear
- id: UC1.1-BR-3
  type: business_rule
  text: 'Tab Cần xử lý: Cán bộ gồm Chưa thực hiện/Đang chấm điểm/Bị từ chối/Đã phê duyệt; Lãnh đạo gồm Chờ duyệt và Đã gửi (kỳ đang diễn ra); không có bộ lọc Thời hạn; số trên tab theo Từ khóa và Kỳ đang
    lọc'
  status: clear
- id: UC1.1-BR-4
  type: business_rule
  text: 'Thời hạn: Tất cả, Kỳ đang diễn ra (mặc định), Kỳ đã kết thúc; chỉ hiện khi không ở tab Cần xử lý'
  status: clear
- id: UC1.1-BR-5
  type: business_rule
  text: 'Dải tab Trạng thái: Kỳ đang diễn ra 7 trạng thái; Kỳ đã kết thúc 2 (Đã gửi, Chưa gửi); Tất cả 8 trạng thái'
  status: clear
- id: UC1.1-BR-6
  type: business_rule
  text: Hạn nộp 23:59 ngày kết thúc kỳ; hiển thị ngày + 'Còn n ngày' hoặc 'Đã kết thúc'
  status: clear
- id: UC1.1-BR-7
  type: business_rule
  text: Cột Điểm = điểm hiện có / tổng điểm tối đa, số nguyên (785 / 900); chưa có điểm hiển thị '-'
  status: clear
- id: UC1.1-BR-8
  type: business_rule
  text: Cột Thao tác luôn là nút 'Xem chi tiết' + mũi tên; menu theo trạng thái và vai trò; 'Xem' luôn là mục đầu tiên
  status: clear
- id: UC1.1-BR-9
  type: business_rule
  text: Xuất Excel theo bộ lọc đang chọn, các cột đang hiển thị; rỗng MSG-023; lỗi MSG-024
  status: clear
- id: UC1.1-AF1
  type: alt_flow
  text: Chuyển Định kỳ/Đột xuất, giữ nguyên tab và bộ lọc
  status: clear
- id: UC1.1-AF2
  type: alt_flow
  text: 'Chọn tab ngoài Cần xử lý: hiện bộ lọc Thời hạn mặc định Kỳ đang diễn ra và dải tab Trạng thái'
  status: clear
- id: UC1.1-AF3
  type: alt_flow
  text: Tìm kiếm theo Từ khóa/lọc Thời hạn, Kỳ đánh giá (chọn nhiều), Đơn vị; cập nhật số trên tab Cần xử lý
  status: clear
- id: UC1.1-AF4
  type: alt_flow
  text: Chuyển trang, cập nhật dòng 'Hiển thị n kỳ'
  status: clear
- id: UC1.1-AF5
  type: alt_flow
  text: Xuất Excel theo bộ lọc hiện tại
  status: clear
- id: UC1.1-EF1
  type: exception_flow
  text: 'Danh sách rỗng: ''Chưa có dữ liệu'' (MSG-022)'
  status: clear
- id: UC1.1-EF2
  type: exception_flow
  text: 'Lọc không có kết quả: ''Không tìm thấy kết quả phù hợp'' (MSG-021)'
  status: clear
- id: UC1.1-EF3
  type: exception_flow
  text: 'Không có quyền hoặc lỗi hệ thống: MSG-043 hoặc MSG-025'
  status: clear
- id: UC1.1-EF4
  type: exception_flow
  text: 'Xuất Excel khi rỗng/lỗi: MSG-023/MSG-024, không tải tệp'
  status: clear
- id: UC1.1-FLD-1
  type: field
  text: 'Từ khóa: tối đa 255 ký tự, tìm theo tên kỳ'
  status: clear
- id: UC1.1-FLD-2
  type: field
  text: Tiến độ chấm 'x/y chỉ số' + % + thanh tiến độ; không tính chỉ số Không tính điểm vào y
  status: clear
- id: UC1.1-FLD-3
  type: field
  text: Kỳ đánh giá (dropdown chọn nhiều) chỉ liệt kê kỳ thuộc phạm vi tài khoản; chip Trạng thái có màu theo trạng thái; cột Kỳ đánh giá không lặp loại kỳ
  status: clear
- id: UC1.1-PERM
  type: permission
  text: Người dùng cần đăng nhập và có quyền chức năng xem kết quả tự đánh giá
  status: clear
- id: UC1.1-POST
  type: state
  text: 'Post-condition: không có dữ liệu nào bị thay đổi khi xem danh sách'
  status: clear
- id: UC1.2-MF
  type: main_flow
  text: Cán bộ chọn Chấm điểm, nhập Điểm chấm/Giải trình/Minh chứng, nhấn Lưu nháp; hệ thống lưu, ghi lịch sử, báo MSG-001; Chưa thực hiện chuyển Đang chấm điểm
  status: clear
- id: UC1.2-BR-1
  type: business_rule
  text: 'Điểm chấm là số nguyên không âm, không giới hạn trên; âm: MSG-057; thập phân: MSG-083'
  status: clear
- id: UC1.2-BR-2
  type: business_rule
  text: Điểm kết quả = min(Điểm chấm x Trọng số, Điểm tối đa); điểm nhóm, trụ cột, tổng tạm tính tự cộng, cập nhật ngay
  status: clear
- id: UC1.2-BR-3
  type: business_rule
  text: 'Chỉ số Không tính điểm: không chấm được, ''-'' ở Điểm chấm/Điểm kết quả, loại khỏi điểm tối đa và tiến độ; vẫn nhập Giải trình và đính kèm'
  status: clear
- id: UC1.2-BR-4
  type: business_rule
  text: 'Minh chứng: nhiều tệp, PDF/DOC/DOCX/XLS/XLSX/JPG/PNG, tối đa 20 MB/tệp; sai định dạng MSG-046; quá dung lượng MSG-047'
  status: clear
- id: UC1.2-BR-5
  type: business_rule
  text: Giải trình không bắt buộc, tối đa 255 ký tự (MSG-013)
  status: clear
- id: UC1.2-BR-6
  type: business_rule
  text: Lưu nháp không yêu cầu đủ điểm; chỉ lần lưu nháp đầu của Chưa thực hiện đổi sang Đang chấm điểm
  status: clear
- id: UC1.2-BR-7
  type: business_rule
  text: 'Bị từ chối: Lưu nháp/Hủy chỉnh sửa giữ Bị từ chối; chỉ Trình duyệt mới sang Chờ duyệt'
  status: clear
- id: UC1.2-BR-8
  type: business_rule
  text: Nút Hủy chỉnh sửa chỉ hiện khi có thay đổi chưa lưu; hủy/thoát có thay đổi hỏi MSG-009
  status: clear
- id: UC1.2-BR-9
  type: business_rule
  text: Không chấm điểm khi trạng thái không cho phép (MSG-060) hoặc kỳ đã kết thúc (MSG-061)
  status: clear
- id: UC1.2-BR-10
  type: business_rule
  text: Đạt khi Điểm kết quả >= minScore, ngược lại Chưa đạt; Không tính điểm/chưa chấm hiển thị '-'; cập nhật ngay
  status: clear
- id: UC1.2-BR-11
  type: business_rule
  text: Ô Điểm chấm trống không hiểu là 0; Lưu nháp lưu ô trống
  status: clear
- id: UC1.2-AF1
  type: alt_flow
  text: Tìm chỉ số, lọc 'Chỉ số chưa có điểm', Mở rộng/Thu gọn cây, không mất dữ liệu đã nhập
  status: clear
- id: UC1.2-AF2
  type: alt_flow
  text: Sửa điểm/giải trình đã nhập
  status: clear
- id: UC1.2-AF3
  type: alt_flow
  text: 'Xóa tệp minh chứng: MSG-006, MSG-002; Hủy giữ nguyên tệp'
  status: clear
- id: UC1.2-AF4
  type: alt_flow
  text: 'Hủy chỉnh sửa/quay lại: MSG-009; đồng ý bỏ thay đổi về UC1.7; không đồng ý ở lại'
  status: clear
- id: UC1.2-EF1
  type: exception_flow
  text: 'Điểm âm: MSG-057'
  status: clear
- id: UC1.2-EF2
  type: exception_flow
  text: 'Điểm thập phân: MSG-083'
  status: clear
- id: UC1.2-EF3
  type: exception_flow
  text: Tệp sai định dạng/quá dung lượng MSG-046/047; lỗi tải tệp MSG-048
  status: clear
- id: UC1.2-EF4
  type: exception_flow
  text: 'Giải trình > 255 ký tự: MSG-013, không cho lưu'
  status: clear
- id: UC1.2-EF5
  type: exception_flow
  text: 'Trạng thái không cho phép hoặc kỳ kết thúc: MSG-060/061'
  status: clear
- id: UC1.2-EF6
  type: exception_flow
  text: 'Dữ liệu bị người khác thay đổi/mất quyền: MSG-020/MSG-043'
  status: clear
- id: UC1.2-PERM
  type: permission
  text: Chỉ Cán bộ/Cán bộ địa phương có quyền Nhập/sửa tự đánh giá trong phạm vi đơn vị được chấm điểm
  status: clear
- id: UC1.2-FLD
  type: field
  text: Cột Điểm hiển thị (điểm tối thiểu-điểm tối đa); ô Tìm chỉ số tối đa 255 ký tự; Tiến độ chấm 'x/y'; Tổng điểm tạm tính 'a / b'; Minh chứng có Tải về/Xóa, chưa có hiển thị '-'
  status: clear
- id: UC1.2-POST
  type: state
  text: Lịch sử xử lý ghi hành động Lưu nháp sau khi lưu
  status: clear
- id: UC1.3-MF
  type: main_flow
  text: Cán bộ nhấn Trình duyệt; hệ thống kiểm tra đủ điểm, hiện hộp thoại xác nhận MSG-064; xác nhận → Chờ duyệt, ghi lịch sử, TB-005, MSG-067
  status: clear
- id: UC1.3-BR-1
  type: business_rule
  text: Chỉ trình khi mọi chỉ số cần chấm có điểm; ô trống ≠ 0; Không tính điểm bỏ qua
  status: clear
- id: UC1.3-BR-2
  type: business_rule
  text: Trình duyệt là bước duy nhất chuyển sang Chờ duyệt
  status: clear
- id: UC1.3-BR-3
  type: business_rule
  text: 'Trình duyệt từ màn Chấm điểm có thay đổi chưa lưu: lưu trước rồi mới kiểm tra điểm'
  status: clear
- id: UC1.3-BR-4
  type: business_rule
  text: Kết quả Bị từ chối được trình lại bằng chính thao tác này
  status: clear
- id: UC1.3-AF1
  type: alt_flow
  text: 'Chọn Hủy: đóng hộp thoại, giữ nguyên trạng thái'
  status: clear
- id: UC1.3-EF1
  type: exception_flow
  text: 'Còn chỉ số chưa có điểm: hộp thoại ''Chưa trình được'' (MSG-059) + danh sách; từ Chấm điểm viền đỏ ô trống MSG-010; chọn chỉ số mở UC1.2; Đóng kết thúc'
  status: clear
- id: UC1.3-EF2
  type: exception_flow
  text: 'Trạng thái/kỳ không cho phép: MSG-060/MSG-061'
  status: clear
- id: UC1.3-PERM
  type: permission
  text: Chỉ Cán bộ có quyền Nhập/sửa tự đánh giá trình duyệt
