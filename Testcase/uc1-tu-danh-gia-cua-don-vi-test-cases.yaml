  - UC1.2-BR-1
- id: OQ-1.2.3
  text: UC1.2 không nêu số tệp tối đa mỗi chỉ số và thông báo MSG-048 (lỗi tải tệp) khó giả lập.
  requirement_refs:
  - UC1.2-BR-4
