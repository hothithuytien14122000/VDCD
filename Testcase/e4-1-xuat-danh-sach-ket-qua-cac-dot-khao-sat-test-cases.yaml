requirements:
- id: E4.1-BR-1
  type: business_rule
  text: Dùng bộ lọc đang áp dụng tại UC1.1 (từ khóa, trạng thái, hình thức, năm); không xuất theo từ khóa chưa nhấn Enter
  status: clear
- id: E4.1-BR-2
  type: business_rule
  text: Xuất toàn bộ kết quả khớp bộ lọc và phạm vi (không chỉ 10 dòng), thứ tự theo danh sách, đợt nhiều hình thức một dòng
  status: clear
- id: E4.1-BR-3
  type: business_rule
  text: Lọc Đã kết thúc xuất kết quả Chính thức; trạng thái khác vẫn xuất, phân biệt trạng thái đợt và tính chất số liệu
  status: clear
- id: E4.1-BR-4
  type: business_rule
  text: Không thay cho xuất chi tiết một đợt; không xuất từng phiếu/mẫu phiếu
  status: clear
- id: E4.1-BR-5
  type: business_rule
  text: Chặn bấm lặp khi tạo tệp; kiểm tra quyền/phạm vi khi xuất; không đưa dữ liệu vừa mất quyền vào tệp
  status: clear
- id: E4.1-BR-6
  type: business_rule
  text: Cấu trúc cột theo phần Excel; đợt chưa mở thu thập vẫn có dòng, ô kết quả để trống
