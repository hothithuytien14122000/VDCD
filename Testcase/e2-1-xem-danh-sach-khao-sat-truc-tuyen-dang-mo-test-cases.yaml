  text: 'UC2.1/UC2.2: hạn ''Hạn đến'' và cách tính ngày hết hạn dùng múi giờ nào cho trang công khai? Nhóm 3 nêu Asia/Ho_Chi_Minh, UC2 không nêu.'
  requirement_refs:
