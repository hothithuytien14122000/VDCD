requirements:
- id: E2.1-BR-1
  type: business_rule
  text: Chỉ hiển thị đợt đã phê duyệt, có hình thức Trực tuyến, trong khoảng ngày bắt đầu đến hết ngày kết thúc
  status: clear
- id: E2.1-BR-2
  type: business_rule
  text: Kiểm tra thời gian khi tải danh sách kể cả khi tác vụ cập nhật trạng thái chưa chạy; không hiển thị Nháp/Chờ phê duyệt/Bị từ chối/chưa bắt đầu/đã hết hạn
  status: clear
- id: E2.1-BR-3
  type: business_rule
  text: Mỗi đợt đủ điều kiện xuất hiện một lần dù có thêm hình thức không trực tuyến
  status: clear
- id: E2.1-BR-4
  type: business_rule
  text: Thẻ gồm tên đợt, đơn vị thực hiện, hạn kết thúc, số câu hỏi (không tính Góp ý thêm), nút Tham gia khảo sát
  status: clear
- id: E2.1-BR-5
  type: business_rule
  text: Tổng khảo sát đang mở = số đợt đủ điều kiện; chưa có thì 0 và trạng thái rỗng, không dữ liệu mẫu
  status: clear
- id: E2.1-BR-6
  type: business_rule
  text: Nút Tham gia chuyển đúng đợt tại UC2.2 và kiểm tra lại điều kiện truy cập
  status: clear
- id: E2.1-BR-7
  type: business_rule
  text: Không có bộ lọc, tìm kiếm, đăng nhập hoặc chức năng quản trị
  status: clear
- id: E2.1-BR-8
  type: business_rule
  text: Sắp xếp ngày kết thúc tăng dần, cùng ngày thì mã đợt tăng dần
  status: clear
- id: E2.1-BR-9
  type: business_rule
  text: Tối đa 10 đợt/trang, luôn hiển thị phân trang, tổng là tổng mọi trang
  status: clear
- id: E2.1-BR-10
  type: business_rule
  text: 'Trước vô hiệu ở trang đầu, Sau vô hiệu ở trang cuối; rỗng: Trang 1/1, 0 khảo sát, vô hiệu cả hai; trang không còn thì về trang cuối hợp lệ'
  status: clear
- id: E2.1-MF
  type: main_flow
  text: Mở danh sách, xem thẻ, chọn Tham gia khảo sát
  status: clear
- id: E2.1-AF1
  type: alt_flow
  text: Chưa có khảo sát đang mở
  status: clear
- id: E2.1-AF2
  type: alt_flow
  text: Trở lại từ UC2.2/UC2.3
  status: clear
- id: E2.1-AF3
  type: alt_flow
  text: Chuyển trang
  status: clear
- id: E2.1-EF1
  type: exception_flow
  text: Không tải được danh sách MSG-025/026
  status: clear
- id: E2.1-EF2
  type: exception_flow
  text: Đợt không còn đủ điều kiện khi chọn
  status: clear
- id: E2.1-UI
  type: field
  text: Header, tiêu đề, bản web/mobile
  status: clear
open_questions:
