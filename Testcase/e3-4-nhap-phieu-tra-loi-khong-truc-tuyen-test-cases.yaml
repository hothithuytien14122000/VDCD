requirements:
- id: E3.4-BR-1
  type: business_rule
  text: Mỗi câu chọn đúng một mức; ban đầu không chọn sẵn; hình thức mặc định là hình thức không trực tuyến đầu tiên, ngày thu mặc định hôm nay
  status: clear
- id: E3.4-BR-2
  type: business_rule
  text: 'Hình thức thuộc cấu hình không trực tuyến (sai: MSG-092); ngày thu bắt buộc, thuộc kỳ, không sau hôm nay; người nhập/thời điểm tự ghi'
  status: clear
- id: E3.4-BR-3
  type: business_rule
  text: Góp ý không bắt buộc tối đa 1.000 ký tự; Chọn tất cả Hài lòng chỉ điền đáp án, không tự lưu
  status: clear
- id: E3.4-BR-4
  type: business_rule
  text: Lưu phiếu/Lưu và nhập tiếp chỉ kiểm tra và mở xem lại; Xác nhận lưu mới tạo phiếu
  status: clear
- id: E3.4-BR-5
  type: business_rule
  text: Lưu và nhập tiếp giữ hình thức/ngày thu, xóa đáp án/góp ý; Lưu phiếu về danh sách
  status: clear
- id: E3.4-BR-6
  type: business_rule
  text: Chặn bấm lặp; thử lại cùng lần xác nhận chỉ một phiếu; đã lưu trước hạn thì trả kết quả cũ; chưa lưu và hết hạn thì chặn
  status: clear
- id: E3.4-BR-7
  type: business_rule
  text: Phiếu và đáp án lưu đầy đủ trước khi tính thống kê
