requirements:
- id: E1.3-BR-1
  type: business_rule
  text: Chỉ tạo cho đơn vị thực hiện theo tài khoản
  status: clear
- id: E1.3-BR-2
  type: business_rule
  text: Mã duy nhất sinh khi lưu lần đầu, không nhập/sửa, không tái sử dụng sau xóa; hủy không tạo đợt
  status: clear
- id: E1.3-BR-3
  type: business_rule
  text: Ngày bắt đầu không trước hôm nay; ngày kết thúc >= ngày bắt đầu; cho phép tạo/trình/duyệt cùng ngày
  status: clear
- id: E1.3-BR-4
  type: business_rule
  text: 'Bắt buộc: tên, ngày bắt đầu/kết thúc, >=1 hình thức, >=1 nhóm và 1 câu; nhóm phải có tên và câu; câu phải có nội dung'
  status: clear
- id: E1.3-BR-5
  type: business_rule
  text: Hình thức chọn nhiều trong Trực tuyến/Trực tiếp/Gián tiếp qua phiếu
  status: clear
- id: E1.3-BR-6
  type: business_rule
  text: Ngày kết thúc là hạn nhận/nhập phiếu mọi hình thức
  status: clear
- id: E1.3-BR-7
  type: business_rule
  text: Thêm nhóm đặt cuối; thêm câu đặt cuối nhóm; xóa nhóm có câu phải xác nhận
  status: clear
- id: E1.3-BR-8
  type: business_rule
  text: Tay nắm đổi thứ tự nhóm; tay nắm câu chỉ đổi trong cùng nhóm; không số câu, không nút lên/xuống
  status: clear
- id: E1.3-BR-9
  type: business_rule
  text: Thang Hài lòng/Chưa hài lòng; không câu đánh giá chung, không cấu hình góp ý
  status: clear
- id: E1.3-BR-10
  type: business_rule
  text: Lưu nháp không trình; Trình duyệt chỉ báo trình khi UC1.6 thành công
  status: clear
- id: E1.3-BR-11
  type: business_rule
  text: Số phiếu mục tiêu không bắt buộc; nếu nhập phải là số nguyên > 0; trống thì không tính %
  status: clear
- id: E1.3-BR-12
  type: business_rule
  text: Lỗi lưu giữ dữ liệu soạn; hủy/quay lại có thay đổi dùng MSG-009
  status: clear
- id: E1.3-BR-13
  type: business_rule
  text: 'Giới hạn: tên đợt 255, mô tả 1.000 (không bắt buộc), tên nhóm 255, câu 1.000; MSG-010/011/013'
  status: clear
- id: E1.3-MF
