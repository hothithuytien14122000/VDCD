requirements:
- id: E2.3-BR-1
  type: business_rule
  text: Mỗi câu bắt buộc chọn đúng một mức; chọn mức còn lại thay thế mức của chính câu đó
  status: clear
- id: E2.3-BR-2
  type: business_rule
  text: Mở form mới không chọn sẵn đáp án
  status: clear
- id: E2.3-BR-3
  type: business_rule
  text: Tiến độ = số câu đã chọn/tổng số câu; góp ý không tính; 4/6 ≈ 66,67%
  status: clear
- id: E2.3-BR-4
  type: business_rule
  text: Góp ý thêm không bắt buộc, tối đa 1.000 ký tự; trống vẫn gửi được
  status: clear
- id: E2.3-BR-5
  type: business_rule
  text: Gửi phải đủ đáp án mọi câu; thiếu thì không lưu, MSG-079 tại câu và đưa tới câu thiếu đầu tiên
  status: clear
- id: E2.3-BR-6
  type: business_rule
  text: Máy chủ kiểm tra đợt đã duyệt, có Trực tuyến, còn thời gian trước khi lưu; hết ngày kết thúc thì chặn, không gửi bù
  status: clear
- id: E2.3-BR-7
  type: business_rule
  text: Phiếu thuộc đúng đợt, hình thức Trực tuyến, hệ thống tự ghi thời điểm
  status: clear
- id: E2.3-BR-8
  type: business_rule
  text: Vô hiệu nút Gửi khi xử lý; bấm lặp/thử lại cùng lần gửi chỉ một phiếu; chỉ báo thành công sau khi xác nhận lưu
  status: clear
- id: E2.3-BR-9
  type: business_rule
  text: Phiếu và đáp án lưu đầy đủ trước khi tính thống kê
  status: clear
- id: E2.3-BR-10
  type: business_rule
  text: Không lưu nháp/khôi phục sau tải lại; lỗi giữ nội dung trên màn nếu trang còn mở
  status: clear
- id: E2.3-BR-11
  type: business_rule
  text: Không đăng nhập/xác thực/nhận diện người duy nhất; không chặn một phiếu mỗi người/trình duyệt
  status: clear
- id: E2.3-BR-12
  type: business_rule
  text: Không có câu đánh giá chung, Không áp dụng, Chọn tất cả Hài lòng trên form người dân
  status: clear
