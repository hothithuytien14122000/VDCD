requirements:
- id: E3.1-BR-1
  type: business_rule
  text: Chỉ lấy phiếu hợp lệ của đúng đợt; thẻ Tổng phiếu, thẻ từng hình thức và số tab Phiếu luôn toàn đợt, không đổi theo bộ lọc
  status: clear
- id: E3.1-BR-2
  type: business_rule
  text: Lọc thời gian theo Ghi nhận lúc (không theo Ngày thu/thời điểm sửa), tính trọn ngày giờ Việt Nam; một ngày = 00:00 đến trước 00:00 hôm sau
  status: clear
- id: E3.1-BR-3
  type: business_rule
  text: Khoảng ngày AND hình thức; mặc định không giới hạn thời gian và mọi hình thức; đổi bộ lọc về trang 1
  status: clear
- id: E3.1-BR-4
  type: business_rule
  text: 10 phiếu/trang, luôn hiển thị phân trang, STT nối tiếp theo vị trí sau lọc
  status: clear
- id: E3.1-BR-5
  type: business_rule
  text: Câu hài lòng x/y = số câu Hài lòng / tổng số câu (2/3 là đủ ba câu, không phải thiếu một câu)
  status: clear
- id: E3.1-BR-6
  type: business_rule
  text: Chỉ hiện thẻ/lựa chọn hình thức đã cấu hình; không có mục tiêu thì không tính %; đạt mục tiêu không đóng đợt
  status: clear
- id: E3.1-BR-7
  type: business_rule
  text: Xem luôn kiểm tra quyền; menu sửa/xóa chỉ cho phiếu không trực tuyến còn hạn và có quyền; hết hạn chỉ xem
  status: clear
- id: E3.4-BR-1
  type: business_rule
  text: Mỗi câu chọn đúng một mức; ban đầu không chọn sẵn; hình thức mặc định là hình thức không trực tuyến đầu tiên, ngày thu mặc định hôm nay
