  requirement_refs:
  - E3.1-BR-2
- id: OQ-4
  text: 'UC3.1: ''Hủy/Esc/bấm ngoài lịch bỏ bản nháp'' — thứ tự áp dụng khi nhập Từ ngày bằng bàn phím rồi bấm ngoài; và Áp dụng khi gõ ngày hợp lệ có bắt buộc blur không? Chưa nêu.'
  requirement_refs:
  - E3.1-AF2
