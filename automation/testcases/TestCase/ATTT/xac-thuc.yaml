title: "ATTT - Xác thực"
phan_he: "ATTT - An toàn thông tin cấp độ 2 (chung)"
tong_so: 34
testcases:
  - id: ATU-X01
    title: "[API] Đăng nhập thiếu/sai captcha không cấp token kể cả khi tên đăng nhập và mật khẩu đúng định dạng"
    uc: "ATTT KT 1.3.1a"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Xác thực"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. POST authentication/jwt/login: không captcha; captchaId giả; captchaCode sai"
    ket_qua_mong_doi:
      - "HTTP 400; không có accessToken trong phản hồi"
    ket_qua_chay: "Pass"
  - id: ATU-X02
    title: "Thông báo đăng nhập sai không tiết lộ tài khoản có tồn tại hay không"
    uc: "ATTT KT 1.3.1d; PM 3"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Xác thực"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Đăng nhập tài khoản không tồn tại + mật khẩu bất kỳ"
      - "2. Đăng nhập tài khoản có thật + sai mật khẩu"
    ket_qua_mong_doi:
      - "Hai thông báo giống nhau (VD \"Tên đăng nhập hoặc mật khẩu không đúng\")"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-P01
    title: "Mật khẩu lưu dạng hash có salt (PBKDF2-HMAC-SHA256/512 hoặc tương đương), không lưu rõ hay mã hóa 2 chiều"
    uc: "ATTT KT 1.3.1b"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Truy vấn bảng người dùng trong CSDL"
      - "2. Tạo 2 người dùng cùng mật khẩu, so sánh giá trị lưu"
    ket_qua_mong_doi:
      - "Cột mật khẩu là chuỗi hash (VD tiền tố AQAAAA… của ASP.NET Identity v3); 2 người cùng mật khẩu có hash khác nhau; chụp ảnh làm minh chứng"
    ghi_chu: "Manual: cần quyền truy cập CSDL/máy chủ để lấy minh chứng"
    ket_qua_chay: "Manual"
  - id: ATU-P02
    title: "[API] Tạo người dùng rồi đọc lại: không API nào trả mật khẩu hay hash"
    uc: "ATTT KT 1.3.1b"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. QTV tạo người dùng QCA có mật khẩu"
      - "2. Đọc lại bằng idm/users, idm/users/{id}"
    ket_qua_mong_doi:
      - "Phản hồi không có trường password/passwordHash hoặc chuỗi mật khẩu vừa đặt"
    ket_qua_chay: "Pass"
  - id: ATU-P03
    title: "Phiên đăng nhập lưu ở trình duyệt không chứa mật khẩu dạng rõ (localStorage/sessionStorage/cookie)"
    uc: "ATTT KT 1.3.1b"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập"
      - "2. Kiểm tra localStorage, sessionStorage, cookie của trang"
    ket_qua_mong_doi:
      - "Không có mật khẩu dạng rõ; chỉ có token"
    ket_qua_chay: "Pass"
  - id: ATU-P04
    title: "[API] Tạo người dùng có tích \"Bắt buộc đổi mật khẩu\" → lưu cờ isRequireChangePassword = true"
    uc: "ATTT KT 1.3.1c-1"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. POST idm/users với isRequireChangePassword = true"
      - "2. Đọc lại người dùng"
    ket_qua_mong_doi:
      - "isRequireChangePassword = true"
    ket_qua_chay: "Pass"
  - id: ATU-P05
    title: "Đăng nhập lần đầu bằng mật khẩu mặc định chuyển thẳng màn Đổi mật khẩu bắt buộc, không đóng/bỏ qua được"
    uc: "ATTT KT 1.3.1c-1"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. QTV tạo người dùng (bắt buộc đổi mật khẩu)"
      - "2. Đăng nhập lần đầu"
      - "3. Thử đóng màn, bấm Back, mở URL trang chủ"
    ket_qua_mong_doi:
      - "Luôn ở màn Đổi mật khẩu bắt buộc đến khi đổi xong"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được); UC_1409: Figma màn Đổi mật khẩu bắt buộc chưa làm"
    ket_qua_chay: "Manual"
  - id: ATU-P06
    title: "Khi chưa đổi mật khẩu bắt buộc, BE chặn mọi API nghiệp vụ khác"
    uc: "ATTT KT 1.3.1c-1"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Người dùng bị gắn cờ bắt buộc đổi mật khẩu đăng nhập"
      - "2. Dùng token đó gọi API nghiệp vụ (dti/pillars, survey/surveys…)"
    ket_qua_mong_doi:
      - "HTTP 403 với thông báo cần đổi mật khẩu; chỉ API đổi mật khẩu/đăng xuất được phép"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-P07
    title: "QTV đặt lại mật khẩu cho người dùng → người dùng bị bắt buộc đổi mật khẩu ở lần đăng nhập kế tiếp"
    uc: "ATTT KT 1.3.1c-1"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. QTV sửa người dùng, nhập mật khẩu mới"
      - "2. Người dùng đăng nhập bằng mật khẩu đó"
    ket_qua_mong_doi:
      - "Chuyển màn Đổi mật khẩu bắt buộc"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-P08
    title: "[API] QTV tạo người dùng: BE từ chối mật khẩu vi phạm chính sách (ngắn hơn tối thiểu, thiếu hoa/thường, thiếu số, thiếu ký tự đặc biệt, chứa tên đăng nhập)"
    uc: "ATTT KT 1.3.1c-2"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. POST idm/users lần lượt với 5 mật khẩu vi phạm từng quy tắc"
    ket_qua_mong_doi:
      - "Cả 5 trường hợp HTTP 400; không tạo người dùng"
    ghi_chu: "Khảo sát trước: API tạo người dùng nhận mật khẩu 5 ký tự (USR-C16)"
    ket_qua_chay: "Pass"
  - id: ATU-P09
    title: "Màn Đổi mật khẩu bắt buộc (lần đầu / hết hạn) áp dụng đủ quy tắc mật khẩu ở FE và BE"
    uc: "ATTT KT 1.3.1c-2"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Ở màn Đổi mật khẩu bắt buộc nhập lần lượt mật khẩu vi phạm từng quy tắc"
    ket_qua_mong_doi:
      - "Bị chặn với thông báo đúng quy tắc vi phạm"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-P10
    title: "Gợi ý quy tắc mật khẩu trên giao diện hiển thị theo tham số hệ thống hiện hành"
    uc: "ATTT KT 1.3.1c-2"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Trung bình"
    automation: "Manual"
    cac_buoc:
      - "1. So sánh nội dung gợi ý ở form Thêm người dùng / Đổi mật khẩu với system/parameters"
    ket_qua_mong_doi:
      - "Độ dài và loại ký tự hiển thị đúng giá trị tham số (không cố định trong mã nguồn)"
    ghi_chu: "Manual: đối chiếu giao diện với tham số"
    ket_qua_chay: "Manual"
  - id: ATU-P11
    title: "Không cho đổi mật khẩu mới khi chưa đủ số ngày tối thiểu kể từ lần đổi trước"
    uc: "ATTT KT 1.3.1c-3"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Đặt tham số số ngày tối thiểu = 1"
      - "2. Đổi mật khẩu thành công"
      - "3. Đổi tiếp ngay trong ngày"
    ket_qua_mong_doi:
      - "Lần 2 bị từ chối với thông báo còn bao nhiêu ngày mới được đổi"
    ghi_chu: "Manual: thay đổi Tham số hệ thống ảnh hưởng toàn môi trường (theo README: không tự động ghi Tham số hệ thống) — chạy trên môi trường riêng rồi khôi phục"
    ket_qua_chay: "Manual"
  - id: ATU-P12
    title: "Mật khẩu hết hạn: đăng nhập bị khóa và chuyển màn Đổi mật khẩu bắt buộc; thoát/quay lại vẫn phải đổi"
    uc: "ATTT KT 1.3.1c-4"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Đặt lastPasswordChangeDate của người dùng QCA quá PASSWORD_EXPIRY_DAYS (hoặc đặt tham số = 1 ngày và chờ)"
      - "2. Đăng nhập"
      - "3. Thử thoát/quay lại"
    ket_qua_mong_doi:
      - "Không vào được hệ thống; luôn bị yêu cầu đổi mật khẩu; isPasswordExpired = true"
    ghi_chu: "Manual: thay đổi Tham số hệ thống ảnh hưởng toàn môi trường (theo README: không tự động ghi Tham số hệ thống) — chạy trên môi trường riêng rồi khôi phục; cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-P13
    title: "Đổi mật khẩu thành công khi hết hạn thì mở lại tài khoản và đăng nhập bình thường"
    uc: "ATTT KT 1.3.1c-4"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Từ trạng thái hết hạn, đổi mật khẩu hợp lệ"
      - "2. Đăng nhập lại"
    ket_qua_mong_doi:
      - "Đăng nhập được; isPasswordExpired = false; lastPasswordChangeDate cập nhật"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-P14
    title: "Cảnh báo trước khi mật khẩu hết hạn theo PASSWORD_CHANGE_WARNING_DAYS"
    uc: "ATTT KT 1.3.1c-4"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Mật khẩu"
    loai: "Bảo mật"
    uu_tien: "Trung bình"
    automation: "Manual"
    cac_buoc:
      - "1. Người dùng còn ≤ 7 ngày đến hạn mật khẩu đăng nhập"
    ket_qua_mong_doi:
      - "Hiện cảnh báo số ngày còn lại kèm liên kết đổi mật khẩu"
    ghi_chu: "Manual: thay đổi Tham số hệ thống ảnh hưởng toàn môi trường (theo README: không tự động ghi Tham số hệ thống) — chạy trên môi trường riêng rồi khôi phục"
    ket_qua_chay: "Manual"
  - id: ATU-K01
    title: "Màn đăng nhập cảnh báo số lần còn lại khi nhập sai mật khẩu"
    uc: "ATTT KT 1.3.1d"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Đăng nhập sai"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Đăng nhập tài khoản QCA với mật khẩu sai 1 lần"
    ket_qua_mong_doi:
      - "Thông báo sai mật khẩu kèm \"còn N lần\" (N = MAX_LOGIN_FAIL_COUNT − 1)"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-K02
    title: "Sai vượt ngưỡng trong khung thời gian → khóa tạm theo LOGIN_LOCK_DURATION_MINUTES; mật khẩu đúng trong thời gian khóa vẫn bị chặn"
    uc: "ATTT KT 1.3.1d"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Đăng nhập sai"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
      - "1. Nhập sai mật khẩu MAX_LOGIN_FAIL_COUNT lần liên tiếp"
      - "2. Nhập đúng mật khẩu ngay sau đó"
    ket_qua_mong_doi:
      - "Bước 1: thông báo tài khoản bị khóa tạm X phút; bước 2: vẫn bị từ chối"
    ghi_chu: "Manual: cần đăng nhập có captcha thật (không tự động hóa được); dùng tài khoản QCA dùng một lần"
    ket_qua_chay: "Manual"
  - id: ATU-K03
    title: "Hết thời gian khóa tạm thì đăng nhập lại được; lần sai rải rác ngoài khung thời gian không cộng dồn"
    uc: "ATTT KT 1.3.1d"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Đăng nhập sai"
    loai: "Bảo mật"
    uu_tien: "Trung bình"
    automation: "Manual"
    cac_buoc:
      - "1. Chờ hết thời gian khóa, đăng nhập đúng"
      - "2. Sai 1 lần, chờ quá khung thời gian, sai tiếp"
    ket_qua_mong_doi:
      - "Bước 1 đăng nhập được; bước 2 không bị khóa"
    ghi_chu: "Manual: phải chờ hết thời gian cấu hình (≥ 30 phút) hoặc chỉnh tham số tạm thời; cần đăng nhập có captcha thật (không tự động hóa được)"
    ket_qua_chay: "Manual"
  - id: ATU-K04
    title: "Vi phạm chính sách thì ngăn đăng nhập tự động: bắt buộc captcha mới mỗi lần, captcha dùng một lần"
    uc: "ATTT KT 1.3.1d"
    tac_nhan: "Người dùng (chưa đăng nhập), Quản trị hệ thống"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Đăng nhập sai"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual"
    cac_buoc:
