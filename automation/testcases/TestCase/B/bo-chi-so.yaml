  - id: SET-V02
    title: "Cấu trúc bộ chỉ số hiển thị cây trụ cột → nhóm → chỉ số cha → chỉ số con kèm Tính điểm, điểm tối thiểu/tối đa; Thu gọn tất cả hoạt động"
