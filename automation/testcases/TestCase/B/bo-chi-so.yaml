      - "2. Tìm bộ ở danh sách"
    ket_qua_mong_doi:
      - "Cột Nhóm chỉ số = 1; cột Chỉ số = 3; Phiên bản = 1; Năm áp dụng = 2026"
    ket_qua_chay: "Pass"
