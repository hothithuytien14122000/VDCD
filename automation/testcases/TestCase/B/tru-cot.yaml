      - "1. Nhập từ khóa viết HOA rồi viết thường của cùng một giá trị"
    ket_qua_mong_doi:
      - "Hai lần tìm trả về cùng số bản ghi"
    ket_qua_chay: "Pass"
  - id: PIL-L07
    title: "Ký tự đặc biệt / chuỗi SQL trong ô tìm kiếm không gây lỗi hệ thống"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Nhập  ' OR 1=1 --  và  <script>alert(1)</script>"
    ket_qua_mong_doi:
      - "Không hiện lỗi 500/trắng trang, không thực thi script, không trả về toàn bộ dữ liệu bất thường"
    ket_qua_chay: "Pass"
  - id: PIL-L08
    title: "Chuyển sang trang 2 hiển thị dữ liệu khác trang 1"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Phân trang"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Bấm trang 2 trên thanh phân trang"
    ket_qua_mong_doi:
      - "Trang 2 được đánh dấu active; nội dung bảng khác trang 1"
    ket_qua_chay: "Pass"
  - id: PIL-L09
    title: "Đổi số bản ghi/trang sang 20 thì số dòng thay đổi theo"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Phân trang"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Chọn \"20 / trang\" ở thanh phân trang"
    ket_qua_mong_doi:
      - "Số dòng tối đa mỗi trang = 20; tổng số bản ghi không đổi"
    ket_qua_chay: "Pass"
  - id: PIL-L10
    title: "Xóa từ khóa thì danh sách trở về đầy đủ"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Tìm một từ khóa"
      - "2. Xóa trắng ô tìm kiếm"
    ket_qua_mong_doi:
      - "Danh sách hiển thị lại như ban đầu (tổng số bản ghi bằng lúc đầu)"
    ket_qua_chay: "Pass"
  - id: PIL-L31
    title: "Tìm kiếm không phân biệt dấu tiếng Việt (\"chuyen doi so\" ra \"Chuyển đổi số\")"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Mở trang Trụ cột"
      - "2. Nhập tên có dấu nhưng gõ không dấu (cả chữ thường và HOA)"
    ket_qua_mong_doi:
      - "Ra các dòng có tên khớp khi bỏ dấu, không phân biệt hoa/thường"
    ket_qua_chay: "Pass"
  - id: PIL-L32
    title: "Từ khóa bỏ khoảng trắng đầu/cuối; cả cụm từ được tìm như một chuỗi liền (không tách từ)"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Nhập \"   <mã>   \" (khoảng trắng 2 đầu)"
      - "2. Nhập cụm 2 từ của tên theo thứ tự đảo ngược"
    ket_qua_mong_doi:
      - "Kết quả bằng khi nhập không có khoảng trắng; cụm đảo ngược chỉ ra dòng chứa nguyên cụm liền đó (không khớp từng từ rời)"
    ket_qua_chay: "Pass"
  - id: PIL-L33
    title: "Ký tự %, _, ' trong từ khóa được hiểu là ký tự thường"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Validate"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Lần lượt nhập \"%\", \"_\", \"'\" vào ô tìm kiếm"
    ket_qua_mong_doi:
      - "Không lỗi hệ thống; mọi dòng trả về đều chứa đúng ký tự đã nhập (không coi là ký tự đại diện / không gây lỗi SQL)"
    ket_qua_chay: "Pass"
  - id: PIL-L12
    title: "Lọc theo trạng thái khóa"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Bộ lọc"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Chọn bộ lọc trạng thái \"Đã khóa\" rồi \"Chưa khóa\""
    ket_qua_mong_doi:
      - "Mọi dòng có cột Trạng thái khớp bộ lọc"
    ket_qua_chay: "Pass"
  - id: PIL-L13
    title: "Cột Nhóm chỉ số khớp số nhóm trong chi tiết trụ cột"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem danh sách"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Ghi số \"Nhóm chỉ số\" của một trụ cột"
      - "2. Mở chi tiết"
    ket_qua_mong_doi:
      - "Số nhóm ở danh sách = số dòng bảng nhóm chỉ số trong chi tiết"
    ket_qua_chay: "Pass"
  - id: PIL-V02
    title: "Số liệu tổng hợp của trụ cột bằng tổng các nhóm bên dưới"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem chi tiết"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Mở chi tiết trụ cột có nhiều nhóm/chỉ số"
    ket_qua_mong_doi:
      - "Số chỉ số và Tổng điểm tối đa của trụ cột = tổng của các nhóm trong bảng"
    ket_qua_chay: "Pass"
  - id: PIL-V04
    title: "Mở chi tiết trụ cột với id không tồn tại không gây lỗi hệ thống"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem chi tiết"
    loai: "Validate"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] GET /dti/pillars/<id lạ>"
      - "2. Mở URL chi tiết với id lạ"
    ket_qua_mong_doi:
      - "API trả 4xx (không 500); trang không trắng, không lộ lỗi nội bộ"
    ket_qua_chay: "Pass"
  - id: PIL-V05
    title: "Trụ cột đã khóa: chi tiết không cho Cập nhật / Thêm mới nhóm"
    uc: "B.I.1-UC5"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem chi tiết"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Mở chi tiết trụ cột Đã khóa"
    ket_qua_mong_doi:
      - "Nút Cập nhật bị ẩn/vô hiệu (hoặc thao tác bị từ chối), nhất quán với menu danh sách chỉ còn \"Mở khoá\""
    ghi_chu: "Khảo sát: chi tiết trụ cột đã khóa vẫn hiện nút Cập nhật; API từ chối \"đã bị khoá\" → nghi lỗi UI"
    ket_qua_chay: "Pass"
  - id: PIL-C04
    title: "Mã chỉ khác hoa/thường so với trụ cột có sẵn bị coi là trùng"
    uc: "B.I.1-UC2"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Thêm mới"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Có trụ cột \"ABC\""
      - "2. [API] Tạo trụ cột \"abc\""
    ket_qua_mong_doi:
      - "Bị từ chối (4xx) \"Mã [abc] đã tồn tại. Vui lòng nhập mã khác.\""
    ghi_chu: "Quy tắc chung: Mã không phân biệt hoa/thường"
    ket_qua_chay: "Pass"
  - id: PIL-C05
    title: "Trùng tên trụ cột (khác mã)"
    uc: "B.I.1-UC2"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Thêm mới"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Tạo trụ cột có tên trùng trụ cột khác, mã khác"
    ket_qua_mong_doi:
      - "Bị từ chối: tên bắt trùng trong cùng nhóm cha (trụ cột không có cha → duy nhất toàn danh mục), không phân biệt hoa/thường"
    ghi_chu: "Quy tắc chung Mã/Tên"
    ket_qua_chay: "Pass"
  - id: PIL-E06
    title: "Sửa tên thành tên trùng trụ cột khác"
    uc: "B.I.1-UC5"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Chỉnh sửa"
    loai: "Nghiệp vụ"
    uu_tien: "Thấp"
    automation: "Auto"
    cac_buoc:
      - "1. Đổi tên trụ cột B thành tên trụ cột A"
    ket_qua_mong_doi:
      - "Bị từ chối; tên trụ cột B giữ nguyên"
    ghi_chu: "Cùng quy tắc với PIL-C05"
    ket_qua_chay: "Pass"
  - id: PIL-K03
    title: "Chỉ trụ cột đã khóa mới chọn được khi tạo nhóm chỉ số"
    uc: "B.I.1-UC3"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Khóa/Mở khóa"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Mở form Thêm mới nhóm chỉ số"
      - "2. Mở danh sách Trụ cột"
    ket_qua_mong_doi:
      - "Chỉ có trụ cột Đã khóa; trụ cột Chưa khóa không xuất hiện (API tạo nhóm với trụ cột chưa khóa → 400 \"Chỉ có thể chọn trụ cột đã được khóa\")"
    ket_qua_chay: "Pass"
  - id: PIL-D01
    title: "Xóa trụ cột chưa khóa, chưa có nhóm thành công"
    uc: "B.I.1-UC4"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Xóa"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Menu → Xoá"
      - "2. Xác nhận"
    ket_qua_mong_doi:
      - "Trụ cột biến mất khỏi danh sách và API"
    ket_qua_chay: "Pass"
  - id: PIL-G10
    title: "[API] Tên trụ cột đúng 255 ký tự được nhận, 256 ký tự bị từ chối"
    uc: "B.I.1-UC2"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Thêm mới"
    loai: "Validate"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] POST tên 255 ký tự"
      - "2. [API] POST tên 256 ký tự"
    ket_qua_mong_doi:
      - "255: HTTP 200; 256: HTTP 400 \"Tên không vượt quá 255 ký tự\""
    ghi_chu: "Quy tắc chung: Tên ≤ 255 ký tự; riêng Tên chỉ số và Tên nhóm chỉ số ≤ 500"
    ket_qua_chay: "Pass"
  - id: PIL-G11
    title: "[API] Tên trụ cột trùng trong cùng danh mục (khác hoa/thường) bị từ chối"
    uc: "B.I.1-UC2"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Thêm mới"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Có bản ghi tên \"X\""
      - "2. [API] Tạo bản ghi mã khác, tên \"X\" và \"x\" (HOA)"
    ket_qua_mong_doi:
      - "Bị từ chối 4xx: tên bắt trùng trong cùng nhóm cha, không phân biệt hoa/thường"
    ghi_chu: "Quy tắc chung: Tên bắt trùng chỉ trong cùng nhóm cha"
    ket_qua_chay: "Pass"
  - id: PIL-G12
    title: "[API] Tên trụ cột chỉ khác dấu (\"Trùng\" và \"Trung\") là tên khác, được tạo"
    uc: "B.I.1-UC2"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Thêm mới"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Có bản ghi tên \"Trùng\""
      - "2. [API] Tạo bản ghi tên \"Trung\""
    ket_qua_mong_doi:
      - "Được tạo (HTTP 200)"
    ghi_chu: "Quy tắc chung: so trùng tên có phân biệt dấu"
    ket_qua_chay: "Pass"
  - id: PIL-A01
    title: "API trụ cột: không token / token giả → 401"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Phân quyền"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. GET danh sách không token"
      - "2. GET với token giả"
    ket_qua_mong_doi:
      - "HTTP 401"
    ket_qua_chay: "Pass"
  - id: PIL-A02
    title: "Quyền API trụ cột đúng theo ma trận quyền Cán bộ"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Phân quyền"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Lấy ma trận quyền canbo"
      - "2. GET/POST/PUT/DELETE theo quyền Xem/Thêm/Sửa/Xóa/Khóa"
    ket_qua_mong_doi:
      - "Có quyền → được; không có → 403"
    ket_qua_chay: "Pass"
  - id: PIL-A03
    title: "Chưa đăng nhập vào trang trụ cột bị chuyển về màn đăng nhập, không lộ dữ liệu"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
