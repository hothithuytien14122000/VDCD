      - "Bảng rỗng, hiện \"Không tìm thấy dữ liệu phù hợp\"; không lỗi"
    ket_qua_chay: "Pass"
  - id: PIL-L06
    title: "Tìm kiếm không phân biệt chữ hoa/chữ thường"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
