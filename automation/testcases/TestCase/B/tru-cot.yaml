    ket_qua_chay: "Pass"
  - id: PIL-L05
    title: "Từ khóa không tồn tại → không có dữ liệu"
    uc: "B.I.1-UC1"
    tac_nhan: "Quản trị hệ thống, Cán bộ"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Cao"
