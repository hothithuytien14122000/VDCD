    title: "Chỉ Quản trị hệ thống truy cập được API ma trận; canbo, lãnh đạo Bộ, lãnh đạo đơn vị, CB/LĐ địa phương, xemonly bị 403"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Bảo mật"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
