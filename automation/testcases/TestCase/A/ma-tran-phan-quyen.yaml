    ghi_chu: "ATTT KT 1.3.3a-4, NK-11. Khảo sát: menu chưa có màn hình Nhật ký truy cập và không tìm thấy API nhật ký → chưa kiểm tra được; cần Dev/BA xác nhận"
  - id: PRM-D01
