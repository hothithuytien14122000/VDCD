title: "Ma trận phân quyền"
phan_he: "A - Quản trị hệ thống"
tong_so: 73
testcases:
  - id: PRM-L01
    title: "Admin thấy mục \"Ma trận phân quyền\" trong menu Quản trị hệ thống và mở được trang"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Truy cập"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
    ket_qua_mong_doi:
      - "Menu có mục \"Ma trận phân quyền\"; mở trang với tiêu đề \"Ma trận phân quyền\" và mô tả \"Chọn nhóm người dùng, cấp hoặc hủy từng quyền và chọn phạm vi dữ liệu của quyền đó.\""
  - id: PRM-L02
    title: "Danh sách nhóm bên trái đủ nhóm như API, mỗi nhóm có tên, mô tả (nếu có) và số quyền \"n/104\""
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Danh sách nhóm"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. [API] GET idm/permission-matrix/roles"
    ket_qua_mong_doi:
      - "Số nhóm hiển thị = số nhóm của API; tên và \"grantedCount/104\" của từng nhóm khớp API; nhóm hệ thống có biểu tượng khóa"
  - id: PRM-L03
    title: "Mở trang không kèm roleId thì tự chọn nhóm đầu tiên và hiển thị quyền của nhóm đó"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Danh sách nhóm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
    ket_qua_mong_doi:
      - "Một nhóm được đánh dấu đang chọn; panel bên phải hiển thị tên nhóm, số quyền đã cấp và cây quyền"
  - id: PRM-L04
    title: "Tìm theo tên chức năng chỉ giữ các chức năng khớp"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Nhập \"nhật ký\" vào ô \"Tìm chức năng hoặc quyền\""
    ket_qua_mong_doi:
      - "Chỉ còn module chứa chức năng \"Nhật ký truy cập\" và chức năng đó; các chức năng khác bị ẩn"
  - id: PRM-L05
    title: "Tìm không phân biệt chữ hoa/chữ thường"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Nhập \"NHẬT KÝ\", sau đó \"nhật ký\""
    ket_qua_mong_doi:
      - "Hai lần tìm trả về cùng danh sách chức năng"
  - id: PRM-L06
    title: "Tìm theo tên quyền con (vd \"Xuất Excel\") hiện mọi chức năng có quyền đó"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Nhập \"xuất excel\""
    ket_qua_mong_doi:
      - "Hiện các chức năng có quyền con \"Xuất Excel\" (vd Quản lý người dùng, Quản lý nhóm người dùng, Phân quyền cho nhóm người dùng…); không hiện chức năng không có quyền đó (vd Sao lưu dữ liệu)"
  - id: PRM-L07
    title: "Từ khóa không tồn tại hiện thông báo không tìm thấy"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Nhập \"zzqcxx_khongtontai_999\""
    ket_qua_mong_doi:
      - "Hiện \"Không tìm thấy chức năng hoặc quyền phù hợp\"; không lỗi"
  - id: PRM-L08
    title: "Ký tự đặc biệt / chuỗi SQL / HTML trong ô tìm kiếm không gây lỗi"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tìm kiếm"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Nhập  ' OR 1=1 --  và  <script>alert(1)</script>"
    ket_qua_mong_doi:
      - "Không thực thi script, không trắng trang; hiện trạng thái không tìm thấy; xóa từ khóa thì cây trở lại đầy đủ"
  - id: PRM-L09
    title: "Tab \"Đã cấp\" chỉ hiện chức năng/quyền đã cấp, tab \"Chưa cấp\" chỉ hiện quyền chưa cấp"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Bộ lọc"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (chưa có quyền) rồi [API] cấp USER.VIEW, USER.CREATE, BACKUP.VIEW"
      - "2. Mở Ma trận phân quyền, chọn nhóm vừa tạo"
      - "3. Bấm tab \"Đã cấp\""
      - "4. Bấm tab \"Chưa cấp\""
    ket_qua_mong_doi:
      - "Tab \"Đã cấp\": chỉ có chức năng Quản lý người dùng (Xem, Thêm) và Sao lưu dữ liệu (Xem); tab \"Chưa cấp\": không còn quyền Xem/Thêm của Quản lý người dùng và Xem của Sao lưu, các quyền còn lại vẫn hiện"
  - id: PRM-L10
    title: "Tab \"Tất cả\" trả lại đầy đủ sau khi lọc; tab kết hợp với ô tìm kiếm"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Bộ lọc"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Bấm tab \"Đã cấp\", nhập \"người dùng\""
      - "4. Bấm tab \"Tất cả\", xóa từ khóa"
    ket_qua_mong_doi:
      - "Bước 3: chỉ các chức năng đã cấp có chữ \"người dùng\"; bước 4: hiển thị đủ 23 chức năng như ban đầu"
  - id: PRM-L11
    title: "Nút \"Mở rộng tất cả\" / \"Thu gọn tất cả\" mở và đóng toàn bộ chức năng"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Hiển thị"
    loai: "UI"
    uu_tien: "Thấp"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Bấm \"Thu gọn tất cả\""
      - "4. Bấm \"Mở rộng tất cả\""
    ket_qua_mong_doi:
      - "Sau Thu gọn: không còn dòng quyền con nào; sau Mở rộng: mọi chức năng đều mở và thấy các quyền con"
  - id: PRM-L12
    title: "Xuất Excel tải về file .xlsx đúng tên và có nội dung phân quyền của nhóm đang chọn"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Xuất Excel"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (chưa có quyền) rồi [API] cấp USER.VIEW"
      - "2. Mở Ma trận phân quyền, chọn nhóm vừa tạo"
      - "3. Bấm \"Xuất Excel\""
    ket_qua_mong_doi:
      - "Tải về file phan-quyen-<mã nhóm>.xlsx, dung lượng > 0, là file xlsx hợp lệ và có tên chức năng \"Quản lý người dùng\""
  - id: PRM-V01
    title: "Chọn nhóm hiển thị đúng tên, mô tả, số quyền và từng quyền/phạm vi theo API"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem quyền của nhóm"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… có mô tả, cấp USER.VIEW=unit, ROLE.VIEW=all, BACKUP.VIEW=all"
      - "2. Mở Ma trận phân quyền"
      - "3. Chọn nhóm vừa tạo"
    ket_qua_mong_doi:
      - "Tiêu đề = tên nhóm, mô tả hiển thị; \"3 / 104 quyền đã cấp\"; đúng 3 quyền được tick với phạm vi \"Đơn vị\", \"Toàn hệ thống\", \"Toàn hệ thống\"; các quyền khác không tick"
  - id: PRM-V02
    title: "Cấu trúc ma trận gồm 5 module, 23 chức năng, 104 quyền với bộ đếm đúng"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Cấu trúc ma trận"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Bấm \"Mở rộng tất cả\", đếm module/chức năng/quyền con"
      - "4. [API] GET idm/permission-matrix"
    ket_qua_mong_doi:
      - "Có module A (46), B (32), C (8), D (8), E (10); tổng 23 chức năng, 104 quyền con; ba cột \"CHỨC NĂNG / QUYỀN\", \"CẤP QUYỀN\", \"PHẠM VI\"; khớp danh mục API"
  - id: PRM-V03
    title: "Tên và mô tả quyền con khớp danh mục của API"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Cấu trúc ma trận"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Mở rộng tất cả"
      - "4. So tên quyền con và tooltip (title) với API danh mục"
    ket_qua_mong_doi:
      - "Mọi quyền con có tên đúng \"name\" của API (Xem, Thêm, Sửa, Xóa, Khóa, Xuất Excel, Phê duyệt…) và tooltip đúng \"description\""
  - id: PRM-V04
    title: "Nhóm chưa có quyền hiển thị 0/104, không tick quyền nào và phạm vi hiển thị \"–\""
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem quyền của nhóm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (chưa có quyền)"
      - "2. Mở Ma trận phân quyền, chọn nhóm vừa tạo, Mở rộng tất cả"
    ket_qua_mong_doi:
      - "\"0 / 104 quyền đã cấp\"; mọi checkbox bỏ trống; cột Phạm vi hiển thị \"–\"; nút Lưu bị khóa"
  - id: PRM-V05
    title: "Nhóm hệ thống \"Quản trị hệ thống\" hiển thị 104/104 quyền, phạm vi Toàn hệ thống"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem quyền của nhóm"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Menu Quản trị hệ thống → Ma trận phân quyền"
      - "3. Chọn nhóm \"Quản trị hệ thống\" (biểu tượng khóa)"
    ket_qua_mong_doi:
      - "\"104 / 104 quyền đã cấp\"; mọi quyền được tick; phạm vi \"Toàn hệ thống\""
  - id: PRM-V06
    title: "Mở URL với roleId không tồn tại không gây lỗi trắng trang"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Xem quyền của nhóm"
    loai: "Validate"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập admin"
      - "2. Mở #/vi/permission-matrix?roleId=00000000-0000-0000-0000-000000000000"
      - "3. [API] GET idm/permission-matrix/roles/<id lạ>"
    ket_qua_mong_doi:
      - "API trả 404 \"Nhóm người dùng không tồn tại\"; trang vẫn hiển thị khung ma trận và danh sách nhóm, không lộ lỗi nội bộ"
  - id: PRM-V07
    title: "Chuyển sang nhóm khác khi còn thay đổi chưa lưu thì có cảnh báo hoặc giữ nguyên thay đổi"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Luồng"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (chưa có quyền)"
      - "2. Chọn nhóm, tick quyền \"Xem\" của Quản lý người dùng (chưa Lưu)"
      - "3. Chọn nhóm khác"
      - "4. Chọn lại nhóm ban đầu"
    ket_qua_mong_doi:
      - "Có hộp thoại xác nhận bỏ thay đổi chưa lưu (hoặc thay đổi được giữ khi quay lại); không âm thầm mất thay đổi"
    ghi_chu: "Khảo sát: không cảnh báo, thay đổi chưa lưu bị bỏ âm thầm → nghi lỗi. Cần BA xác nhận quy tắc"
  - id: PRM-V08
    title: "Tải lại trang khi chưa lưu thì quyền của nhóm không bị thay đổi"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Luồng"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (chưa có quyền) rồi cấp USER.VIEW"
      - "2. Chọn nhóm, tick thêm quyền chưa Lưu"
      - "3. Tải lại trang (F5), chọn lại nhóm"
      - "4. [API] GET idm/permission-matrix/roles/<id>"
    ket_qua_mong_doi:
      - "Chỉ còn quyền USER.VIEW đã lưu; API không có quyền vừa tick"
  - id: PRM-R01
    title: "Nhóm vừa tạo ở trang Nhóm người dùng xuất hiện trong ma trận với 0/104"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tham chiếu nhóm"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (tên có \"qc.automation\")"
      - "2. Mở Ma trận phân quyền"
    ket_qua_mong_doi:
      - "Nhóm xuất hiện trong danh sách bên trái, hiển thị \"0/104\""
  - id: PRM-R02
    title: "Đổi tên nhóm ở Nhóm người dùng thì ma trận hiển thị tên mới, quyền đã cấp giữ nguyên"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tham chiếu nhóm"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (chưa có quyền) và cấp USER.VIEW"
      - "2. [API] Đổi tên nhóm"
      - "3. Mở Ma trận phân quyền"
    ket_qua_mong_doi:
      - "Danh sách hiển thị tên mới; số quyền vẫn \"1/104\" và quyền USER.VIEW còn nguyên"
  - id: PRM-R03
    title: "Nhóm bị xóa không còn trong ma trận và API chi tiết trả 404"
    uc: "A.II.3-UC1"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Tham chiếu nhóm"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] Tạo nhóm QCA… (chưa có quyền)"
      - "2. [API] Xóa nhóm"
      - "3. Mở Ma trận phân quyền"
      - "4. [API] GET idm/permission-matrix/roles/<id>"
    ket_qua_mong_doi:
