    ket_qua_mong_doi:
      - "Hệ thống tự bật kèm quyền Xem hoặc chặn và báo cần cấp quyền Xem"
    ghi_chu: "Khảo sát: giao diện và API cho phép cấp Sửa/Xóa mà không có Xem. Cần BA xác nhận quy tắc"
  - id: PRM-E23
