  - id: PRM-M01
    title: "Quyền vừa cấp có hiệu lực với người dùng thuộc nhóm (menu, API) và quyền bị hủy thì mất hiệu lực"
    uc: "A.II.3-UC2"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Hiệu lực"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Manual — cần đăng nhập bằng tài khoản thuộc nhóm đang sửa (captcha), không tự động được"
    cac_buoc:
      - "1. Tạo nhóm QCA…, người dùng QCA… thuộc nhóm"
      - "2. Admin cấp quyền \"Xem\" Trụ cột cho nhóm → người dùng đăng nhập"
      - "3. Admin hủy quyền đó, người dùng tải lại"
    ket_qua_mong_doi:
      - "Bước 2: người dùng thấy menu Trụ cột và gọi được API (không 403); bước 3: menu biến mất, API trả 403; GET idm/permission-matrix/me phản ánh đúng"
    ghi_chu: "Chưa rõ quyền có hiệu lực ngay hay chỉ sau khi đăng nhập lại. Cần BA xác nhận quy tắc"
  - id: PRM-M02
    title: "Phạm vi dữ liệu của quyền (Đơn vị / Đơn vị và đơn vị con / Toàn hệ thống) giới hạn đúng dữ liệu thấy được"
    uc: "A.II.3-UC2"
    tac_nhan: "Quản trị hệ thống"
    tai_khoan_chay: "admin"
    chuc_nang: "Hiệu lực"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Manual — cần nhiều đơn vị, nhiều tài khoản đăng nhập (captcha) và quy tắc phạm vi do BA xác nhận"
    cac_buoc:
      - "1. Có đơn vị cha và đơn vị con, dữ liệu ở cả hai"
      - "2. Cấp quyền Xem cho nhóm lần lượt với 3 phạm vi"
      - "3. Người dùng thuộc đơn vị cha đăng nhập, xem danh sách"
    ket_qua_mong_doi:
      - "Đơn vị: chỉ dữ liệu của đơn vị cha; Đơn vị và đơn vị con: cả cha và con; Toàn hệ thống: mọi đơn vị"
    ghi_chu: "SRS §2.1 ghi phạm vi \"được cấu hình cho tài khoản, độc lập với nhóm quyền\" nhưng màn hình đặt phạm vi theo từng quyền của nhóm; UC không quy định ý nghĩa 3 mức. Cần BA xác nhận quy tắc"
