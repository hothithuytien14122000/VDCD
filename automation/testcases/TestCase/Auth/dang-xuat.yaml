  - id: LGO-S01
    title: "[API] Token cũ bị vô hiệu sau khi đăng xuất"
    uc: "AUTH.4-UC3"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Thu hồi token"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập (canbo)"
      - "2. Bấm vào tên người dùng ở góc dưới sidebar"
      - "3. Chọn \"Đăng xuất\""
      - "4. Ghi lại token trước khi đăng xuất, bấm \"Có\""
      - "5. Gọi GET /idm/users/info bằng token đã ghi"
    ket_qua_mong_doi:
      - "HTTP 401 (token đã bị thu hồi phía máy chủ)"
    ghi_chu: "Khảo sát: UI chỉ xóa localStorage, không gọi API thu hồi → token cũ vẫn dùng được (HTTP 200) tới khi hết hạn → nghi lỗi (token bị lộ vẫn dùng được sau khi người dùng đăng xuất)"
    ket_qua_chay: "Fail"
