  - id: LGO-S03
    title: "Đăng xuất ở một tab thì tab khác đang mở bị đưa về đăng nhập khi thao tác"
    uc: "AUTH.4-UC3"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Nhiều tab"
    loai: "Bảo mật"
    uu_tien: "Trung bình"
    automation: "Manual — cần quan sát tương tác hai tab thật; chưa khảo sát hành vi"
    cac_buoc:
      - "1. Đăng nhập, mở hệ thống ở hai tab A và B"
      - "2. Ở tab A đăng xuất"
      - "3. Ở tab B bấm đổi trang / thao tác"
    ket_qua_mong_doi:
      - "Tab B bị chuyển về trang đăng nhập, không hiển thị dữ liệu nghiệp vụ mới"
    ghi_chu: "Cần BA xác nhận quy tắc cách đồng bộ giữa các tab"
    ket_qua_chay: "Manual"
