    cac_buoc:
      - "1. Quản trị hệ thống cấu hình độ dài tối thiểu mật khẩu = 10, Lưu"
      - "2. Thực hiện Quên mật khẩu đến màn nhập mật khẩu mới"
      - "3. Nhập mật khẩu mới 8 ký tự đủ hoa, thường, số, ký tự đặc biệt"
    ket_qua_mong_doi:
      - "Báo không đạt độ dài tối thiểu 10; không cho cập nhật; mật khẩu không đổi"
    ghi_chu: "GitLab #26 (đã đóng)"
