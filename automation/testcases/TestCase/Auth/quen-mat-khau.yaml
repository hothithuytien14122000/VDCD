      - "2. Bấm Xác nhận"
    ket_qua_mong_doi:
      - "Báo \"Vui lòng nhập đủ 6 chữ số OTP!\"; không gọi xác thực"
    ket_qua_chay: "Pass"
  - id: RPW-O09
    title: "Bấm \"Đổi email khác\" quay lại bước nhập email"
    uc: "AUTH.2-UC2"
    tac_nhan: "Người dùng (chưa đăng nhập)"
