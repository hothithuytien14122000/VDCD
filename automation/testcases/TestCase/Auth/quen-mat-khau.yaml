    ket_qua_mong_doi:
      - "Có tiêu đề \"Quên mật khẩu\", hướng dẫn gửi OTP 6 chữ số, ô Email đăng ký, nút Lấy mã OTP, nút Quay lại đăng nhập, ghi chú liên hệ Quản trị hệ thống"
    ket_qua_chay: "Pass"
