  - id: RPW-L10
    title: "Chống dò tài khoản: phản hồi giống nhau cho email có và không có tài khoản"
    uc: "AUTH.2-UC1"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Yêu cầu OTP"
    loai: "Bảo mật"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] forgot-password với email có tài khoản"
      - "2. [API] forgot-password với email không tồn tại"
      - "3. So sánh phản hồi"
    ket_qua_mong_doi:
      - "Hai phản hồi cùng mã HTTP và cùng thông báo trung tính"
    ghi_chu: "Khảo sát: 200 (đã gửi OTP) so với 404 (chưa đăng kí) → lộ email nào có tài khoản. Cần BA xác nhận quy tắc (hệ thống nội bộ có thể chấp nhận)"
    ket_qua_chay: "Không chạy"
  - id: RPW-L11
    title: "Giới hạn tần suất gửi OTP (chống spam mail)"
    uc: "AUTH.2-UC1"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Yêu cầu OTP"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] POST forgot-password 3 lần liên tiếp trong vài giây cho cùng một email"
    ket_qua_mong_doi:
      - "Ít nhất một yêu cầu sau lần đầu bị từ chối (HTTP 429/400) để tránh spam mail"
    ghi_chu: "Khảo sát: cả 3 lần đều HTTP 200 (chỉ giao diện chặn bằng đếm ngược 1 phút) → nghi lỗi. Cần BA xác nhận quy tắc"
    ket_qua_chay: "Không chạy"
