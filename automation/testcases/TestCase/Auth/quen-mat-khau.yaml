    ket_qua_mong_doi:
      - "HTTP 400 từ chối"
    ket_qua_chay: "Pass"
  - id: RPW-O13
    title: "[API] Xác thực thiếu tham số bị từ chối, không lỗi 500"
    uc: "AUTH.2-UC2"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Xác thực OTP"
    loai: "Validate"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] GET verify-forgot-password-token không có resetPasswordToken, email"
    ket_qua_mong_doi:
      - "HTTP 4xx kèm thông báo; không 500"
    ket_qua_chay: "Pass"
  - id: RPW-P01
    title: "Màn mật khẩu mới có hai ô mật khẩu ẩn và nút Cập nhật mật khẩu"
    uc: "AUTH.2-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Màn mật khẩu mới"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Xác thực OTP thành công"
    ket_qua_mong_doi:
      - "Có ô \"Nhập mật khẩu mới\", \"Nhập lại mật khẩu mới\" (type=password), nút \"Cập nhật mật khẩu\", \"Quay lại đăng nhập\""
    ket_qua_chay: "Pass"
