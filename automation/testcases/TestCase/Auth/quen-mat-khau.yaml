    title: "Mật khẩu xác nhận không khớp thì báo lỗi trên giao diện"
    uc: "AUTH.2-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Validate"
    loai: "Validate"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Nhập mật khẩu mới \"Test!123456\", nhập lại \"Test!654321\""
    ket_qua_mong_doi:
      - "Báo \"Mật khẩu xác nhận không khớp!\" ngay dưới ô nhập lại; nút Cập nhật mật khẩu bị vô hiệu; không gọi reset-password; mật khẩu không đổi"
    ket_qua_chay: "Pass"
  - id: RPW-P05
    title: "[API] Mật khẩu rỗng bị từ chối"
    uc: "AUTH.2-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Validate"
    loai: "Validate"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] reset-password với password và confirmPassword rỗng"
    ket_qua_mong_doi:
      - "HTTP 400 báo bắt buộc; mật khẩu không đổi"
    ghi_chu: "Khảo sát: HTTP 200 \"Thay đổi mật khẩu thành công\" và OTP bị tiêu thụ → có thể đặt mật khẩu rỗng → nghi lỗi nghiêm trọng. Test tự khôi phục mật khẩu sau khi chạy"
    ket_qua_chay: "Pass"
