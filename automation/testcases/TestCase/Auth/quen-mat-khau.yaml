  - id: RPW-O15
    title: "OTP đã hết hiệu lực bị từ chối, không chuyển sang màn nhập mật khẩu mới"
    uc: "AUTH.2-UC2"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
