    ket_qua_chay: "Pass"
  - id: RPW-P13
    title: "[API] Đặt lại thiếu resetPasswordToken bị từ chối"
    uc: "AUTH.2-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
