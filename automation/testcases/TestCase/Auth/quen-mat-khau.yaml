      - "1. [API] POST forgot-password với email  ' OR 1=1 --  và <script>alert(1)</script>"
    ket_qua_mong_doi:
      - "HTTP 4xx (không 500); không gửi mail"
    ket_qua_chay: "Pass"
  - id: RPW-L11
    title: "Giới hạn tần suất gửi OTP (chống spam mail)"
    uc: "AUTH.2-UC1"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Yêu cầu OTP"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] POST forgot-password 3 lần liên tiếp trong vài giây cho cùng một email"
    ket_qua_mong_doi:
      - "Ít nhất một yêu cầu sau lần đầu bị từ chối (HTTP 429/400) để tránh spam mail"
    ghi_chu: "Khảo sát: cả 3 lần đều HTTP 200 (chỉ giao diện chặn bằng đếm ngược 1 phút) → nghi lỗi. Cần BA xác nhận quy tắc"
    ket_qua_chay: "Pass"
  - id: RPW-O05
    title: "Nhập thiếu 6 chữ số OTP thì báo lỗi"
    uc: "AUTH.2-UC2"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
