    ghi_chu: "GitLab #243 (đã đóng), GitLab #128 (đã đóng). Nội dung thông báo và xung đột với chống dò tài khoản — cần BA xác nhận"
  - id: RPW-L13
    title: "Email đăng ký nhập khác hoa/thường vẫn nhận được OTP"
    uc: "AUTH.2-UC1"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
