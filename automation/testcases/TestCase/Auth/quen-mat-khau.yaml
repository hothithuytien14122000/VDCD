  - id: RPW-P15
    title: "Đặt lại mật khẩu áp dụng chính sách mật khẩu đang cấu hình ở Tham số hệ thống"
    uc: "AUTH.2-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Validate"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
