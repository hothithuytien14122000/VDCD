    loai: "Validate"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] reset-password body rỗng"
    ket_qua_mong_doi:
      - "HTTP 400 \"Vui lòng nhập resetPasswordToken\""
    ket_qua_chay: "Pass"
