    ket_qua_mong_doi:
      - "Quay lại màn nhập email đăng ký"
    ket_qua_chay: "Pass"
  - id: RPW-O12
    title: "[API] OTP của tài khoản này không dùng được cho email khác"
    uc: "AUTH.2-UC2"
    tac_nhan: "Người dùng (chưa đăng nhập)"
