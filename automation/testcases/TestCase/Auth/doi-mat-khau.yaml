      - "2. Mở menu người dùng → Thông tin cá nhân"
      - "3. Bấm \"Đổi mật khẩu\""
      - "4. Nhập giá trị vào từng ô"
      - "5. Bấm biểu tượng mắt của từng ô, rồi bấm lại"
    ket_qua_mong_doi:
      - "Mặc định type=password; bấm mắt ô nào thì chỉ ô đó hiện rõ (type=text); bấm lại thì ẩn"
    ket_qua_chay: "Pass"
