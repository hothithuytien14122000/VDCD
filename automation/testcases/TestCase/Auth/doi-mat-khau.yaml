      - "2. Đổi mật khẩu với mật khẩu hiện tại đúng"
    ket_qua_mong_doi:
      - "Bị khóa tạm hoặc giới hạn tần suất; có thông báo rõ ràng"
    ghi_chu: "Cần BA xác nhận quy tắc số lần và thời gian khóa"
    ket_qua_chay: "Manual"
  - id: CPW-G01
    title: "Lỗi máy chủ (500) khi cập nhật: hiển thị lỗi, hộp thoại vẫn mở, không báo thành công"
    uc: "AUTH.3-UC5"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Lỗi hệ thống"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
