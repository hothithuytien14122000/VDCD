  - id: CPW-L01
    title: "Trang Thông tin cá nhân có khối \"Mật khẩu\" và nút \"Đổi mật khẩu\""
    uc: "AUTH.3-UC1"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Truy cập"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập (canbo)"
      - "2. Mở menu người dùng (góc dưới sidebar) → Thông tin cá nhân"
    ket_qua_mong_doi:
      - "Mở trang /profile; có khối \"Mật khẩu\" kèm mô tả \"Đổi mật khẩu định kỳ…\" và nút \"Đổi mật khẩu\""
    ket_qua_chay: "Pass"
  - id: CPW-L02
    title: "Mọi vai trò đăng nhập đều có nút \"Đổi mật khẩu\" (kể cả vai trò chỉ xem)"
