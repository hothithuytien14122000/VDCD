      - "2. Mở menu người dùng → Thông tin cá nhân"
      - "3. Bấm \"Đổi mật khẩu\""
      - "4. Nhập dữ liệu hợp lệ (mật khẩu hiện tại sai); làm chậm API 3 giây"
