      - "2. Bấm \"Cập nhật mật khẩu\" sau mỗi lần"
    ket_qua_mong_doi:
      - "Cả hai lần báo \"Mật khẩu cũ không chính xác\"; không lỗi 500, không thực thi script, không đổi mật khẩu"
    ket_qua_chay: "Pass"
  - id: CPW-S06
    title: "Mật khẩu chỉ gửi trong body, không nằm trên URL và không xuất hiện trong phản hồi"
    uc: "AUTH.3-UC4"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Chống tấn công"
    loai: "Bảo mật"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập (canbo)"
      - "2. Mở menu người dùng → Thông tin cá nhân"
      - "3. Bấm \"Đổi mật khẩu\""
      - "4. Nhập mật khẩu hiện tại sai \"Sai!Matkhau1\", mới \"Moi!123456a\", xác nhận khớp; bấm \"Cập nhật mật khẩu\""
      - "5. Quan sát request/response"
    ket_qua_mong_doi:
      - "Request là PUT, URL không chứa mật khẩu, mật khẩu nằm trong body; phản hồi không chứa mật khẩu hay hash"
    ket_qua_chay: "Pass"
  - id: CPW-S07
    title: "Nhập sai mật khẩu hiện tại nhiều lần liên tiếp bị giới hạn"
    uc: "AUTH.3-UC4"
