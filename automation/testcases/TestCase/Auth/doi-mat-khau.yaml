      - "2. Mở menu người dùng → Thông tin cá nhân"
      - "3. Bấm \"Đổi mật khẩu\""
      - "4. Giả lập API PUT …/password trả HTTP 500"
      - "5. Nhập mật khẩu hiện tại sai, mới và xác nhận hợp lệ; bấm \"Cập nhật mật khẩu\""
    ket_qua_mong_doi:
      - "Có thông báo lỗi; hộp thoại không đóng; không hiện \"Đổi mật khẩu thành công\"; không lộ chi tiết nội bộ"
    ket_qua_chay: "Pass"
  - id: CPW-G02
    title: "Mất kết nối mạng khi cập nhật: hiển thị lỗi, người dùng thao tác lại được"
    uc: "AUTH.3-UC5"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Lỗi hệ thống"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập (canbo)"
      - "2. Mở menu người dùng → Thông tin cá nhân"
      - "3. Bấm \"Đổi mật khẩu\""
      - "4. Nhập dữ liệu hợp lệ (mật khẩu hiện tại sai)"
      - "5. Ngắt mạng rồi bấm \"Cập nhật mật khẩu\""
      - "6. Bật mạng, bấm lại"
    ket_qua_mong_doi:
      - "Có thông báo lỗi kết nối, hộp thoại không treo; sau khi có mạng bấm lại gửi được request"
    ghi_chu: "Khảo sát: mất mạng thì bấm Cập nhật không có thông báo nào (im lặng), hộp thoại vẫn mở → nghi lỗi (người dùng không biết thao tác thất bại)"
    ket_qua_chay: "Fail"
  - id: CPW-G03
    title: "Bấm \"Cập nhật mật khẩu\" nhiều lần liên tiếp chỉ gửi một request"
