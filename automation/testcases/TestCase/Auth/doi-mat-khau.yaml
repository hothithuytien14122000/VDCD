    cac_buoc:
      - "1. Mở Đổi mật khẩu"
      - "2. Nhập mật khẩu hiện tại đúng và dùng đúng giá trị đó làm mật khẩu mới + xác nhận"
      - "3. Bấm \"Cập nhật mật khẩu\""
    ket_qua_mong_doi:
      - "Bị từ chối với thông báo mật khẩu mới phải khác mật khẩu hiện tại"
    ghi_chu: "Cần BA xác nhận quy tắc có cấm trùng mật khẩu cũ hay không"
    ket_qua_chay: "Manual"
