    tai_khoan_chay: "canbo"
    chuc_nang: "Mật khẩu mới"
    loai: "Validate"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. PUT với passwordOld=\"\" (để qua bước kiểm tra mật khẩu cũ) và passwordNew = \"Aa1!\" + 125 chữ \"a\" (129 ký tự)"
      - "2. Nếu trả 200: khôi phục mật khẩu gốc"
    ket_qua_mong_doi:
      - "HTTP 400 \"Không được nhập vượt quá 128 ký tự\"; mật khẩu không đổi"
    ghi_chu: "Khảo sát: server kiểm tra mật khẩu cũ TRƯỚC độ dài mật khẩu mới; với mật khẩu cũ sai chỉ thấy lỗi mật khẩu cũ. Case tự khôi phục mật khẩu"
    ket_qua_chay: "Pass"
