    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Truy cập"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Lần lượt đăng nhập superadmin, ldd, xemonly"
      - "2. Mở Thông tin cá nhân"
    ket_qua_mong_doi:
      - "Cả ba vai trò đều thấy nút \"Đổi mật khẩu\" và mở được hộp thoại"
    ket_qua_chay: "Pass"
  - id: CPW-L03
    title: "Hộp thoại Đổi mật khẩu hiển thị đủ thành phần"
    uc: "AUTH.3-UC1"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Hộp thoại"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập (canbo)"
      - "2. Mở menu người dùng → Thông tin cá nhân"
      - "3. Bấm \"Đổi mật khẩu\""
    ket_qua_mong_doi:
      - "Tiêu đề \"Đổi mật khẩu\"; ba ô có dấu * (Mật khẩu hiện tại, Mật khẩu mới, Xác nhận mật khẩu mới) đều rỗng; khối \"Độ mạnh mật khẩu\" với 5 tiêu chí; ghi chú \"Sau khi đổi, các phiên đăng xuất trên thiết bị khác sẽ bị đăng xuất.\"; nút Huỷ, Cập nhật mật khẩu, nút đóng (X)"
    ket_qua_chay: "Pass"
  - id: CPW-L04
    title: "Ba ô mật khẩu mặc định ẩn, bấm biểu tượng mắt hiện/ẩn từng ô"
    uc: "AUTH.3-UC1"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Hộp thoại"
