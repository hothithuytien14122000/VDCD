      - "2. Mở menu người dùng → Thông tin cá nhân"
      - "3. Bấm \"Đổi mật khẩu\""
      - "4. Nhập mật khẩu hiện tại SAI, mật khẩu mới và xác nhận gồm 129 ký tự hợp lệ (\"Aa1!\" + 125 chữ \"a\")"
      - "5. Bấm \"Cập nhật mật khẩu\""
    ket_qua_mong_doi:
      - "Giao diện giới hạn ô nhập tối đa 128 ký tự hoặc báo \"vượt quá 128 ký tự\" và không gửi request PUT (nhất quán với giới hạn của server)"
    ghi_chu: "Khảo sát: ô nhập cho gõ tới 255 ký tự, UI không chặn và vẫn gửi request; server mới trả 400 \"Không được nhập vượt quá 128 ký tự\" (chỉ khi mật khẩu cũ qua kiểm tra) → UI lệch quy tắc server"
    ket_qua_chay: "Fail"
