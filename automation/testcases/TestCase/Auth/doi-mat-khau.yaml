    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Manual — cần mật khẩu hiện tại ĐÚNG nên làm đổi mật khẩu thật của tài khoản; chạy trên tài khoản dùng một lần"
    cac_buoc:
      - "1. Đăng nhập bằng tài khoản dùng một lần"
      - "2. Thông tin cá nhân → Đổi mật khẩu"
      - "3. Nhập mật khẩu hiện tại đúng, mật khẩu mới \"Moi!123456a\" hợp lệ, xác nhận khớp"
      - "4. Bấm \"Cập nhật mật khẩu\""
    ket_qua_mong_doi:
      - "Hiện thông báo \"Đổi mật khẩu thành công\"; hộp thoại đóng; vẫn ở trang Thông tin cá nhân"
    ket_qua_chay: "Manual"
  - id: CPW-M02
