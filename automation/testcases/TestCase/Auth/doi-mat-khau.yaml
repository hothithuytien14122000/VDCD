    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Lấy id người dùng qua GET /idm/users/info (token canbo)"
      - "2. PUT /idm/users/{id}/password với passwordOld=\"Sai!Matkhau1\", passwordNew=\"Moi!123456a\""
    ket_qua_mong_doi:
      - "HTTP 400, message \"Mật khẩu cũ không chính xác\", isSuccess=false"
    ket_qua_chay: "Pass"
