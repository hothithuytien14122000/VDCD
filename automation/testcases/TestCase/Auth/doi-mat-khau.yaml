  - id: CPW-S07
    title: "Nhập sai mật khẩu hiện tại nhiều lần liên tiếp bị giới hạn"
    uc: "AUTH.3-UC4"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Chống tấn công"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual — dễ làm khóa tài khoản dùng chung; chạy trên tài khoản dùng một lần"
    cac_buoc:
      - "1. Đổi mật khẩu với mật khẩu hiện tại sai 10 lần liên tiếp"
      - "2. Đổi mật khẩu với mật khẩu hiện tại đúng"
    ket_qua_mong_doi:
      - "Bị khóa tạm hoặc giới hạn tần suất; có thông báo rõ ràng"
    ghi_chu: "Cần BA xác nhận quy tắc số lần và thời gian khóa"
    ket_qua_chay: "Manual"
  - id: CPW-M01
    title: "Đổi mật khẩu thành công trọn luồng trên giao diện"
    uc: "AUTH.3-UC6"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Đổi mật khẩu"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Manual — cần mật khẩu hiện tại ĐÚNG nên làm đổi mật khẩu thật của tài khoản; chạy trên tài khoản dùng một lần"
    cac_buoc:
      - "1. Đăng nhập bằng tài khoản dùng một lần"
      - "2. Thông tin cá nhân → Đổi mật khẩu"
      - "3. Nhập mật khẩu hiện tại đúng, mật khẩu mới \"Moi!123456a\" hợp lệ, xác nhận khớp"
      - "4. Bấm \"Cập nhật mật khẩu\""
    ket_qua_mong_doi:
      - "Hiện thông báo \"Đổi mật khẩu thành công\"; hộp thoại đóng; vẫn ở trang Thông tin cá nhân"
    ket_qua_chay: "Manual"
  - id: CPW-M02
