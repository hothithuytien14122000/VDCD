  - id: CPW-S03
    title: "[API] Không đổi được mật khẩu của người dùng khác bằng token của mình"
    uc: "AUTH.3-UC4"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Phân quyền"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Dùng token canbo, PUT /idm/users/{id của một người dùng KHÁC}/password với passwordOld=\"Sai!Matkhau1\""
    ket_qua_mong_doi:
      - "Bị từ chối 403/404 (không phải 400 \"Mật khẩu cũ không chính xác\"); mật khẩu người khác không đổi"
    ghi_chu: "Khảo sát: với id người dùng KHÁC đang tồn tại (qc.ldd) API trả 400 \"Mật khẩu cũ không chính xác\" — tức không chặn quyền, chỉ kiểm mật khẩu cũ của chính người đó → nghi lỗi nghiêm trọng (IDOR); kết hợp lỗi CPW-A03 (mật khẩu cũ rỗng được chấp nhận) có thể đổi mật khẩu của bất kỳ ai. Chỉ dùng mật khẩu cũ sai, KHÔNG khai thác thật; id đã xóa/không tồn tại thì 404"
    ket_qua_chay: "Fail"
  - id: CPW-S04
