  - id: CPW-V12
    title: "Mật khẩu mới quá 128 ký tự bị giao diện chặn trước khi gọi API"
    uc: "AUTH.3-UC2"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Validate"
    loai: "Validate"
