    ghi_chu: "Khảo sát: HTTP 200 \"Đổi mật khẩu thành công\" → nghi lỗi nghiêm trọng (đổi được mật khẩu mà không cần biết mật khẩu cũ; kẻ giữ token có thể chiếm tài khoản). Case tự khôi phục mật khẩu"
    ket_qua_chay: "Fail"
