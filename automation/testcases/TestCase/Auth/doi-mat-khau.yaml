  - id: CPW-M04
    title: "Sau khi đổi, phiên hiện tại vẫn dùng được, phiên trên thiết bị khác bị đăng xuất"
    uc: "AUTH.3-UC6"
    tac_nhan: "Người dùng (đã đăng nhập)"
    tai_khoan_chay: "canbo"
    chuc_nang: "Sau khi đổi"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Manual — cần nhập captcha thật khi đăng nhập"
    cac_buoc:
      - "1. Đăng nhập cùng tài khoản trên 2 trình duyệt A và B"
      - "2. Ở A đổi mật khẩu thành công"
      - "3. Ở A thao tác tiếp"
      - "4. Ở B thao tác tiếp (đổi trang/gọi API)"
    ket_qua_mong_doi:
      - "A vẫn dùng bình thường; B bị đưa về trang đăng nhập / API trả 401 (đúng như ghi chú trên hộp thoại)"
    ghi_chu: "Khảo sát: sau khi đổi, token đang dùng vẫn hợp lệ; chưa xác minh được phiên khác bị thu hồi (không có token thứ hai) → nghi lỗi nếu B vẫn dùng được"
    ket_qua_chay: "Manual"
  - id: CPW-M05
    title: "Mật khẩu mới trùng mật khẩu hiện tại bị từ chối"
    uc: "AUTH.3-UC6"
