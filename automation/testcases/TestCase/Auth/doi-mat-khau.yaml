    ket_qua_mong_doi:
      - "HTTP 404 \"Không tìm thấy người dùng\" hoặc 400; không lỗi 500, không lộ stack trace"
    ket_qua_chay: "Pass"
  - id: CPW-S05
    title: "Ký tự đặc biệt / SQL / script trong mật khẩu hiện tại không gây lỗi hệ thống"
    uc: "AUTH.3-UC4"
