    title: "[API] Gọi API nghiệp vụ với token giả bị từ chối 401"
    uc: "AUTH.1-UC5"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Phiên"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] GET /idm/users với Authorization: Bearer a.b.c"
    ket_qua_mong_doi:
      - "HTTP 401 (không trả dữ liệu)"
    ket_qua_chay: "Không chạy"
