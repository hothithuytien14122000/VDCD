    ket_qua_mong_doi:
      - "HTTP 400 báo captcha không hợp lệ; không trả token"
    ket_qua_chay: "Không chạy"
  - id: LGN-C08
    title: "[API] Đăng nhập với captchaId không tồn tại bị từ chối"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Bảo mật"
    uu_tien: "Cao"
