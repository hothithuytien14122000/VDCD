  - id: LGN-S02
    title: "Token giả trong bộ nhớ trình duyệt bị đẩy về trang đăng nhập, không lặp chuyển hướng"
    uc: "AUTH.1-UC5"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Phiên"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
