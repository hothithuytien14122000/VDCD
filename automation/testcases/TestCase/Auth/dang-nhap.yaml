  - id: LGN-C09
    title: "Ký tự đặc biệt / SQL / script trong tên đăng nhập không gây lỗi hệ thống"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] POST jwt/login với email  ' OR 1=1 --  và  <script>alert(1)</script>"
      - "2. Nhập chuỗi trên vào form đăng nhập"
    ket_qua_mong_doi:
      - "HTTP 4xx (không 500); trang không trắng, không thực thi script, không đăng nhập được"
    ket_qua_chay: "Không chạy"
