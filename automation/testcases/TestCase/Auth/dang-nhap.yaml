  - id: LGN-C01
    title: "Nhập sai mã captcha thì báo lỗi và ở lại trang đăng nhập"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Validate"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Nhập tên đăng nhập, mật khẩu đúng, mã captcha sai \"zzzzz\""
      - "2. Bấm Đăng nhập"
    ket_qua_mong_doi:
      - "Báo \"Mã captcha không hợp lệ hoặc đã hết hạn, vui lòng thử lại\"; vẫn ở trang đăng nhập; không lưu token"
    ket_qua_chay: "Không chạy"
  - id: LGN-C02
    title: "Nút \"Đổi mã xác nhận\" tải ảnh captcha mới và xóa mã đã nhập"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Nhập \"abc\" vào ô mã"
      - "2. Bấm nút Đổi mã xác nhận"
    ket_qua_mong_doi:
      - "Ảnh captcha thay đổi; ô Mã xác nhận được xóa trắng"
    ket_qua_chay: "Không chạy"
  - id: LGN-C03
    title: "Sau khi đăng nhập thất bại do sai captcha, ảnh captcha được làm mới"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Nhập mã captcha sai"
      - "2. Bấm Đăng nhập"
      - "3. So sánh ảnh captcha trước và sau"
    ket_qua_mong_doi:
      - "Ảnh captcha (và captchaId) được làm mới để lần thử sau dùng mã mới"
    ghi_chu: "Khảo sát: ảnh captcha giữ nguyên sau lỗi, ô mã vẫn còn \"zzzzz\" → nghi lỗi. Cần BA xác nhận quy tắc (captcha dùng một lần)"
    ket_qua_chay: "Không chạy"
  - id: LGN-C10
    title: "Sau khi đăng nhập thất bại, nhập mã captcha mới vào ô và bấm Đăng nhập lại thì mã mới được gửi đi"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Nhập đủ thông tin với mã captcha sai, bấm Đăng nhập (báo lỗi captcha)"
      - "2. Gõ mã khác vào ô Mã xác nhận"
      - "3. Bấm Đăng nhập lần nữa"
    ket_qua_mong_doi:
      - "Request thứ hai gửi đúng mã vừa gõ (không báo \"Vui lòng nhập mã xác nhận!\" khi ô đang có mã)"
    ghi_chu: "Khảo sát: ô hiện mã mới gõ nhưng bấm Đăng nhập báo \"Vui lòng nhập mã xác nhận!\" và không gửi request; chỉ sau khi bấm \"Đổi mã xác nhận\" mới đăng nhập lại được → nghi lỗi nghiêm trọng (người dùng sai mật khẩu một lần phải làm mới captcha thủ công)"
    ket_qua_chay: "Không chạy"
  - id: LGN-C04
    title: "[API] Lấy captcha trả captchaId và ảnh PNG, mỗi lần một mã khác nhau"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Chức năng"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. [API] GET /authentication/captcha 2 lần"
    ket_qua_mong_doi:
      - "HTTP 200; có captchaId (khác nhau giữa hai lần) và captchaImage dạng data:image/png;base64"
    ket_qua_chay: "Không chạy"
  - id: LGN-C05
    title: "[API] Phản hồi captcha không chứa dữ liệu cho phép suy ra đáp án"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. [API] GET /authentication/captcha"
      - "2. Kiểm tra các trường trả về"
    ket_qua_mong_doi:
      - "Chỉ có captchaId và captchaImage; không có băm/đáp án của mã"
    ghi_chu: "Khảo sát: phản hồi có thêm captchaHash (64 hex, dạng SHA-256) → mã captcha ngắn có thể bị suy ngược bằng vét cạn → nghi lỗi bảo mật. Cần dev xác nhận mục đích trường này"
    ket_qua_chay: "Không chạy"
  - id: LGN-C06
    title: "[API] Đăng nhập với captcha sai bị từ chối HTTP 400, không trả token"
    uc: "AUTH.1-UC3"
    tac_nhan: "Người dùng (chưa đăng nhập)"
    tai_khoan_chay: "không đăng nhập"
    chuc_nang: "Captcha"
    loai: "Bảo mật"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
