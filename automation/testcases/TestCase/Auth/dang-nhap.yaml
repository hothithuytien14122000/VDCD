      - "2. Mở /#/vi/users"
      - "3. Theo dõi số lần chuyển trang trong 3 giây"
    ket_qua_mong_doi:
      - "Chuyển về trang đăng nhập đúng một lần và đứng yên tại đó (không quá 5 lần chuyển trang)"
    ghi_chu: "Khảo sát: ứng dụng chuyển qua lại /auth/login ↔ /dashboard-demo hàng trăm lần mỗi giây (vòng lặp chuyển hướng) → nghi lỗi nghiêm trọng, treo trình duyệt"
    ket_qua_chay: "Không chạy"
