    ket_qua_mong_doi:
      - "Mọi dòng thuộc kỳ đang diễn ra và trạng thái ∈ {Chưa thực hiện, Đang chấm điểm, Bị từ chối, Đã phê duyệt}; không có Chờ duyệt/Đã gửi/Chờ mở khóa/Chưa gửi (BR-3)"
    ghi_chu: "Khảo sát: tab Cần xử lý không xuất hiện với cbdp; filter todo của tài khoản Bộ trả cả Đã gửi/Chờ mở khóa → Cần BA xác nhận quy tắc"
