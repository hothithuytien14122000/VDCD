testcases:
  - id: RES-L03
    title: "Cột Xếp loại hiển thị chip tên mức và dòng phụ Điểm xếp hạng (%) cho kết quả Đã gửi"
    uc: "C.UC1.1"
    tac_nhan: "Cán bộ, Cán bộ địa phương"
    tai_khoan_chay: "canbo"
    chuc_nang: "Xem danh sách"
    loai: "Nghiệp vụ"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập Cán bộ"
      - "2. Mở menu Đánh giá CĐS → Kết quả tự đánh giá"
      - "3. Chọn tab \"Đã gửi\""
    ket_qua_mong_doi:
      - "Mỗi dòng Đã gửi có cột Xếp loại: chip tên mức theo màu mức, dòng phụ dạng \"Tốt, 87,22%\""
    ghi_chu: "Khảo sát: giao diện KHÔNG có cột Xếp loại (API trả levelName, rankingPercent) → nghi lỗi thiếu chức năng (BR-10)"
    ket_qua_chay: "Pass"
  - id: RES-L05
    title: "Mở màn hình mặc định chọn tab \"Cần xử lý\" (tài khoản có đơn vị, giao diện đơn vị)"
    uc: "C.UC1.1"
    tac_nhan: "Cán bộ, Cán bộ địa phương"
    tai_khoan_chay: "canbo"
    chuc_nang: "Xem danh sách"
    loai: "Chức năng"
    uu_tien: "Cao"
    automation: "Auto"
    cac_buoc:
      - "1. Đăng nhập Lãnh đạo địa phương"
      - "2. Mở menu Kết quả tự đánh giá"
    ket_qua_mong_doi:
      - "Tab \"Cần xử lý\" được chọn mặc định và hiển thị đầu tiên (BR-2)"
    ghi_chu: "Khảo sát: tab Cần xử lý chỉ xuất hiện với tài khoản có đơn vị và KHÔNG có quyền LOCK/REASSESS/REQUEST_ASSESSMENT (ldp); Cán bộ (canbo/cbdp) mặc định tab \"Tất cả\" vì được cấp các quyền đó → lệch SRS. Cần BA xác nhận quy tắc (cấu hình quyền của vai trò QC)"
    ket_qua_chay: "Pass"
  - id: RES-L08
    title: "Số trên tab \"Cần xử lý\" bằng số kết quả cần xử lý theo từ khóa và kỳ đang lọc"
    uc: "C.UC1.1"
    tac_nhan: "Cán bộ, Cán bộ địa phương"
    tai_khoan_chay: "canbo"
    chuc_nang: "Xem danh sách"
    loai: "Nghiệp vụ"
    uu_tien: "Trung bình"
    automation: "Auto"
    cac_buoc:
      - "1. Mở tab Cần xử lý, ghi số"
      - "2. Nhập từ khóa/chọn kỳ"
      - "3. Đối chiếu số trên tab và số dòng của tab"
    ket_qua_mong_doi:
      - "Số trên tab = tổng bản ghi khi chọn tab đó (API summary.todoCount = totalElements của filter todo), cập nhật theo từ khóa/kỳ (BR-3, AF3)"
    ket_qua_chay: "Pass"
