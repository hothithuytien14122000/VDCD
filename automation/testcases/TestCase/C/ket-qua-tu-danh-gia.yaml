      - "Tab Cần xử lý: không có bộ lọc Thời hạn; tab khác: có bộ lọc Thời hạn (BR-4)"
    ket_qua_chay: "Pass"
  - id: RES-L26
    title: "Số hiển thị trên tab trạng thái bằng tổng bản ghi khi chọn tab đó"
