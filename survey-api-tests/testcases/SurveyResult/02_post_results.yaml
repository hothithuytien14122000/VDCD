# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyResult
# Endpoint: POST /api/v1/survey/surveys/{surveyId}/results
# Muc do anh huong: TAO DU LIEU THAT - gan nhan [Mutation]
#
# Ghi chu: chi ap dung cho phieu nhap tay: hinh thuc Truc tiep (2) hoac Gian tiep qua phieu (3).
# Phieu Truc tuyen (method = 1) do cong dan tu gui qua SurveyPublic, khong tao qua API nay.
#
# PHAT HIEN KHI TEST TREN MOI TRUONG THAT: khao sat KHONG tu dong chuyen sang "Dang dien ra"
# (status=5) ngay sau khi duoc phe duyet, du cho startDate <= thoi diem hien tai. Da kiem chung:
# tao khao sat voi startDate 1 gio truoc, phe duyet xong, GET lai van thay status=3 (Da phe duyet).
# => Co le can mot tien trinh nen (scheduled job) chay dinh ky de cap nhat trang thai theo thoi gian,
# hoac can cho den dot chay ke tiep cua job do. De test duoc nhom API SurveyResult tren moi truong
# that, can: (1) hoi dev co cach nao kich hoat thu cong qua trang thai "Dang dien ra" khong, hoac
# (2) dung du lieu khao sat co san DANG O status=5 tren he thong (vi du khao sat entry hien co) thay
# vi tu tao moi trong luc test. DAY LA MOT PHAT HIEN QUAN TRONG CAN BAO CAO CHO DEV (xem muc "Cac
# phat hien quan trong" trong README.md cua bo test).
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyResult
endpoint: POST /api/v1/survey/surveys/{surveyId}/results
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYRESULT_004
    title: "[Mutation] Ghi nhan ket qua khao sat hop le - hinh thuc Truc tiep, tra loi du cau hoi"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - Khao sat {surveyId} dang o trang thai Dang dien ra (status = 5) va co hinh thuc Truc tiep (methods chua 2)
      - Da lay danh sach cau hoi cua khao sat (qua GET chi tiet khao sat)
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi body:
          method: 2
          note: "Phieu test tu dong"
          answers: "<mang cau tra loi day du cho tat ca cau hoi cua khao sat, result = 1 hoac 2>"
    expected_result:
      - Status code 200
      - Response.data co ma phieu (code) do he thong tu sinh
      - resultCount cua khao sat (xem lai qua GET /survey/surveys/{id}) tang them 1

  - id: TC_SURVEYRESULT_004b
    title: "[Mutation] Ghi nhan ket qua hop le - hinh thuc Gian tiep qua phieu"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    preconditions:
      - Khao sat dang Dang dien ra, co hinh thuc Gian tiep qua phieu (methods chua 3)
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi method=3, answers day du
    expected_result:
      - Status code 200, phieu duoc ghi nhan voi method=3

  - id: TC_SURVEYRESULT_004c
    title: "[Mutation] Ghi nhan ket qua KHONG kem note (note la optional)"
    priority: Thap
    tags: [mutation]
    category: Happy path
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi method=2, answers day du,
        KHONG co truong note
    expected_result:
      - Status code 200 (note khong bat buoc)

  - id: TC_SURVEYRESULT_004d
    title: "[Mutation] Ghi nhan nhieu ket qua lien tiep - ma phieu (code) khong trung lap"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    steps:
      - Gui lien tiep 3 request POST hop le vao cung 1 khao sat
    expected_result:
      - Status code 200 ca 3 lan
      - 3 ma phieu (code) sinh ra la DUY NHAT, khong trung nhau
      - resultCount tang dung 3 don vi so voi truoc do

  # ---------- Negative / business rule ----------
  - id: TC_SURVEYRESULT_005
    title: "[Mutation] Ghi nhan ket qua khao sat voi hinh thuc khong thuoc danh sach hinh thuc cua dot khao sat"
    priority: Cao
    tags: [mutation]
    category: Negative
    preconditions:
      - Khao sat {surveyId} CHI co hinh thuc Truc tiep (methods = [2]), khong co Gian tiep qua phieu
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi method = 3 (Gian tiep qua phieu)
    expected_result:
      - Status code 400 Bad Request (hinh thuc khong hop le voi dot khao sat nay)

  - id: TC_SURVEYRESULT_005b
    title: "[Mutation] Ghi nhan ket qua voi method = 1 (Truc tuyen) qua API nay (khong duoc phep)"
    priority: Cao
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi method = 1
    expected_result:
      - Status code 400 Bad Request - phieu Truc tuyen CHI duoc tao qua SurveyPublic, khong duoc tao
        qua API quan tri nay (tranh gia mao nguon phieu)

  - id: TC_SURVEYRESULT_005c
    title: "[Mutation] method khong hop le (ngoai enum, vi du 0, -1, 99)"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi method = 99
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYRESULT_006
    title: "[Mutation] Ghi nhan ket qua khao sat nhung thieu cau tra loi cho mot so cau hoi"
    priority: Cao
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi answers chi gom mot phan cau hoi
    expected_result:
      - Status code 400 Bad Request
      - Response bao loi "phai tra loi day du tat ca cau hoi"

  - id: TC_SURVEYRESULT_006b
    title: "[Mutation] answers la mang rong []"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi answers = []
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYRESULT_006c
    title: "[Mutation] answers co questionId khong thuoc khao sat"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request voi 1 phan tu answers co surveyQuestionId la uuid ngau nhien khong thuoc khao sat
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYRESULT_006d
    title: "[Mutation] answers co result ngoai enum (vi du 0, 3)"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request voi 1 phan tu answers co result = 3
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYRESULT_006e
    title: "[Mutation] answers co 1 cau hoi bi tra loi lap (duplicate surveyQuestionId)"
    priority: Thap
    tags: [mutation]
    category: Negative
    steps:
      - Gui request voi answers co 2 phan tu trung surveyQuestionId
    expected_result:
      - Status code 400 Bad Request, hoac chi lay ban ghi cuoi (CAN XAC NHAN)

  - id: TC_SURVEYRESULT_007
    title: "[Mutation] Ghi nhan ket qua khao sat khi khao sat KHONG o trang thai Dang dien ra"
    priority: Cao
    tags: [mutation]
    category: Negative
    preconditions:
      - Khao sat {surveyId} dang o trang thai khac Dang dien ra (vi du Da ket thuc / Nhap / Cho phe duyet)
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi du lieu hop le
    expected_result:
      - Status code 400 hoac 409 (khong the ghi nhan ket qua khi khao sat chua/khong con dien ra)

  - id: TC_SURVEYRESULT_007b
    title: "[Mutation] surveyId khong ton tai"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results voi surveyId ngau nhien khong ton tai
    expected_result:
      - Status code 404 Not Found

  - id: TC_SURVEYRESULT_NEG_001
    title: "[Mutation] note qua dai (vi du 10000 ky tu)"
    priority: Thap
    tags: [mutation]
    category: Boundary
    steps:
      - Gui request hop le voi note la chuoi 10000 ky tu
    expected_result:
      - Status code 400 neu co gioi han do dai, hoac 200 neu khong gioi han (CAN XAC NHAN)

  # ---------- Security ----------
  - id: TC_SURVEYRESULT_SEC_010
    title: "[Mutation][Security] Ghi nhan ket qua khi khong co token"
    priority: Cao
    tags: [mutation]
    category: Security
    steps:
      - Gui request POST /api/v1/survey/surveys/{surveyId}/results KHONG kem Authorization
    expected_result:
      - Status code 401 Unauthorized

  - id: TC_SURVEYRESULT_SEC_011
    title: "[Mutation][Security] note chua ma script (XSS)"
    priority: Trung binh
    tags: [mutation]
    category: Security
    steps:
      - Gui request hop le voi note = "<script>alert(1)</script>"
    expected_result:
      - Status code 200, du lieu duoc luu nguyen van/encode an toan, khong thuc thi script khi hien thi
