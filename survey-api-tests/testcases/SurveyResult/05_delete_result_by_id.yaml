# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyResult
# Endpoint: DELETE /api/v1/survey/surveys/{surveyId}/results/{id}
# Muc do anh huong: XOA DU LIEU THAT - gan nhan [Mutation]
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyResult
endpoint: DELETE /api/v1/survey/surveys/{surveyId}/results/{id}
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYRESULT_014
    title: "[Mutation] Xoa phieu nhap tay (Truc tiep / Gian tiep qua phieu) khi khao sat dang dien ra - thanh cong"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Co phieu nhap tay rieng cho test thuoc khao sat dang Dang dien ra"
    steps:
      - "Gui request DELETE /api/v1/survey/surveys/{surveyId}/results/{id}"
      - "Goi lai GET /api/v1/survey/surveys/{surveyId}/results/{id} de xac nhan"
    expected_result:
      - "Request DELETE tra ve status code 200, isSuccess = true"
      - "Request GET sau do tra ve 404 Not Found"
      - "resultCount cua khao sat giam di 1"

  # ---------- Negative / business rule ----------
  - id: TC_SURVEYRESULT_015
    title: "[Mutation] Xoa phieu Truc tuyen (do cong dan gui) - phai bi tu choi"
    priority: Cao
    tags: [mutation]
    category: Negative
    preconditions:
      - "Co phieu ket qua voi method = 1 (Truc tuyen), duoc tao qua SurveyPublic"
    steps:
      - "Gui request DELETE /api/v1/survey/surveys/{surveyId}/results/{id} voi id cua phieu Truc tuyen noi tren"
    expected_result:
      - "Status code 400 hoac 403 (khong duoc phep xoa phieu Truc tuyen do cong dan gui)"
      - "Phieu van con ton tai sau khi goi API (kiem tra lai bang GET chi tiet)"

  - id: TC_SURVEYRESULT_016
    title: "[Mutation] Xoa phieu khi khao sat khong con dang dien ra"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    preconditions:
      - "Khao sat lien quan da Da ket thuc (status = 6)"
    steps:
      - "Gui request DELETE /api/v1/survey/surveys/{surveyId}/results/{id}"
    expected_result:
      - "Status code 400 hoac 409 (khong cho xoa ket qua khi khao sat khong con dang dien ra)"

  - id: TC_SURVEYRESULT_017
    title: "[Mutation] Xoa phieu voi id khong ton tai"
    priority: Thap
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request DELETE /api/v1/survey/surveys/{surveyId}/results/{id} voi id ngau nhien khong ton tai"
    expected_result:
      - "Status code 404 Not Found"

  - id: TC_SURVEYRESULT_017b
    title: "[Mutation] Id ket qua ton tai nhung thuoc 1 khao sat khac (surveyId khong khop)"
    priority: Trung binh
    tags: [mutation]
    category: Negative / Security
    preconditions:
      - "Co 2 khao sat A va B; id phieu thuoc khao sat A"
    steps:
      - "Gui request DELETE /api/v1/survey/surveys/{B}/results/{id-cua-phieu-thuoc-A}"
    expected_result:
      - "Status code 404 Not Found (khong duoc xoa nham phieu khi surveyId trong URL khong khop, tranh loi IDOR)"
      - "Phieu thuoc khao sat A van con nguyen ven"

  # ---------- Idempotency ----------
  - id: TC_SURVEYRESULT_IDEM_001
    title: "[Mutation] Goi DELETE 2 lan lien tiep tren cung 1 id (idempotency)"
    priority: Trung binh
    tags: [mutation]
    category: Idempotency
    steps:
      - "Gui request DELETE (lan 1 - thanh cong)"
      - "Gui lai request DELETE voi cung id (lan 2)"
    expected_result:
      - "Lan 1 tra ve 200"
      - "Lan 2 tra ve 404 Not Found"

  # ---------- Security ----------
  - id: TC_SURVEYRESULT_SEC_040
    title: "[Mutation][Security] Xoa phieu khi khong co token"
    priority: Cao
    tags: [mutation]
    category: Security
    steps:
      - "Gui request DELETE /api/v1/survey/surveys/{surveyId}/results/{id} KHONG kem Authorization"
    expected_result:
      - "Status code 401 Unauthorized"
      - "Phieu khong bi xoa"

  # ---------- Data consistency ----------
  - id: TC_SURVEYRESULT_DC_010
    title: "[Mutation] Xoa phieu lam giam dung so lieu thong ke lien quan (resultCount, participants)"
    priority: Trung binh
    tags: [mutation]
    category: Data consistency
    steps:
      - "Ghi nhan resultCount cua khao sat truoc khi xoa"
      - "Gui request DELETE phieu"
      - "Goi lai GET /api/v1/survey/surveys/{surveyId} de lay resultCount moi"
    expected_result:
      - "resultCount moi = resultCount cu - 1"
