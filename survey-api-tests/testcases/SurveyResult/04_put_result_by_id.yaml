# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyResult
# Endpoint: PUT /api/v1/survey/surveys/{surveyId}/results/{id}
# Muc do anh huong: SUA DU LIEU THAT - gan nhan [Mutation]
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyResult
endpoint: PUT /api/v1/survey/surveys/{surveyId}/results/{id}
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYRESULT_010
    title: "[Mutation] Sua ket qua khao sat (hinh thuc, ghi chu, muc danh gia) - thanh cong"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Co phieu ket qua nhap tay (Truc tiep/Gian tiep) ton tai, khao sat dang Dang dien ra"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{surveyId}/results/{id} voi method, note, answers moi (van phai du cau hoi)"
    expected_result:
      - "Status code 200"
      - "Response.data phan anh dung cac gia tri vua cap nhat"

  - id: TC_SURVEYRESULT_010b
    title: "[Mutation] Sua phieu - doi hinh thuc tu Truc tiep sang Gian tiep qua phieu (neu khao sat co ca 2)"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Khao sat co ca 2 hinh thuc Truc tiep va Gian tiep qua phieu, phieu dang la Truc tiep"
    steps:
      - "Gui request PUT voi method = 3"
    expected_result:
      - "Status code 200, Response.data.method = 3"

  - id: TC_SURVEYRESULT_010c
    title: "[Mutation] Sua phieu - cap nhat lai toan bo cau tra loi (doi tat ca ket qua Hai long thanh Chua hai long)"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    steps:
      - "Gui request PUT voi answers co toan bo result = 2 (truoc do la 1)"
    expected_result:
      - "Status code 200, du lieu duoc cap nhat dung; kiem tra lai bang GET chi tiet phieu"

  # ---------- Negative / business rule ----------
  - id: TC_SURVEYRESULT_011
    title: "[Mutation] Sua ket qua khao sat khi khao sat da ket thuc (khong con Dang dien ra)"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    preconditions:
      - "Khao sat lien quan da chuyen sang Da ket thuc (status = 6)"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{surveyId}/results/{id} voi du lieu hop le"
    expected_result:
      - "Status code 400 hoac 409 (khong cho sua ket qua khi khao sat khong con dang dien ra)"

  - id: TC_SURVEYRESULT_011b
    title: "[Mutation] Sua phieu Truc tuyen (method=1) do cong dan gui - khong duoc phep sua"
    priority: Cao
    tags: [mutation]
    category: Negative
    preconditions:
      - "Co phieu voi method = 1, duoc gui qua SurveyPublic"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{surveyId}/results/{id} voi id cua phieu Truc tuyen do"
    expected_result:
      - "Status code 400 hoac 403 (phieu truc tuyen do nguoi dan tu gui, can bo khong duoc chinh sua de dam bao tinh khach quan cua ket qua) - CAN XAC NHAN day co phai quy tac nghiep vu bat buoc (tuong tu nhu khong duoc xoa phieu truc tuyen o endpoint DELETE)"

  - id: TC_SURVEYRESULT_012
    title: "[Mutation] Sua ket qua khao sat nhung thieu cau tra loi"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{surveyId}/results/{id} voi answers thieu mot so cau hoi"
    expected_result:
      - "Status code 400 Bad Request"

  - id: TC_SURVEYRESULT_012b
    title: "[Mutation] Sua voi method khong thuoc danh sach hinh thuc cua khao sat"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT voi method khong nam trong methods cua khao sat (vi du khao sat chi co [2], sua thanh 3)"
    expected_result:
      - "Status code 400 Bad Request"

  - id: TC_SURVEYRESULT_013
    title: "[Mutation] Sua ket qua khao sat voi id khong ton tai"
    priority: Thap
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{surveyId}/results/{id} voi id ngau nhien khong ton tai"
    expected_result:
      - "Status code 404 Not Found"

  # ---------- Security ----------
  - id: TC_SURVEYRESULT_SEC_030
    title: "[Mutation][Security] Sua ket qua khi khong co token"
    priority: Cao
    tags: [mutation]
    category: Security
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{surveyId}/results/{id} KHONG kem Authorization"
    expected_result:
      - "Status code 401 Unauthorized"
