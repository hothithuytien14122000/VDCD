# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyResult
# Endpoint: GET /api/v1/survey/surveys/{surveyId}/results
# Lien quan use case: UC-E.6 (Cap nhat ket qua khao sat - khong phai khao sat truc tuyen)
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyResult
endpoint: GET /api/v1/survey/surveys/{surveyId}/results
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYRESULT_001
    title: Lay danh sach ket qua khao sat cua 1 dot khao sat
    priority: Cao
    category: Happy path
    preconditions:
      - "Khao sat {surveyId} ton tai va da co it nhat 1 ket qua (phieu) duoc ghi nhan"
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results"
    expected_result:
      - "Status code 200"
      - "Danh sach tra ve chi gom cac phieu thuoc dung khao sat {surveyId}"
      - "Moi phieu co: method (hinh thuc), note, danh sach cau tra loi (answers), nguoi/thoi gian tao"

  - id: TC_SURVEYRESULT_002
    title: Loc / phan trang / sap xep danh sach ket qua khao sat
    priority: Trung binh
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results?page=1&size=10&filter={\"method\":2}&sort=createdOnDate desc"
    expected_result:
      - "Status code 200"
      - "Tat ca ban ghi tra ve co method = 2 (Truc tiep)"
      - "So luong ban ghi <= 10, sap xep theo thoi gian tao giam dan"

  - id: TC_SURVEYRESULT_002b
    title: Loc danh sach ket qua theo khoang thoi gian tao (neu ho tro)
    priority: Thap
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results?filter={\"fromDate\":\"2026-10-01\",\"toDate\":\"2026-10-31\"}"
    expected_result:
      - "Status code 200, tat ca ban ghi co createdOnDate nam trong khoang da loc (CAN XAC NHAN ten truong filter chinh xac voi dev, hien Swagger khong liet ke chi tiet cac field filter)"

  - id: TC_SURVEYRESULT_002c
    title: Danh sach ket qua gom ca phieu Truc tuyen (do cong dan gui qua SurveyPublic)
    priority: Trung binh
    category: Happy path
    preconditions:
      - "Khao sat co ca phieu nhap tay (Truc tiep/Gian tiep) va phieu Truc tuyen tu cong dan"
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results"
    expected_result:
      - "Status code 200"
      - "Danh sach gom DU ca 3 loai method (1,2,3) neu khao sat co ca 3 hinh thuc, khong bi thieu loai nao"

  # ---------- Boundary ----------
  - id: TC_SURVEYRESULT_BV_001
    title: Khao sat chua co ket qua nao (danh sach rong)
    priority: Thap
    category: Boundary
    preconditions:
      - "Khao sat vua duoc phe duyet, chua co ai gui ket qua"
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results"
    expected_result:
      - "Status code 200, content = [], totalElements = 0"

  - id: TC_SURVEYRESULT_BV_002
    title: Phan trang bat thuong (page=0, size am, size qua lon)
    priority: Thap
    category: Boundary
    steps:
      - "Gui lan luot voi page=0, size=-1, size=100000"
    expected_result:
      - "Khong gay loi 500; tra ve 400 hoac tu dieu chinh ve gia tri hop le"

  # ---------- Negative ----------
  - id: TC_SURVEYRESULT_003
    title: Lay danh sach ket qua khao sat voi surveyId khong ton tai
    priority: Trung binh
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results voi surveyId ngau nhien khong ton tai"
    expected_result:
      - "Status code 404 Not Found, hoac 200 voi danh sach rong tuy thiet ke (CAN XAC NHAN)"

  - id: TC_SURVEYRESULT_003b
    title: filter JSON khong hop le
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results?filter={loi-json"
    expected_result:
      - "Status code 400 Bad Request"

  # ---------- Security ----------
  - id: TC_SURVEYRESULT_SEC_001
    title: "[Security] Goi API khi khong co token"
    priority: Cao
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results KHONG kem Authorization"
    expected_result:
      - "Status code 401 Unauthorized"

  - id: TC_SURVEYRESULT_SEC_002
    title: "[Security/Privacy] Khong lo thong tin dinh danh nguoi gui phieu Truc tuyen"
    priority: Cao
    category: Security / Data exposure
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results, kiem tra cac phieu co method=1 (Truc tuyen)"
    expected_result:
      - "Cac phieu Truc tuyen KHONG chua thong tin dinh danh ca nhan nguoi dan (ten that, sdt, dia chi IP) vi nguoi dan gui an danh qua SurveyPublic"

  # ---------- Data consistency ----------
  - id: TC_SURVEYRESULT_DC_001
    title: Tong so ket qua (totalElements) khop voi resultCount cua khao sat
    priority: Trung binh
    category: Data consistency
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId} de lay resultCount"
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results?page=1&size=1 de lay totalElements"
    expected_result:
      - "resultCount (tu API chi tiet khao sat) phai BANG totalElements (tu API danh sach ket qua)"

  - id: TC_SURVEYRESULT_BV_003
    title: "[BUG dung chung voi TC_SURVEY_008b] Sort nhieu truong: tang dan roi giam dan gay 500"
    priority: Trung binh
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys/{surveyId}/results?sort=method,-createdOnDate"
    expected_result:
      - "KY VONG: Status code 200"
      - "THUC TE (DA XAC NHAN 2026-10-06): Status code 500 - cung 1 loi goc voi TC_SURVEY_008b, vi
        tat ca endpoint co tham so sort deu dung chung 1 ham sap xep phia backend
        (ApplySorting/GeneatThenByDescending)."
