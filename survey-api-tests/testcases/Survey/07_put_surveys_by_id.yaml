# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): Survey
# Endpoint: PUT /api/v1/survey/surveys/{id}
# Muc do anh huong: SUA DU LIEU THAT - gan nhan [Mutation]
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: Survey
endpoint: PUT /api/v1/survey/surveys/{id}
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEY_026
    title: "[Mutation] Sua khao sat dang Nhap - thanh cong"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Co san mot khao sat dang o trang thai Nhap (status = 1)"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi body cap nhat lai name, voteTarget, methods (co organizationId hop le)"
    expected_result:
      - "Status code 200"
      - "Response.data phan anh dung cac gia tri vua cap nhat"
      - "Danh sach cau hoi (neu co gui len) thay the toan bo cau hoi cu"

  - id: TC_SURVEY_027
    title: "[Mutation] Sua khao sat va gui duyet (status = Cho phe duyet)"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Co khao sat dang Nhap va co it nhat 1 cau hoi trong body gui len"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi status = 2 va questions khong rong"
    expected_result:
      - "Status code 200"
      - "Response.data.status = 2 (Cho phe duyet)"

  - id: TC_SURVEY_027b
    title: "[Mutation] Sua khao sat dang Bi tu choi (status=4) - sua lai va gui duyet"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Co khao sat dang o trang thai Bi tu choi (status = 4)"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi status = 2 (gui lai de duyet)"
    expected_result:
      - "Status code 200"
      - "Response.data.status = 2 (Cho phe duyet) - xac nhan tu Bi tu choi co the quay lai Cho phe duyet"

  - id: TC_SURVEY_027c
    title: "[Mutation] Sua khao sat - danh sach cau hoi gui len THAY THE toan bo cau hoi cu"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Khao sat dang Nhap, hien co 3 cau hoi"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi questions chi gom 1 cau hoi MOI (khac noi dung cu)"
    expected_result:
      - "Status code 200"
      - "Response.data.questions CHI con 1 cau hoi (cau hoi moi), 2 cau hoi cu da bi xoa/thay the hoan toan (khong phai THEM vao danh sach cu)"

  - id: TC_SURVEY_027d
    title: "[Mutation] Sua khao sat - xoa het cau hoi (questions=[]) trong khi status van la Nhap"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi questions = [] va status = 1 (Nhap)"
    expected_result:
      - "Status code 200 (Nhap khong bat buoc phai co cau hoi)"
      - "Response.data.questions = []"

  - id: TC_SURVEY_027e
    title: "[Mutation] Sua khao sat - cap nhat organizationId sang 1 don vi khac hop le"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    preconditions:
      - "Co san 2 organizationId hop le khac nhau"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi organizationId moi (khac voi luc tao)"
    expected_result:
      - "Status code 200"
      - "Response.data.organizationId va organizationName duoc cap nhat dung theo gia tri moi"

  # ---------- Negative / business rule ----------
  - id: TC_SURVEY_028
    title: "[Mutation] Sua khao sat dang o trang thai KHONG cho phep sua (vi du Dang dien ra / Da phe duyet)"
    priority: Cao
    tags: [mutation]
    category: Negative
    preconditions:
      - "Co khao sat voi status khac Nhap (1) va khac Bi tu choi (4), vi du status = 5 (Dang dien ra)"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi du lieu cap nhat bat ky"
    expected_result:
      - "Status code 400 hoac 409 (nghiep vu khong cho sua khi khong o trang thai Nhap/Bi tu choi)"
      - "Du lieu khao sat khong bi thay doi (kiem tra lai bang GET chi tiet)"

  - id: TC_SURVEY_028b
    title: "[Mutation] Sua khao sat dang Cho phe duyet (status=2) - khong duoc phep sua"
    priority: Cao
    tags: [mutation]
    category: Negative
    preconditions:
      - "Co khao sat dang o trang thai Cho phe duyet (status = 2)"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi du lieu cap nhat bat ky"
    expected_result:
      - "Status code 400 hoac 409 (dang cho duyet thi khong duoc sua, phai cho duyet/tu choi xong moi sua tiep)"

  - id: TC_SURVEY_028c
    title: "[Mutation] Sua khao sat da Da ket thuc (status=6)"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    preconditions:
      - "Co khao sat da Da ket thuc (status = 6)"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi du lieu cap nhat bat ky"
    expected_result:
      - "Status code 400 hoac 409"

  - id: TC_SURVEY_029
    title: "[Mutation] Sua khao sat voi id khong ton tai"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi id ngau nhien khong ton tai"
    expected_result:
      - "Status code 404 Not Found"

  - id: TC_SURVEY_NEG_020
    title: "[Mutation] Sua khao sat - thieu truong bat buoc 'name'"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi body KHONG co name"
    expected_result:
      - "Status code 400 Bad Request"

  - id: TC_SURVEY_NEG_021
    title: "[Mutation] Sua khao sat voi organizationId khong ton tai"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi organizationId = uuid ngau nhien khong ton tai"
    expected_result:
      - "Status code 400 Bad Request, message tuong tu nhu khi tao moi (\"Đơn vị không tồn tại hoặc không được phép sử dụng\")"

  - id: TC_SURVEY_NEG_022
    title: "[Mutation] Sua khao sat - methods rong"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi methods = []"
    expected_result:
      - "Status code 400 Bad Request"

  - id: TC_SURVEY_NEG_023
    title: "[Mutation] Sua khao sat - endDate truoc startDate"
    priority: Thap
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi endDate < startDate"
    expected_result:
      - "Status code 400 Bad Request"

  - id: TC_SURVEY_NEG_024
    title: "[Mutation] Sua voi id sai dinh dang (khong phai uuid)"
    priority: Thap
    tags: [mutation]
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys/abc-khong-phai-uuid voi body hop le"
    expected_result:
      - "Status code 404 Not Found (tuong tu GET)"

  # ---------- Security ----------
  - id: TC_SURVEY_SEC_030
    title: "[Mutation][Security] Sua khao sat khi khong co token"
    priority: Cao
    tags: [mutation]
    category: Security
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} KHONG kem Authorization"
    expected_result:
      - "Status code 401 Unauthorized"
      - "Du lieu khong bi thay doi"

  - id: TC_SURVEY_SEC_031
    title: "[Mutation][Security] Sua khao sat cua don vi khac bang tai khoan bi gioi han quyen"
    priority: Cao
    tags: [mutation]
    category: Security
    preconditions:
      - "Co tai khoan bi gioi han theo 1 don vi, khao sat {id} thuoc don vi khac"
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} bang token cua tai khoan bi gioi han"
    expected_result:
      - "Status code 403 Forbidden (hoac 404 de tranh lo thong tin ton tai) - CAN XAC NHAN"

  # ---------- Idempotency / concurrency ----------
  - id: TC_SURVEY_IDEM_001
    title: "[Mutation] Goi PUT 2 lan voi cung 1 body (idempotency)"
    priority: Thap
    tags: [mutation]
    category: Idempotency
    steps:
      - "Gui request PUT /api/v1/survey/surveys/{id} voi body A"
      - "Gui lai request PUT /api/v1/survey/surveys/{id} voi CUNG body A"
    expected_result:
      - "Ca 2 request deu tra ve 200 voi ket qua giong nhau (khong tao them history/ban ghi lap)"

  - id: TC_SURVEY_RACE_001
    title: "[Mutation] 2 request PUT dong thoi tren cung 1 khao sat (race condition)"
    priority: Thap
    tags: [mutation]
    category: Concurrency
    steps:
      - "Gui gan nhu dong thoi 2 request PUT /api/v1/survey/surveys/{id} voi 2 noi dung khac nhau (vi du name A, name B)"
    expected_result:
      - "Ca 2 request khong duoc gay loi 500"
      - "Du lieu cuoi cung nhat quan voi 1 trong 2 request (last-write-wins), khong bi hong du lieu (vi du khong bi tron lan 1 phan cua request A va 1 phan cua request B)"
