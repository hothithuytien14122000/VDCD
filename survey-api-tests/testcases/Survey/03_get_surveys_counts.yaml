# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): Survey
# Endpoint: GET /api/v1/survey/surveys/counts
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: Survey
endpoint: GET /api/v1/survey/surveys/counts
test_cases:

  - id: TC_SURVEY_019
    title: Lay so luong khao sat cho cac tab (total, submitted)
    priority: Trung binh
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys/counts"
    expected_result:
      - "Status code 200"
      - "Response.data co 2 truong: total (tong so khao sat) va submitted (so khao sat da trinh duyet, khac Nhap)"
      - "total >= submitted >= 0"

  - id: TC_SURVEY_019b
    title: Goi API khi khong co token => 401
    priority: Trung binh
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys/counts KHONG kem header Authorization"
    expected_result:
      - "Status code 401 Unauthorized"

  - id: TC_SURVEY_019c
    title: Doi chieu total voi tong so ban ghi tra ve tu danh sach khao sat
    priority: Trung binh
    category: Data consistency
    steps:
      - "Gui request GET /api/v1/survey/surveys/counts"
      - "Gui request GET /api/v1/survey/surveys?page=1&size=1"
    expected_result:
      - "Status code 200 ca 2 request"
      - "Gia tri counts.total phai BANG gia tri totalElements tra ve tu danh sach khao sat (khong loc)"

  - id: TC_SURVEY_019d
    title: Doi chieu submitted voi so khao sat loc submitted=true tu danh sach
    priority: Trung binh
    category: Data consistency
    steps:
      - "Gui request GET /api/v1/survey/surveys/counts"
      - "Gui request GET /api/v1/survey/surveys?filter={\"submitted\":true}&page=1&size=1"
    expected_result:
      - "Status code 200 ca 2 request"
      - "Gia tri counts.submitted phai BANG totalElements cua danh sach da loc submitted=true"

  - id: TC_SURVEY_019e
    title: Cac tham so query thua/khong lien quan bi bo qua (API khong nhan tham so nao theo swagger)
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys/counts?page=2&size=5&filter={\"status\":1}"
    expected_result:
      - "Status code 200, ket qua tra ve KHONG bi anh huong boi cac tham so thua nay (van la tong so toan he thong)"
