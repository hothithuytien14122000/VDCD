  - id: TC_SURVEY_BV_013
    title: "[Mutation] voteTarget la so am"
    priority: Trung binh
    tags: [mutation]
    category: Boundary
    steps:
      - Gui request POST /api/v1/survey/surveys voi voteTarget = -1
    expected_result:
      - Status code 400 Bad Request (so nguoi tham gia muc tieu khong the am)
        (CAN XAC NHAN - hien schema khong co rang buoc nay, co the he thong van chap nhan)

  - id: TC_SURVEY_BV_014
