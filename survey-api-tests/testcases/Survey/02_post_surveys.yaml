  - id: TC_SURVEY_NEG_011
    title: "[Mutation] status truyen gia tri khac Nhap(1)/Cho phe duyet(2) khi TAO MOI (vi du 3, 5, 6)"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/survey/surveys voi status = 3 (Da phe duyet)
      - Gui them 1 request voi status = 5 (Dang dien ra)
    expected_result:
      - Status code 400 Bad Request cho ca 2 request (khong the tao moi truc tiep o trang thai
        Da phe duyet/Dang dien ra - phai di qua quy trinh Nhap -> Cho phe duyet -> Duyet),
        hoac he thong chap nhan va tu dong gan (CAN XAC NHAN quy tac nghiep vu)

  # ---------- Security ----------
  - id: TC_SURVEY_SEC_010
    title: "[Mutation][Security] name/description chua ma script (kiem tra luu tru an toan, khong XSS luu tru)"
    priority: Trung binh
    tags: [mutation]
    category: Security
    steps:
      - Gui request POST /api/v1/survey/surveys voi name = "<script>alert(1)</script>" va
        description = "<img src=x onerror=alert(1)>"
    expected_result:
      - Status code 200 (he thong khong bat buoc phai tu choi, nhung PHAI luu/tra ve chuoi nguyen van
        hoac da encode an toan - khong duoc de script thuc thi khi hien thi tren giao dien FE)
      - "Kiem tra lai qua GET chi tiet: du lieu tra ve dung voi du lieu da gui (luu nguyen ban), FE chiu trach nhiem encode khi render (can phoi hop kiem tra phia FE)"

  - id: TC_SURVEY_SEC_011
    title: "[Mutation][Security] Tao khao sat khi khong co token => 401"
    priority: Cao
    tags: [mutation]
    category: Security
    steps:
      - Gui request POST /api/v1/survey/surveys KHONG kem Authorization, voi body hop le
    expected_result:
      - Status code 401 Unauthorized
      - Khao sat KHONG duoc tao (kiem tra lai bang danh sach, so luong khong tang)

  - id: TC_SURVEY_SEC_012
    title: "[Mutation][Security] Tao khao sat voi tai khoan khong co quyen (role thap hon) => 403"
    priority: Cao
    tags: [mutation]
    category: Security
    preconditions:
      - Co 1 tai khoan/token voi role KHONG duoc phep tao khao sat (vi du nguoi dan, hoac can bo
        khong co quyen trong phan he nay) - CAN CHUAN BI TAI KHOAN TEST RIENG
    steps:
      - Gui request POST /api/v1/survey/surveys voi token cua tai khoan khong co quyen
    expected_result:
      - Status code 403 Forbidden

  # ---------- Data consistency ----------
  - id: TC_SURVEY_DC_010
    title: "[Mutation] Ma khao sat (code) tu sinh khong trung lap khi tao nhieu khao sat lien tiep cung nam"
    priority: Trung binh
    tags: [mutation]
    category: Data consistency
    steps:
      - Gui lien tiep 3 request POST /api/v1/survey/surveys hop le, cung nam bat dau (vi du 2026)
    expected_result:
      - Status code 200 cho ca 3 request
      - 3 ma code (vi du KS-2026-xxx) sinh ra la DUY NHAT, khong trung nhau, va tang dan theo so thu tu
