  - id: TC_SURVEY_BV_019
    title: "[Mutation] Khong truyen startDate/endDate (bo trong, deu la optional theo schema)"
    priority: Trung binh
    tags: [mutation]
    category: Boundary
    steps:
      - Gui request POST /api/v1/survey/surveys KHONG co startDate va endDate
    expected_result:
      - Status code 200 neu he thong thuc su cho phep bo trong (dung theo schema), HOAC 400 neu
        nghiep vu thuc te bat buoc phai co ngay bat dau/ket thuc (tuong tu truong hop organizationId)
