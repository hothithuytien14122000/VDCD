    priority: Thap
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/survey/surveys khong co body, Content-Type = text/plain
    expected_result:
      - Status code 400 hoac 415 Unsupported Media Type

  - id: TC_SURVEY_NEG_010
    title: "[Mutation] Gui kem truong khong duoc dinh nghia trong schema (extra field)"
