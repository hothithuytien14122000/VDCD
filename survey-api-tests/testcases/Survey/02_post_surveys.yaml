    expected_result:
      - Status code 200 (vi 300 la do dai toi da cho phep)
      - Response.data.name co do dai = 300, khong bi cat bot

  - id: TC_SURVEY_018
    title: "[Mutation] Them moi khao sat - name vuot qua 300 ky tu (301 ky tu)"
    priority: Thap
    tags: [mutation]
    category: Boundary
    steps:
