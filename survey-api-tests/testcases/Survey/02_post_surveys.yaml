# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): Survey
# Endpoint: POST /api/v1/survey/surveys
# Lien quan use case: UC-E.1 (Quan ly dot khao sat)
# Muc do anh huong: TAO DU LIEU THAT - gan nhan [Mutation]
#
# Ghi chu quan trong (phat hien khi test tren moi truong that):
#   - organizationId KHONG bat buoc theo schema Swagger, nhung thuc te BAT BUOC ve nghiep vu:
#     neu bo trong hoac truyen uuid khong ton tai/khong duoc phep, API tra ve 400 voi message
#     "Đơn vị không tồn tại hoặc không được phép sử dụng". Luon truyen organizationId hop le
#     (lay tu danh sach don vi cua tai khoan dang dang nhap) khi test tao moi.
#   - Schema: name (bat buoc, string, max 300), startDate/endDate (date-time), voteTarget (int32),
#     methods (mang enum SurveyMethod), status (enum SurveyStatus, mac dinh/bo trong = Nhap),
#     questions (mang {content (bat buoc, min 1 ky tu), type (enum SurveyQuestionType), order (int)})
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: Survey
endpoint: POST /api/v1/survey/surveys
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEY_012
    title: "[Mutation] Them moi khao sat hop le - luu nhap (status bo trong)"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - Co quyen tao khao sat
      - Co san 1 organizationId hop le ma tai khoan dang nhap duoc phep su dung
    steps:
      - Gui request POST /api/v1/survey/surveys voi body:
          name: "Khao sat test tu dong <timestamp>"
          startDate: "2026-11-01T00:00:00Z"
          endDate: "2026-11-30T00:00:00Z"
          organizationId: "<uuid-don-vi-hop-le>"
          voteTarget: 100
          methods: [1]
    expected_result:
      - Status code 200
      - Response.data co id (uuid) duoc sinh ra
      - Response.data.code co dang "KS-2026-xxx" (ma tu sinh theo nam bat dau + so thu tu)
      - Response.data.status = 1 (Nhap) do khong truyen status va chua co cau hoi
      - Response.data.name dung bang gia tri da gui
      - Response.data.histories co 1 ban ghi lich su voi status = 1

  - id: TC_SURVEY_013
    title: "[Mutation] Them moi khao sat va gui duyet luon (status = Cho phe duyet) kem cau hoi"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - Co quyen tao khao sat, co organizationId hop le
    steps:
      - Gui request POST /api/v1/survey/surveys voi body:
          name: "Khao sat test gui duyet <timestamp>"
          startDate: "2026-11-01T00:00:00Z"
          endDate: "2026-11-30T00:00:00Z"
          organizationId: "<uuid-don-vi-hop-le>"
          voteTarget: 50
          methods: [1, 2]
          status: 2
          questions:
            - content: "Ban co hai long voi dich vu cong truc tuyen khong?"
              type: 1
              order: 1
    expected_result:
      - Status code 200
      - Response.data.status = 2 (Cho phe duyet)
      - Response.data.questions co 1 cau hoi dung noi dung da gui

  - id: TC_SURVEY_013b
    title: "[Mutation] Them moi khao sat voi nhieu hinh thuc, nhieu cau hoi, du cac truong tuy chon"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    steps:
      - "Gui request POST /api/v1/survey/surveys voi body co day du (name, startDate, endDate, organizationId, voteTarget, methods=[1,2,3], description) va 5 cau hoi voi order 1..5"
    expected_result:
      - Status code 200
      - Response.data.methods = [1,2,3], methodNames tuong ung dung thu tu (hoac theo thu tu enum - CAN XAC NHAN)
      - Response.data.questions co du 5 cau hoi, giu dung thu tu order da gui

  # ---------- Boundary value ----------
