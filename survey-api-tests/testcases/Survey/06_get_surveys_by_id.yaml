# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): Survey
# Endpoint: GET /api/v1/survey/surveys/{id}
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: Survey
endpoint: GET /api/v1/survey/surveys/{id}
test_cases:

  - id: TC_SURVEY_023
    title: Lay chi tiet khao sat theo id hop le
    priority: Cao
    category: Happy path
    preconditions:
      - Da co id cua mot khao sat ton tai
    steps:
      - Gui request GET /api/v1/survey/surveys/{id} voi id hop le
    expected_result:
      - Status code 200
      - Response.data.id trung voi id da truyen
      - Response.data co day du thong tin: cau hoi (questions), lich su (histories) neu co

  - id: TC_SURVEY_023b
    title: Lay chi tiet khao sat da co nhieu lan thay doi trang thai - kiem tra histories
    priority: Trung binh
    category: Happy path
    preconditions:
      - Co 1 khao sat da trai qua it nhat 2 lan doi trang thai (vi du Nhap -> Cho phe duyet -> Da phe duyet)
    steps:
      - Gui request GET /api/v1/survey/surveys/{id}
    expected_result:
      - Status code 200
      - Response.data.histories co nhieu hon 1 ban ghi, sap xep theo thoi gian (tang hoac giam dan - CAN XAC NHAN),
        moi ban ghi co status, createdByUserId/UserName, createdOnDate day du

  - id: TC_SURVEY_024
    title: Lay chi tiet khao sat voi id khong ton tai
    priority: Cao
    category: Negative
    steps:
      - Gui request GET /api/v1/survey/surveys/{id} voi id = uuid ngau nhien khong ton tai trong he thong
    expected_result:
      - "Da xac nhan tren moi truong that: Status code 404 Not Found"
      - "Response.message = \"Không tìm thấy khảo sát\""

  - id: TC_SURVEY_025
    title: Lay chi tiet khao sat voi id sai dinh dang (khong phai uuid)
    priority: Trung binh
    category: Negative
    steps:
      - Gui request GET /api/v1/survey/surveys/abc-khong-phai-uuid
    expected_result:
      - "Da xac nhan tren moi truong that: Status code 404 Not Found (route khong khop do id khong dung dinh dang uuid)"

  - id: TC_SURVEY_025b
    title: Id la chuoi rong (goi truc tiep /api/v1/survey/surveys/ co dau / cuoi)
    priority: Thap
    category: Negative
    steps:
      - Gui request GET /api/v1/survey/surveys/
    expected_result:
      - Status code 404 Not Found (route khong khop), hoac tra ve nhu goi danh sach GET /surveys (tuy routing)

  - id: TC_SURVEY_025c
    title: Id la uuid toan so 0 (00000000-0000-0000-0000-000000000000)
    priority: Thap
    category: Boundary
    steps:
      - Gui request GET /api/v1/survey/surveys/00000000-0000-0000-0000-000000000000
    expected_result:
      - Status code 404 Not Found (gia tri hop le ve dinh dang nhung khong ton tai ban ghi nao)

  - id: TC_SURVEY_025d
    title: Id chua ky tu dac biet / co gang injection qua route parameter
    priority: Trung binh
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys/' OR '1'='1 (url-encoded)"
    expected_result:
      - Status code 400 hoac 404, khong gay loi 500, khong lo du lieu

  - id: TC_SURVEY_025e
    title: Goi API khi khong co token => 401
    priority: Trung binh
    category: Security
    steps:
      - Gui request GET /api/v1/survey/surveys/{id-hop-le} KHONG kem Authorization
    expected_result:
      - Status code 401 Unauthorized

  - id: TC_SURVEY_DC_030
    title: Kiem tra khong lo thong tin khi khao sat thuoc don vi khac (neu co phan quyen theo don vi)
    priority: Trung binh
    category: Security / Data consistency
    preconditions:
      - Co 1 tai khoan bi gioi han theo 1 don vi cu the (khong phai SUPER_ADMIN)
      - Co 1 khao sat thuoc don vi KHAC voi don vi cua tai khoan do
    steps:
      - Dang nhap bang tai khoan bi gioi han, gui GET /api/v1/survey/surveys/{id-cua-don-vi-khac}
    expected_result:
      - "Status code 403 Forbidden hoac 404 Not Found (khong duoc xem du lieu khao sat cua don vi khac)"
      - "CAN XAC NHAN quy tac phan quyen thuc te, hien tai Swagger ghi \"Cross-company: du lieu toan he thong\" nen co the API nay KHONG gioi han theo don vi (moi tai khoan deu xem duoc) - neu vay bo qua test nay"
