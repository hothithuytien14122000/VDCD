# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): Survey
# Endpoint: GET /api/v1/survey/surveys
# Lien quan use case: UC-E.1 (Quan ly dot khao sat)
#
# Ghi chu chung:
#   - Header bat buoc: Authorization: Bearer <token>
#   - Tham so "filter" la 1 chuoi JSON duoc encode, vi du:
#       filter={"keyword":"KS-2026","status":1,"year":2026}
#   - SurveyStatus (da xac nhan tren moi truong that cds.geneat.pro):
#       1 = Nhap, 2 = Cho phe duyet, 3 = Da phe duyet, 4 = Bi tu choi, 5 = Dang dien ra, 6 = Da ket thuc
#   - SurveyMethod (da xac nhan tren moi truong that):
#       1 = Truc tuyen, 2 = Truc tiep, 3 = Gian tiep qua phieu
#   - Response thuc te co dang: { data: { page, size, totalPages, totalElements, numberOfElements,
#       content: [...] }, code, message, isSuccess }
#   - Da kiem chung tren moi truong that: filter JSON khong hop le => 400, message "Bộ lọc không hợp lệ"
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: Survey
endpoint: GET /api/v1/survey/surveys
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEY_001
    title: Lay danh sach khao sat - khong truyen tham so (mac dinh)
    priority: Cao
    category: Happy path
    preconditions:
      - "Da co token hop le voi quyen quan ly khao sat (vi du: SUPER_ADMIN)"
      - "He thong da co san it nhat 1 ban ghi khao sat"
    steps:
      - "Gui request GET den /api/v1/survey/surveys voi header Authorization hop le, khong truyen page/size/filter/sort"
    expected_result:
      - "Status code 200"
      - "Response.isSuccess = true"
      - "Response.data.content la mang danh sach khao sat, kem day du thong tin phan trang (page, size, totalElements, totalPages, numberOfElements)"
      - "Moi phan tu trong content co day du cac truong: id, code, name, startDate, endDate, organizationId, organizationName, voteTarget, methods, methodNames, resultCount, status, statusName"
      - "Gia tri mac dinh page=1, size=20 (hoac gia tri mac dinh thuc te cua he thong - CAN XAC NHAN)"

  - id: TC_SURVEY_002
    title: Lay danh sach khao sat co phan trang (page, size) hop le
    priority: Cao
    category: Happy path
    preconditions:
      - "He thong co nhieu hon 1 trang du lieu khao sat"
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=1&size=5"
      - "Gui tiep request GET /api/v1/survey/surveys?page=2&size=5"
    expected_result:
      - "Ca 2 request tra ve status code 200"
      - "So luong phan tu content moi trang <= size da truyen"
      - "Danh sach o trang 1 va trang 2 khong trung lap id"
      - "Response.data.page phan anh dung trang dang xem"
      - "totalElements/totalPages giong nhau giua 2 lan goi (du lieu khong doi giua 2 request)"

  - id: TC_SURVEY_003
    title: Loc danh sach khao sat theo keyword (ten/ma khao sat/ten don vi)
    priority: Cao
    category: Happy path
    preconditions:
      - "Co san mot khao sat voi ten hoac ma da biet truoc, vi du \"KS-2026-01\""
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"keyword\":\"KS-2026\"}"
    expected_result:
      - "Status code 200"
      - "Tat ca ban ghi tra ve co ten hoac ma hoac ten don vi chua chuoi \"KS-2026\" (khong phan biet hoa/thuong)"
      - "Neu khong co ban ghi phu hop, tra ve content = [], khong bao loi"

  - id: TC_SURVEY_004
    title: Loc danh sach khao sat theo status
    priority: Trung binh
    category: Happy path
    preconditions:
      - "Co it nhat 1 khao sat voi status = 1 (Nhap)"
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"status\":1}"
    expected_result:
      - "Status code 200"
      - "Tat ca ban ghi tra ve co status = 1"

  - id: TC_SURVEY_005
    title: Loc danh sach khao sat theo method (hinh thuc khao sat)
    priority: Trung binh
    category: Happy path
    preconditions:
      - "Co it nhat 1 khao sat chua hinh thuc Truc tuyen (method = 1)"
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"method\":1}"
    expected_result:
      - "Status code 200"
      - "Tat ca ban ghi tra ve co mang methods chua gia tri 1"

  - id: TC_SURVEY_006
    title: Loc danh sach khao sat theo submitted = true (da trinh duyet, khong phai Nhap)
    priority: Trung binh
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"submitted\":true}"
    expected_result:
      - "Status code 200"
      - "Khong co ban ghi nao trong ket qua co status = 1 (Nhap)"

  - id: TC_SURVEY_006b
    title: Loc danh sach khao sat theo submitted = false
    priority: Thap
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"submitted\":false}"
    expected_result:
      - "Status code 200"
      - "Tat ca ban ghi tra ve co status = 1 (Nhap) - \"chua trinh duyet\" (CAN XAC NHAN: submitted=false co nghia la CHI lay Nhap, hay lay tat ca khong loc?)"

  - id: TC_SURVEY_007
    title: Loc danh sach khao sat theo nam (year) va theo don vi (organizationId)
    priority: Trung binh
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"year\":2026,\"organizationId\":\"<uuid-don-vi-hop-le>\"}"
    expected_result:
      - "Status code 200"
      - "Tat ca ban ghi tra ve co ngay bat dau hoac ngay ket thuc nam trong nam 2026"
      - "Tat ca ban ghi tra ve co organizationId trung voi gia tri da loc"

  - id: TC_SURVEY_007b
    title: Ket hop nhieu dieu kien loc cung luc (keyword + status + method + year)
    priority: Trung binh
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"keyword\":\"KS\",\"status\":3,\"method\":1,\"year\":2026}"
    expected_result:
      - "Status code 200"
      - "Ket qua tra ve thoa DONG THOI tat ca dieu kien (AND), khong phai chi can thoa 1 trong cac dieu kien (OR)"

  - id: TC_SURVEY_008
    title: Sap xep danh sach khao sat (sort) tang dan / giam dan
    priority: Thap
    category: Happy path
    steps:
      - "Gui request GET /api/v1/survey/surveys?sort=-startDate"
      - "Gui request GET /api/v1/survey/surveys?sort=startDate"
    expected_result:
      - "Status code 200 cho ca 2 request"
      - "Danh sach o request dau (sort=-startDate) duoc sap xep theo startDate giam dan"
      - "Danh sach o request sau (sort=startDate) duoc sap xep theo startDate tang dan"
      - "DA XAC NHAN tren moi truong that (2026-10-06): cu phap thuc su hoat dong la tien to \"-\" = giam dan,
        khong tien to = tang dan (vi du \"-startDate\"). Cu phap kieu SQL \"startDate desc\"/\"startDate asc\"
        (co khoang trang) bi server AM THAM BO QUA - van tra 200 nhung khong sap xep gi ca, khong bao loi.
        Can cap nhat lai tai lieu API cho dung cu phap thuc te."

  - id: TC_SURVEY_008b
    title: "[BUG] Sap xep nhieu truong: truong dau TANG DAN roi mot truong GIAM DAN (vd \"status,-startDate\")"
    priority: Trung binh
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys?sort=status,-startDate"
    expected_result:
      - "KY VONG: Status code 200, sap xep uu tien theo status tang dan, cung status thi sap theo startDate giam dan"
      - "THUC TE (DA XAC NHAN 2026-10-06): Status code 500 (\"No generic method 'ThenByDescending' on type
        'System.Linq.Queryable' is compatible...\" - loi trong ham GeneatThenByDescending/OrderingHelper
        phia backend). Day la LOI THAT SU, can bao lai cho dev."
      - "Dieu kien chinh xac gay loi (da khoanh vung bang thuc nghiem, test voi nhieu cap truong khac nhau:
        status/startDate/endDate/voteTarget/code): loi xay ra KHI VA CHI KHI truong sort DAU TIEN la TANG DAN
        (khong co dau \"-\") VA co it nhat 1 truong SAU DO la GIAM DAN. Khong phu thuoc ten truong cu the."

  - id: TC_SURVEY_008c
    title: "[Doi chung voi 008b] Sap xep nhieu truong: truong dau GIAM DAN roi truong TANG DAN (vd \"-startDate,status\")"
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys?sort=-startDate,status"
    expected_result:
      - "Status code 200 (KHONG loi 500) - xac nhan bug o TC_SURVEY_008b chi xay ra khi truong dau la
        TANG DAN, khong phai do ham ThenBy/ThenByDescending luon luon loi"

  - id: TC_SURVEY_008d
    title: "[Doi chung voi 008b] Sap xep nhieu truong: ca 2 truong deu GIAM DAN (vd \"-status,-startDate\")"
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys?sort=-status,-startDate"
    expected_result:
      - "Status code 200 (KHONG loi 500) - cung co them bang chung: loi chi xay ra khi CHIEU cua truong dau
        (tang dan) KHAC CHIEU cua truong sau (giam dan), khong phai do co truong giam dan trong danh sach"

  # ---------- Boundary / phan trang bat thuong ----------
  - id: TC_SURVEY_BV_001
    title: Phan trang voi page = 0
    priority: Trung binh
    category: Boundary
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=0&size=10"
    expected_result:
      - "Status code 200 va he thong tu dong coi nhu page=1, HOAC 400 Bad Request neu validate chat che (CAN XAC NHAN hanh vi thuc te)"
      - "Khong duoc tra ve danh sach rong mot cach vo ly neu co du lieu"

  - id: TC_SURVEY_BV_002
    title: Phan trang voi page la so am
    priority: Trung binh
    category: Boundary
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=-1&size=10"
    expected_result:
      - "Status code 400 Bad Request, hoac tu dong ve page=1 (CAN XAC NHAN)"
      - "Khong gay loi 500"

  - id: TC_SURVEY_BV_003
    title: Phan trang voi size = 0
    priority: Trung binh
    category: Boundary
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=1&size=0"
    expected_result:
      - "Status code 400, hoac tra ve content rong, hoac dung size mac dinh (CAN XAC NHAN)"
      - "Khong gay loi 500"

  - id: TC_SURVEY_BV_004
    title: Phan trang voi size am
    priority: Thap
    category: Boundary
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=1&size=-5"
    expected_result:
      - "Status code 400 Bad Request, khong gay loi 500"

  - id: TC_SURVEY_BV_005
    title: Phan trang voi size rat lon (vuot gioi han cho phep, vi du 100000)
    priority: Trung binh
    category: Boundary
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=1&size=100000"
    expected_result:
      - "Status code 200 nhung he thong tu gioi han size toi da hop ly (vi du 100 hoac 200), KHONG tra ve toan bo du lieu khong kiem soat gay qua tai (CAN XAC NHAN gioi han cu the)"
      - "Hoac 400 Bad Request neu he thong validate chat che"

  - id: TC_SURVEY_BV_006
    title: Phan trang voi page vuot qua tong so trang hien co
    priority: Thap
    category: Boundary
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=9999&size=10"
    expected_result:
      - "Status code 200"
      - "Response.data.content = [] (mang rong), khong bao loi"

  - id: TC_SURVEY_BV_007
    title: Truyen page/size khong phai so (vi du page=abc)
    priority: Trung binh
    category: Boundary
    steps:
      - "Gui request GET /api/v1/survey/surveys?page=abc&size=xyz"
    expected_result:
      - "Status code 400 Bad Request (loi parse tham so)"

  # ---------- Negative / validate dau vao ----------
  - id: TC_SURVEY_009
    title: Lay danh sach khao sat voi filter la chuoi JSON khong hop le
    priority: Trung binh
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={khong-phai-json-hop-le"
    expected_result:
      - "Da xac nhan tren moi truong that: Status code 400 Bad Request"
      - "Response.message = \"Bộ lọc không hợp lệ\""

  - id: TC_SURVEY_009b
    title: Lay danh sach khao sat voi filter la JSON hop le nhung field khong ton tai
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"truong_khong_ton_tai\":\"abc\"}"
    expected_result:
      - "Status code 200, he thong bo qua field la (khong loc gi), tra ve toan bo danh sach (CAN XAC NHAN - co the he thong tra loi 400 neu validate schema cua filter)"

  - id: TC_SURVEY_009c
    title: filter voi sai kieu du lieu (status la chuoi thay vi so)
    priority: Trung binh
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"status\":\"abc\"}"
    expected_result:
      - "Status code 400 Bad Request (sai kieu du lieu), khong gay loi 500"

  - id: TC_SURVEY_009d
    title: filter rong {}
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={}"
    expected_result:
      - "Status code 200, tra ve toan bo danh sach khong loc (tuong duong khong truyen filter)"

  - id: TC_SURVEY_010
    title: Goi API danh sach khao sat khi khong co token (Unauthorized)
    priority: Cao
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys KHONG kem header Authorization"
    expected_result:
      - "Status code 401 Unauthorized"
      - "Response khong tra ve du lieu khao sat"

  - id: TC_SURVEY_011
    title: Goi API danh sach khao sat voi token khong hop le / het han
    priority: Cao
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys voi header Authorization = \"Bearer token_khong_hop_le\""
    expected_result:
      - "Status code 401 Unauthorized"

  - id: TC_SURVEY_011b
    title: Goi API voi header Authorization sai dinh dang (thieu tu khoa "Bearer")
    priority: Trung binh
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys voi header Authorization = \"<token>\" (khong co \"Bearer \")"
    expected_result:
      - "Status code 401 Unauthorized"

  - id: TC_SURVEY_011c
    title: Goi API voi token da het han (exp trong qua khu)
    priority: Cao
    category: Security
    preconditions:
      - "Co 1 token JWT hop le ve chu ky nhung da qua thoi gian \"exp\""
    steps:
      - "Gui request GET /api/v1/survey/surveys voi token da het han"
    expected_result:
      - "Status code 401 Unauthorized, message the hien ro la do token het han (khong phai loi chung chung)"

  - id: TC_SURVEY_SEC_001
    title: "[Security] Keyword chua ky tu dac biet / co gang SQL injection"
    priority: Cao
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"keyword\":\"' OR '1'='1\"}"
      - "Gui them 1 request voi keyword = \"'; DROP TABLE Surveys; --\""
    expected_result:
      - "Status code 200 (khong phai 500)"
      - "He thong xu ly ky tu dac biet nhu 1 chuoi tim kiem thong thuong (khong khop ban ghi nao, hoac 400 neu validate dau vao), KHONG lam lo du lieu toan bo bang hay gay loi he thong"
      - "Du lieu he thong khong bi anh huong (kiem tra lai bang 1 request GET danh sach binh thuong sau do)"

  - id: TC_SURVEY_SEC_002
    title: "[Security] Keyword chua ma HTML/JavaScript (kiem tra XSS phan anh)"
    priority: Trung binh
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"keyword\":\"<script>alert(1)</script>\"}"
    expected_result:
      - "Status code 200, danh sach tra ve rong (khong khop ket qua nao)"
      - "Chuoi script KHONG duoc thuc thi va khong gay loi response (noi dung chi la du lieu JSON thong thuong)"

  - id: TC_SURVEY_SEC_003
    title: "[Security] Keyword co do dai rat lon (vi du 10000 ky tu)"
    priority: Thap
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys?filter={\"keyword\":\"<chuoi 10000 ky tu lap lai 'a'>\"}"
    expected_result:
      - "Status code 200 hoac 400 (gioi han do dai filter), khong timeout, khong gay loi 500"

  - id: TC_SURVEY_010b
    title: Goi sai phuong thuc HTTP (POST/PUT/DELETE) tren endpoint danh sach ma khong truyen id
    priority: Thap
    category: Negative
    steps:
      - "Gui request PUT /api/v1/survey/surveys (khong co id) hoac DELETE /api/v1/survey/surveys"
    expected_result:
      - "Status code 404 Not Found hoac 405 Method Not Allowed (tuy routing), khong gay loi 500"

  # ---------- Data consistency ----------
  - id: TC_SURVEY_DC_001
    title: Kiem tra tinh nhat quan giua danh sach va chi tiet
    priority: Trung binh
    category: Data consistency
    steps:
      - "Gui GET /api/v1/survey/surveys?page=1&size=1 de lay 1 khao sat"
      - "Gui GET /api/v1/survey/surveys/{id} voi id vua lay duoc"
    expected_result:
      - "Thong tin tom tat trong danh sach (name, code, status, methods...) phai KHOP HOAN TOAN voi thong tin chi tiet tra ve tu API GET theo id"

  - id: TC_SURVEY_DC_002
    title: Kiem tra Cross-company - du lieu toan he thong, khong bi gioi han theo don vi cua nguoi dung
    priority: Cao
    category: Data consistency / Security
    preconditions:
      - "Tai khoan dang dang nhap (SUPER_ADMIN) khong gioi han theo 1 don vi cu the (organizationId rong trong token)"
      - "He thong co khao sat thuoc nhieu don vi khac nhau"
    steps:
      - "Gui request GET /api/v1/survey/surveys (khong filter)"
    expected_result:
      - "Status code 200"
      - "Danh sach tra ve gom khao sat cua NHIEU don vi khac nhau (khong chi gioi han 1 don vi) - xac nhan dung mo ta \"Cross-company\" trong tai lieu API"
