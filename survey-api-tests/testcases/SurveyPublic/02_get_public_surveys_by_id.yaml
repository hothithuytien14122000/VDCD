# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyPublic
# Endpoint: GET /api/v1/public/surveys/{id}
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyPublic
endpoint: GET /api/v1/public/surveys/{id}
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYPUBLIC_003
    title: Lay noi dung chi tiet 1 dot khao sat dang mo (kem danh sach cau hoi)
    priority: Cao
    category: Happy path
    preconditions:
      - "Co id cua 1 khao sat dang mo (lay tu GET /api/v1/public/surveys)"
    steps:
      - "Gui request GET /api/v1/public/surveys/{id}"
    expected_result:
      - "Status code 200"
      - "Response co day du thong tin khao sat va danh sach cau hoi (id cau hoi, noi dung, loai cau hoi)"
      - "Cau hoi duoc sap xep theo dung thu tu \"order\" da cau hinh"

  # ---------- Negative ----------
  - id: TC_SURVEYPUBLIC_004
    title: Lay chi tiet khao sat cong khai voi id khong ton tai
    priority: Cao
    category: Negative
    steps:
      - "Gui request GET /api/v1/public/surveys/{id} voi id = uuid ngau nhien khong ton tai"
    expected_result:
      - "Status code 404 Not Found (khong lo thong tin khao sat khong hop le cho nguoi dan)"

  - id: TC_SURVEYPUBLIC_004b
    title: Lay chi tiet khao sat da Da ket thuc (khong con mo) qua API cong khai
    priority: Cao
    category: Negative
    preconditions:
      - "Id la cua khao sat da Da ket thuc (status = 6)"
    steps:
      - "Gui request GET /api/v1/public/surveys/{id}"
    expected_result:
      - "Status code 404 Not Found - nguoi dan khong duoc xem/danh gia khao sat da ket thuc qua API cong khai"

  - id: TC_SURVEYPUBLIC_004c
    title: Lay chi tiet khao sat dang Nhap/Cho phe duyet/Bi tu choi qua API cong khai
    priority: Cao
    category: Negative / Security
    preconditions:
      - "Id la cua khao sat voi status = 1, 2 hoac 4 (chua duoc cong bo chinh thuc)"
    steps:
      - "Gui request GET /api/v1/public/surveys/{id}"
    expected_result:
      - "Status code 404 Not Found - quan trong ve bao mat: KHONG duoc de lo noi dung khao sat chua duyet/dang nhap ra cong khai cho nguoi dan xem truoc"

  - id: TC_SURVEYPUBLIC_004d
    title: Lay chi tiet khao sat chi co hinh thuc Truc tiep/Gian tiep (khong co Truc tuyen)
    priority: Trung binh
    category: Negative
    preconditions:
      - "Khao sat dang dien ra nhung methods = [2] hoac [3] (khong co 1 - Truc tuyen)"
    steps:
      - "Gui request GET /api/v1/public/surveys/{id}"
    expected_result:
      - "Status code 404 Not Found (khao sat nay khong mo cho hinh thuc truc tuyen nen khong the xem/danh gia qua kenh cong khai)"

  - id: TC_SURVEYPUBLIC_004e
    title: Id sai dinh dang (khong phai uuid)
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/public/surveys/abc-khong-phai-uuid"
    expected_result:
      - "Status code 404 Not Found (hoac 400 - CAN XAC NHAN)"

  # ---------- Security ----------
  - id: TC_SURVEYPUBLIC_SEC_010
    title: "[Security] Khong lo cau tra loi/thong ke noi bo (resultCount, cac phieu da gui) trong chi tiet cong khai"
    priority: Cao
    category: Security / Data exposure
    steps:
      - "Gui request GET /api/v1/public/surveys/{id} voi 1 khao sat dang mo"
    expected_result:
      - "Response CHI gom thong tin can thiet de nguoi dan tra loi (noi dung khao sat, danh sach cau hoi)"
      - "KHONG tra ve resultCount, histories, danh sach phieu da nhan, hay thong tin quan tri khac"

  - id: TC_SURVEYPUBLIC_SEC_011
    title: "[Security] Id chua ky tu dac biet / co gang injection"
    priority: Trung binh
    category: Security
    steps:
      - "Gui request GET /api/v1/public/surveys/' OR '1'='1 (url-encoded)"
    expected_result:
      - "Status code 400 hoac 404, khong gay loi 500, khong lo du lieu"
