# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyPublic
# Endpoint: POST /api/v1/public/surveys/{id}/responses
# Muc do anh huong: TAO DU LIEU THAT - gan nhan [Mutation]
#
# Ghi chu:
#   - SurveyAnswerResult: 1 = Hai long, 2 = Chua hai long (CAN XAC NHAN thu tu chinh xac voi dev)
#   - API yeu cau captchaToken hop le, lay tu dich vu captcha phia FE. Cac kich ban "happy path"
#     (gui thanh cong) can thuc hien thu cong qua UI hoac tich hop voi dich vu captcha test rieng;
#     cac kich ban duoi day tap trung vao validate du lieu dau vao.
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyPublic
endpoint: POST /api/v1/public/surveys/{id}/responses
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYPUBLIC_005
    title: "[Mutation] Gui danh gia truc tuyen hop le - tra loi du tat ca cau hoi, co captcha hop le"
    priority: Cao
    tags: [mutation]
    category: Happy path
    preconditions:
      - Co id khao sat dang mo voi N cau hoi
      - Co 1 captchaToken hop le (thuc hien thu cong tren UI hoac qua dich vu captcha test)
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi body:
          captchaToken: "<token-captcha-hop-le>"
          note: "Gop y test tu dong"
          answers: "<mang cau tra loi du cho tat ca N cau hoi, moi cau co questionId va result (1 hoac 2)>"
    expected_result:
      - Status code 200
      - Response.data tra ve ma phieu xac nhan (confirmation code) khong rong
      - resultCount cua khao sat tang them 1 (kiem tra gian tiep qua GET chi tiet khao sat)

  - id: TC_SURVEYPUBLIC_005b
    title: "[Mutation] Gui danh gia hop le KHONG kem note (note la optional)"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi captchaToken hop le, answers day du,
        KHONG co truong note
    expected_result:
      - Status code 200 (note khong bat buoc theo schema)

  - id: TC_SURVEYPUBLIC_005c
    title: "[Mutation] Gui danh gia voi tat ca cau tra loi deu la Hai long (result=1)"
    priority: Thap
    tags: [mutation]
    category: Happy path
    steps:
      - Gui request hop le voi toan bo answers co result = 1
    expected_result:
      - Status code 200, phieu duoc ghi nhan dung voi toan bo Hai long - kiem tra qua
        SurveyReport sau khi khao sat ket thuc, satisfied tang tuong ung

  - id: TC_SURVEYPUBLIC_005d
    title: "[Mutation] Gui 2 phieu danh gia lien tiep cho cung 1 khao sat (tu 2 'nguoi dan' khac nhau - khong dang nhap)"
    priority: Trung binh
    tags: [mutation]
    category: Happy path
    steps:
      - Gui 2 request POST /api/v1/public/surveys/{id}/responses doc lap, moi request co captchaToken rieng
        va noi dung tra loi khac nhau
    expected_result:
      - Status code 200 cho ca 2 request (he thong cho phep nhieu phieu tu nhieu nguon vi API cong khai
        khong yeu cau dang nhap / khong gioi han theo tai khoan)
      - resultCount tang them 2, 2 ma phieu xac nhan khac nhau

  # ---------- Negative / validate ----------
  - id: TC_SURVEYPUBLIC_006
    title: "[Mutation] Gui danh gia truc tuyen thieu captchaToken"
    priority: Cao
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi body KHONG co truong captchaToken
    expected_result:
      - Status code 400 Bad Request
      - Response bao loi captchaToken la bat buoc

  - id: TC_SURVEYPUBLIC_006b
    title: "[Mutation] captchaToken la chuoi rong"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi captchaToken = ""
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYPUBLIC_007
    title: "[Mutation] Gui danh gia truc tuyen voi captchaToken khong hop le / da het han"
    priority: Cao
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi captchaToken = "token_gia_mao_khong_hop_le"
        va answers day du
    expected_result:
      - Status code 400 (hoac 422) - captcha khong hop le, khong ghi nhan phieu tra loi

  - id: TC_SURVEYPUBLIC_007b
    title: "[Mutation] Gui lai cung 1 captchaToken da duoc su dung truoc do (chong tai su dung)"
    priority: Trung binh
    tags: [mutation]
    category: Negative / Security
    preconditions:
      - Co 1 captchaToken da duoc dung thanh cong trong 1 request truoc do
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi CUNG captchaToken da dung o tren
    expected_result:
      - Status code 400 (captcha token chi dung duoc 1 lan, da bi vo hieu sau khi su dung) -
        CAN XAC NHAN co co che chong tai su dung token hay khong

  - id: TC_SURVEYPUBLIC_008
    title: "[Mutation] Gui danh gia truc tuyen nhung tra loi thieu cau hoi"
    priority: Cao
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi answers chi gom mot phan cau hoi
        (thieu it nhat 1 cau), captchaToken hop le
    expected_result:
      - Status code 400 Bad Request
      - Response bao loi "phai tra loi day du tat ca cau hoi"

  - id: TC_SURVEYPUBLIC_008b
    title: "[Mutation] answers la mang rong []"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi answers = []
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYPUBLIC_008c
    title: "[Mutation] answers co 1 cau hoi bi tra loi 2 lan (duplicate questionId)"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request voi answers co 2 phan tu cung questionId (vi du tra loi 1 cau hoi 2 lan voi 2 ket qua khac nhau)
    expected_result:
      - Status code 400 Bad Request (du lieu khong nhat quan), hoac he thong chi lay ban ghi cuoi cung
        (CAN XAC NHAN)

  - id: TC_SURVEYPUBLIC_008d
    title: "[Mutation] answers co result ngoai enum SurveyAnswerResult (vi du 0, 3, -1)"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request voi 1 phan tu answers co result = 3
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYPUBLIC_009
    title: "[Mutation] Gui danh gia cho khao sat da ket thuc hoac khong con mo"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    preconditions:
      - Id la cua mot khao sat da Da ket thuc (status = 6)
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi du lieu hop le (captcha + answers)
    expected_result:
      - Status code 400 hoac 404 (khong the gui phieu cho khao sat khong con dang mo)

  - id: TC_SURVEYPUBLIC_009b
    title: "[Mutation] Gui danh gia cho khao sat voi id khong ton tai"
    priority: Trung binh
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi id ngau nhien khong ton tai
    expected_result:
      - Status code 404 Not Found

  - id: TC_SURVEYPUBLIC_010
    title: "[Mutation] Gui danh gia voi questionId khong thuoc khao sat / khong hop le"
    priority: Thap
    tags: [mutation]
    category: Negative
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses voi 1 phan tu answers co questionId
        la uuid ngau nhien khong thuoc khao sat
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYPUBLIC_NEG_001
    title: "[Mutation] note qua dai (vi du 10000 ky tu)"
    priority: Thap
    tags: [mutation]
    category: Boundary
    steps:
      - Gui request hop le voi note la chuoi 10000 ky tu
    expected_result:
      - Status code 400 neu co gioi han do dai, hoac 200 neu khong gioi han (CAN XAC NHAN)

  # ---------- Security ----------
  - id: TC_SURVEYPUBLIC_SEC_020
    title: "[Mutation][Security] note chua ma script (XSS) - kiem tra luu tru an toan"
    priority: Trung binh
    tags: [mutation]
    category: Security
    steps:
      - Gui request hop le voi note = "<script>alert(document.cookie)</script>"
    expected_result:
      - Status code 200 (he thong khong bat buoc phai tu choi noi dung nay)
      - Du lieu duoc luu nguyen van hoac encode an toan - khi hien thi o trang quan tri
        (GET /finished/{id}/comments) KHONG duoc de script thuc thi (can phoi hop kiem tra phia FE)

  - id: TC_SURVEYPUBLIC_SEC_021
    title: "[Mutation][Security] gui hang loat phieu tu dong (bot) de kiem tra co che chong spam"
    priority: Trung binh
    tags: [mutation]
    category: Security
    steps:
      - Gui lien tiep nhieu request POST /api/v1/public/surveys/{id}/responses trong thoi gian ngan
        (vi du 20 request/giay) tu cung 1 nguon (IP)
    expected_result:
      - He thong co co che han che (rate limit / yeu cau captcha moi lan / chan tam thoi) de tranh
        1 nguon gui qua nhieu phieu anh huong tinh chinh xac cua thong ke hai long
        (CAN XAC NHAN co co che chong spam hay khong - day la rui ro nghiep vu quan trong vi ket qua
        khao sat anh huong truc tiep den so lieu bao cao CDS)

  - id: TC_SURVEYPUBLIC_SEC_022
    title: "[Mutation][Security] API nay KHONG duoc yeu cau/chap nhan token dang nhap (dung thiet ke cong khai)"
    priority: Thap
    tags: [mutation]
    category: Security
    steps:
      - Gui request POST /api/v1/public/surveys/{id}/responses kem 1 Authorization token hop le cua
        tai khoan quan tri
    expected_result:
      - Status code 200 neu du lieu hop le (token duoc bo qua, khong anh huong - API van la cong khai),
        request KHONG duoc gan nham voi tai khoan quan tri do (vi API nay danh cho nguoi dan an danh)
