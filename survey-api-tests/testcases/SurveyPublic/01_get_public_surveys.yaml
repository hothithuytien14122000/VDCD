# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyPublic (API cong khai cho nguoi dan - KHONG can token)
# Endpoint: GET /api/v1/public/surveys
# Lien quan use case: UC-E.4 (Thuc hien khao sat truc tuyen)
#
# Ghi chu: Response thuc te la { data: [ {id, name, organizationName, endDate, questionCount,
#          estimatedMinutes} ], code, message, isSuccess } - data la MANG PHANG, khong phan trang.
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyPublic
endpoint: GET /api/v1/public/surveys
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYPUBLIC_001
    title: Lay danh sach cac dot khao sat dang mo cho cong dan danh gia truc tuyen
    priority: Cao
    category: Happy path
    preconditions:
      - "Co it nhat 1 khao sat dang dien ra (status = 5), co hinh thuc Truc tuyen (methods chua 1), va thoi gian hien tai nam trong khoang startDate - endDate"
    steps:
      - "Gui request GET /api/v1/public/surveys (khong can token)"
    expected_result:
      - "Status code 200"
      - "Response.data chi gom cac khao sat dang dien ra, co hinh thuc Truc tuyen, con trong thoi gian hop le"
      - "Moi khao sat co kem questionCount (so luong cau hoi) va estimatedMinutes (thoi gian uoc tinh)"
      - "Khong tra ve cac khao sat da ket thuc, chua bat dau, hoac khong co hinh thuc Truc tuyen"

  - id: TC_SURVEYPUBLIC_002
    title: Lay danh sach khao sat cong khai khi khong co khao sat nao dang mo
    priority: Trung binh
    category: Happy path
    preconditions:
      - "Khong co khao sat nao thoa dieu kien dang dien ra + Truc tuyen + con thoi gian"
    steps:
      - "Gui request GET /api/v1/public/surveys"
    expected_result:
      - "Status code 200"
      - "Response.data tra ve mang rong [], khong bao loi"

  # ---------- Security / Data exposure ----------
  - id: TC_SURVEYPUBLIC_SEC_001
    title: "[Security] Khong can token van truy cap duoc (dung thiet ke API cong khai)"
    priority: Cao
    category: Security
    steps:
      - "Gui request GET /api/v1/public/surveys, dam bao KHONG gui header Authorization"
    expected_result:
      - "Status code 200 (API nay phai hoat dong khong can dang nhap, dung voi muc dich phuc vu nguoi dan)"

  - id: TC_SURVEYPUBLIC_SEC_002
    title: "[Security] Khong lo du lieu noi bo nhay cam (organizationId, resultCount, description noi bo, histories)"
    priority: Cao
    category: Security / Data exposure
    steps:
      - "Gui request GET /api/v1/public/surveys, kiem tra ky cau truc tung phan tu tra ve"
    expected_result:
      - "Moi phan tu CHI gom cac truong can thiet cho nguoi dan (id, name, organizationName, endDate, questionCount, estimatedMinutes)"
      - "KHONG tra ve: organizationId (uuid noi bo), voteTarget, resultCount, histories, createdByUserId, hay bat ky thong tin quan tri noi bo nao khac"

  - id: TC_SURVEYPUBLIC_SEC_003
    title: "[Security] Kiem tra CORS / rate limit co ban (API cong khai de bi spam/scrape)"
    priority: Thap
    category: Security
    steps:
      - "Gui lien tiep nhieu request (vi du 50 request trong vai giay) toi GET /api/v1/public/surveys"
    expected_result:
      - "He thong khong bi sap (van tra ve 200 hoac 429 Too Many Requests neu co rate limit)"
      - "Khong gay loi 500 do qua tai (CAN XAC NHAN co co che rate-limit/chong scrape hay khong)"

  # ---------- Boundary / data consistency ----------
  - id: TC_SURVEYPUBLIC_BV_001
    title: Khao sat vua het han (endDate = thoi diem hien tai) khong con xuat hien
    priority: Trung binh
    category: Boundary
    preconditions:
      - "Co 1 khao sat voi endDate rat gan voi thoi diem hien tai (vi du con 1 phut)"
    steps:
      - "Gui request GET /api/v1/public/surveys ngay truoc va ngay sau thoi diem endDate"
    expected_result:
      - "Truoc endDate: khao sat con xuat hien (neu da dien ra va con hieu luc)"
      - "Sau endDate: khao sat KHONG con xuat hien trong danh sach"

  - id: TC_SURVEYPUBLIC_DC_001
    title: Doi chieu questionCount voi so cau hoi thuc te cua khao sat
    priority: Trung binh
    category: Data consistency
    steps:
      - "Gui request GET /api/v1/public/surveys, lay 1 khao sat va questionCount cua no"
      - "Gui request GET /api/v1/public/surveys/{id} de lay danh sach cau hoi chi tiet"
    expected_result:
      - "So luong phan tu trong mang questions o API chi tiet phai BANG dung questionCount da cong bo o API danh sach"
