# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyReport
# Endpoint: GET /api/v1/survey/surveys/finished/{id}
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyReport
endpoint: GET /api/v1/survey/surveys/finished/{id}
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYREPORT_007
    title: Lay chi tiet khao sat da hoan thanh (thong tin, tong quan, ket qua theo tung cau hoi, theo nguon phieu)
    priority: Cao
    category: Happy path
    preconditions:
      - "Id cua 1 khao sat da ket thuc (status = 6) va da co nguoi tham gia tra loi"
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/{id}"
    expected_result:
      - "Status code 200"
      - "Response co thong tin chung cua khao sat (ten, ma, thoi gian, don vi)"
      - "Response co so lieu tong quan (tong nguoi tham gia, hai long, chua hai long, ty le)"
      - "Response co ket qua chi tiet theo tung cau hoi (so luong hai long/chua hai long moi cau)"
      - "Response co ket qua theo tung nguon phieu (Truc tuyen / Truc tiep / Gian tiep qua phieu)"

  - id: TC_SURVEYREPORT_007b
    title: Tong participants = tong so nguoi tham gia cong don tu tat ca nguon phieu
    priority: Trung binh
    category: Data consistency
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/{id}"
    expected_result:
      - "Tong so nguoi tham gia theo tung nguon phieu (Truc tuyen + Truc tiep + Gian tiep) phai BANG tong participants o phan tong quan"

  - id: TC_SURVEYREPORT_007c
    title: Tong hai long/chua hai long theo tung cau hoi khop voi tong quan (neu khao sat chi co 1 cau hoi)
    priority: Thap
    category: Data consistency
    preconditions:
      - "Khao sat chi co dung 1 cau hoi"
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/{id}"
    expected_result:
      - "So lieu hai long/chua hai long cua cau hoi duy nhat do phai KHOP voi so lieu tong quan satisfied/unsatisfied"

  - id: TC_SURVEYREPORT_007d
    title: Khao sat da hoan thanh nhung KHONG co nguoi tham gia nao (participants = 0)
    priority: Trung binh
    category: Boundary
    preconditions:
      - "Co 1 khao sat da ket thuc nhung khong co ai tra loi"
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/{id}"
    expected_result:
      - "Status code 200"
      - "participants = 0, satisfied = 0, unsatisfied = 0"
      - "satisfiedRate/unsatisfiedRate = 0 (khong phai loi chia cho 0 / NaN / null bat thuong)"

  # ---------- Negative ----------
  - id: TC_SURVEYREPORT_008
    title: Lay chi tiet khao sat da hoan thanh voi id khong ton tai hoac chua Finished
    priority: Trung binh
    category: Negative
    preconditions:
      - "Id cua khao sat dang o trang thai khac Finished (vi du status = 5 Dang dien ra), hoac id khong ton tai"
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/{id}"
    expected_result:
      - "Status code 404 Not Found"

  - id: TC_SURVEYREPORT_008b
    title: Id sai dinh dang (khong phai uuid)
    priority: Thap
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/abc-khong-phai-uuid"
    expected_result:
      - "Status code 404 Not Found"

  # ---------- Security ----------
  - id: TC_SURVEYREPORT_SEC_020
    title: "[Security] Goi API khi khong co token"
    priority: Cao
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/{id} KHONG kem Authorization"
    expected_result:
      - "Status code 401 Unauthorized"
