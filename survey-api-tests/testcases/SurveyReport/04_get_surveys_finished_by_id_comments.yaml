# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyReport
# Endpoint: GET /api/v1/survey/surveys/finished/{id}/comments
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyReport
endpoint: GET /api/v1/survey/surveys/finished/{id}/comments
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYREPORT_009
    title: Lay danh sach y kien gop y cua khao sat da hoan thanh (phan trang, moi nhat truoc)
    priority: Cao
    category: Happy path
    preconditions:
      - Khao sat da hoan thanh co it nhat 1 phieu co ghi chu/gop y (note khac rong)
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments?page=1&size=20
    expected_result:
      - Status code 200
      - Danh sach duoc sap xep theo thoi gian tao giam dan (moi nhat o dau)
      - So luong ban ghi tra ve <= size

  - id: TC_SURVEYREPORT_009b
    title: Cuon vo han (infinite scroll) - lay trang 2 noi tiep trang 1 khong bi trung/thieu
    priority: Trung binh
    category: Happy path
    steps:
      - Gui GET /api/v1/survey/surveys/finished/{id}/comments?page=1&size=10
      - Gui GET /api/v1/survey/surveys/finished/{id}/comments?page=2&size=10
    expected_result:
      - Status code 200 ca 2 request
      - Khong co y kien nao bi trung giua 2 trang, khong co y kien nao bi thieu (lien tuc theo thu tu thoi gian)

  - id: TC_SURVEYREPORT_009c
    title: Danh sach y kien chi gom phieu co note (bo qua phieu khong co gop y)
    priority: Trung binh
    category: Happy path
    preconditions:
      - Khao sat co ca phieu co note va phieu khong co note (note rong/null)
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments
    expected_result:
      - Status code 200
      - Danh sach CHI gom cac phieu co note khac rong (khong hien thi phieu khong co gop y)
        - CAN XAC NHAN logic nay dung thiet ke

  # ---------- Boundary ----------
  - id: TC_SURVEYREPORT_010
    title: Lay danh sach y kien gop y voi size vuot qua gioi han toi da (100)
    priority: Trung binh
    category: Boundary
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments?size=500
    expected_result:
      - Status code 200 (he thong tu dong gioi han size toi da = 100), hoac 400 Bad Request neu validate chat che
        (CAN XAC NHAN hanh vi thuc te)
      - Neu tra ve 200, so luong ban ghi <= 100

  - id: TC_SURVEYREPORT_010b
    title: size = 0 hoac size am
    priority: Thap
    category: Boundary
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments?size=0
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments?size=-1
    expected_result:
      - Khong gay loi 500; tra ve 400 hoac tu dong dung gia tri mac dinh hop le

  - id: TC_SURVEYREPORT_010c
    title: Khao sat khong co y kien gop y nao
    priority: Thap
    category: Boundary
    preconditions:
      - Khao sat da hoan thanh nhung khong co phieu nao co note
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments
    expected_result:
      - Status code 200, danh sach tra ve rong, khong bao loi

  # ---------- Negative ----------
  - id: TC_SURVEYREPORT_010d
    title: Id khao sat khong ton tai hoac chua Finished
    priority: Trung binh
    category: Negative
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments voi id khong ton tai
    expected_result:
      - Status code 404 Not Found

  # ---------- Security / Privacy ----------
  - id: TC_SURVEYREPORT_SEC_030
    title: "[Security/Privacy] Y kien tu phieu Truc tuyen khong lo thong tin dinh danh ca nhan nguoi gui"
    priority: Cao
    category: Security / Data exposure
    preconditions:
      - Co y kien duoc gui tu phieu Truc tuyen (nguoi dan an danh, khong dang nhap)
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments
    expected_result:
      - Cac y kien tu phieu Truc tuyen KHONG di kem thong tin dinh danh ca nhan nguoi gui (ten, sdt, email,
        dia chi IP...) vi nguoi dan gui an danh - chi nen co noi dung gop y + thoi gian + co the la hinh thuc

  - id: TC_SURVEYREPORT_SEC_031
    title: "[Security] Goi API khi khong co token"
    priority: Cao
    category: Security
    steps:
      - Gui request GET /api/v1/survey/surveys/finished/{id}/comments KHONG kem Authorization
    expected_result:
      - Status code 401 Unauthorized

  - id: TC_SURVEYREPORT_BV_004
    title: "[BUG dung chung voi TC_SURVEY_008b] Sort nhieu truong: tang dan roi giam dan gay 500"
    priority: Trung binh
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished/{id}/comments?sort=id,-createdOnDate"
    expected_result:
      - "KY VONG: Status code 200"
      - "THUC TE (DA XAC NHAN 2026-10-06): Status code 500 - cung 1 loi goc voi TC_SURVEY_008b"
