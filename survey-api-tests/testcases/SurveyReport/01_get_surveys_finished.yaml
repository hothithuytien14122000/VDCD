# =====================================================================================
# Test case API - Phan he: Khao sat muc do hai long cua nguoi dan
# Nhom (tag Swagger): SurveyReport
# Endpoint: GET /api/v1/survey/surveys/finished
# Lien quan use case: UC-E.5 (Tong ket ket qua khao sat truc tuyen)
#
# Ghi chu: Phan tu trong danh sach KHONG co truong "status" (ngam dinh = Da ket thuc),
#          ma co cac truong thong ke rieng: participants, satisfied, unsatisfied,
#          satisfiedRate, unsatisfiedRate.
# =====================================================================================

module: Khao sat muc do hai long cua nguoi dan
api_group: SurveyReport
endpoint: GET /api/v1/survey/surveys/finished
test_cases:

  # ---------- Happy path ----------
  - id: TC_SURVEYREPORT_001
    title: Lay danh sach khao sat da hoan thanh (Status = Finished)
    priority: Cao
    category: Happy path
    preconditions:
      - Co it nhat 1 khao sat voi status = 6 (Da ket thuc)
    steps:
      - Gui request GET /api/v1/survey/surveys/finished
    expected_result:
      - Status code 200
      - "Moi ban ghi co kem: participants (so nguoi tham gia), satisfied (so nguoi hai long), unsatisfied (so nguoi chua hai long), satisfiedRate/unsatisfiedRate (ty le %)"
      - satisfied + unsatisfied <= participants
      - satisfiedRate = (satisfied / participants) * 100, lam tron hop ly

  - id: TC_SURVEYREPORT_001b
    title: "Kiem tra cong thuc ty le: satisfiedRate + unsatisfiedRate = 100% (hoac gan 100% do lam tron)"
    priority: Trung binh
    category: Happy path
    steps:
      - Gui request GET /api/v1/survey/surveys/finished, lay 1 ban ghi co participants > 0
    expected_result:
      - satisfiedRate + unsatisfiedRate xap xi 100 (sai so cho phep do lam tron, vi du +-0.1)

  - id: TC_SURVEYREPORT_002
    title: Loc danh sach khao sat da hoan thanh theo keyword / year / organizationId
    priority: Trung binh
    category: Happy path
    steps:
      - Gui request GET /api/v1/survey/surveys/finished?filter={"keyword":"KS-2026","year":2026,"organizationId":"<uuid>"}
    expected_result:
      - Status code 200
      - Ket qua tra ve dung voi dieu kien loc (ten/ma/ten don vi chua keyword, nam = 2026, organizationId tuong ung)

  - id: TC_SURVEYREPORT_003
    title: Phan trang danh sach khao sat da hoan thanh
    priority: Trung binh
    category: Happy path
    steps:
      - Gui request GET /api/v1/survey/surveys/finished?page=1&size=5
    expected_result:
      - Status code 200
      - So luong ban ghi <= 5

  - id: TC_SURVEYREPORT_003b
    title: Sap xep danh sach theo satisfiedRate (neu ho tro sort theo truong tinh toan)
    priority: Thap
    category: Happy path
    steps:
      - Gui request GET /api/v1/survey/surveys/finished?sort=satisfiedRate desc
    expected_result:
      - Status code 200 va danh sach sap xep theo ty le hai long giam dan, HOAC 400 neu truong nay
        khong ho tro sort (CAN XAC NHAN danh sach truong sort duoc ho tro)

  # ---------- Negative / boundary ----------
  - id: TC_SURVEYREPORT_004
    title: Khong co khao sat nao da hoan thanh thoa dieu kien loc
    priority: Thap
    category: Boundary
    steps:
      - Gui request GET /api/v1/survey/surveys/finished?filter={"keyword":"tu-khoa-khong-ton-tai-xyz"}
    expected_result:
      - Status code 200
      - Danh sach tra ve rong, khong bao loi

  - id: TC_SURVEYREPORT_004b
    title: filter voi year khong hop le (vi du chuoi thay vi so, hoac nam am)
    priority: Thap
    category: Negative
    steps:
      - Gui request GET /api/v1/survey/surveys/finished?filter={"year":"abc"}
    expected_result:
      - Status code 400 Bad Request

  - id: TC_SURVEYREPORT_004c
    title: filter voi JSON khong hop le
    priority: Trung binh
    category: Negative
    steps:
      - Gui request GET /api/v1/survey/surveys/finished?filter={json-loi
    expected_result:
      - Status code 400 Bad Request, message ro rang (tuong tu "Bộ lọc không hợp lệ")

  - id: TC_SURVEYREPORT_BV_001
    title: Phan trang voi page/size bat thuong (page=0, size am, size qua lon)
    priority: Trung binh
    category: Boundary
    steps:
      - Gui lan luot cac request voi page=0, size=-5, size=100000
    expected_result:
      - Khong gay loi 500 trong bat ky truong hop nao; tra ve 400 hoac tu dieu chinh ve gia tri hop le
        (CAN XAC NHAN - tuong tu hanh vi cua GET /survey/surveys)

  # ---------- Security ----------
  - id: TC_SURVEYREPORT_SEC_001
    title: "[Security] Keyword chua ky tu dac biet / SQL injection"
    priority: Trung binh
    category: Security
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished?filter={\"keyword\":\"' OR '1'='1\"}"
    expected_result:
      - Status code 200 (khong phai 500), danh sach tra ve dung hoac rong

  - id: TC_SURVEYREPORT_SEC_002
    title: "[Security] Goi API khi khong co token"
    priority: Cao
    category: Security
    steps:
      - Gui request GET /api/v1/survey/surveys/finished KHONG kem Authorization
    expected_result:
      - Status code 401 Unauthorized

  # ---------- Data consistency ----------
  - id: TC_SURVEYREPORT_DC_001
    title: Doi chieu danh sach finished voi danh sach chinh loc theo status=6
    priority: Trung binh
    category: Data consistency
    steps:
      - Gui request GET /api/v1/survey/surveys/finished
      - Gui request GET /api/v1/survey/surveys?filter={"status":6}
    expected_result:
      - Tap hop id cua 2 danh sach phai GIONG NHAU (cung la tap khao sat co status=6)

  - id: TC_SURVEYREPORT_DC_002
    title: Doi chieu participants voi tong so ket qua (results) cua khao sat do
    priority: Trung binh
    category: Data consistency
    steps:
      - Gui request GET /api/v1/survey/surveys/finished, lay participants cua 1 khao sat
      - Gui request GET /api/v1/survey/surveys/{surveyId}/results?page=1&size=1 de lay totalElements
    expected_result:
      - participants phai BANG totalElements cua danh sach ket qua (SurveyResult) cua chinh khao sat do

  - id: TC_SURVEYREPORT_BV_002
    title: "[BUG dung chung voi TC_SURVEY_008b] Sort nhieu truong: tang dan roi giam dan gay 500"
    priority: Trung binh
    category: Negative
    steps:
      - "Gui request GET /api/v1/survey/surveys/finished?sort=name,-startDate"
    expected_result:
      - "KY VONG: Status code 200"
      - "THUC TE (DA XAC NHAN 2026-10-06): Status code 500 - cung 1 loi goc voi TC_SURVEY_008b. Luu y:
        field \"startDate\"/\"participants\" rieng le bi BO QUA AM THAM khi dung lam sort (khong loi,
        khong sap xep) nen phai dung field \"name\" (sortable that su) de cham vao duoc code loi."
